name: OMEGA Unsigned Reproducibility Probe

on:
  push:
    paths:
      - ".github/workflows/omega-unsigned-reproducibility-probe.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  SOURCE_SHA: 9980fbd6f0511377b01f799651c6cec351cbf74f
  BASE_RUN: "36603568959"
  LATEST_RUN: "36622846035"
  BASE_ARTIFACT_ID: "11049424026"
  LATEST_ARTIFACT_ID: "11058677837"
  ARTIFACT: OMEGA-Unsigned-Release-9980fbd6f0511377b01f799651c6cec351cbf74f

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download both immutable unsigned artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p base latest
          curl -fLsS \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$BASE_ARTIFACT_ID/zip" \
            -o base.zip
          curl -fLsS \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$LATEST_ARTIFACT_ID/zip" \
            -o latest.zip
          file base.zip latest.zip
          unzip -l base.zip
          unzip -l latest.zip
          unzip -oq base.zip -d base || [ "$?" -eq 1 ]
          unzip -oq latest.zip -d latest || [ "$?" -eq 1 ]
          BASE_APK="$(find base -type f -name OMEGA-Engine-unsigned.apk -print -quit)"
          LATEST_APK="$(find latest -type f -name OMEGA-Engine-unsigned.apk -print -quit)"
          test -s "$BASE_APK"
          test -s "$LATEST_APK"
          echo "BASE_APK=$BASE_APK" >> "$GITHUB_ENV"
          echo "LATEST_APK=$LATEST_APK" >> "$GITHUB_ENV"
          echo "OMEGA_REPRO_ARTIFACT_DOWNLOAD_PASS base=$BASE_ARTIFACT_ID latest=$LATEST_ARTIFACT_ID"

      - name: Compare APK bytes and normalized ZIP contents
        shell: bash
        run: |
          set -Eeuo pipefail
          bsha="$(sha256sum $BASE_APK | awk '{print $1}')"
          lsha="$(sha256sum $LATEST_APK | awk '{print $1}')"
          echo "OMEGA_REPRO_BASE_SHA=$bsha"
          echo "OMEGA_REPRO_LATEST_SHA=$lsha"

          python3 - <<'PY'
          import hashlib,json,zipfile
          from pathlib import Path

          def load(apk):
              z=zipfile.ZipFile(apk)
              rows={}
              meta={}
              for info in z.infolist():
                  data=z.read(info.filename)
                  rows[info.filename]=hashlib.sha256(data).hexdigest()
                  meta[info.filename]={
                      "date_time":info.date_time,
                      "compress_type":info.compress_type,
                      "external_attr":info.external_attr,
                      "CRC":info.CRC,
                      "file_size":info.file_size,
                      "compress_size":info.compress_size,
                  }
              return rows,meta

          import os
          base, bm=load(os.environ["BASE_APK"])
          latest, lm=load(os.environ["LATEST_APK"])
          names=sorted(set(base)|set(latest))
          missing_base=[x for x in names if x not in base]
          missing_latest=[x for x in names if x not in latest]
          changed=[x for x in names if x in base and x in latest and base[x]!=latest[x]]
          metadata_only=[
              x for x in names
              if x in base and x in latest and base[x]==latest[x] and bm[x]!=lm[x]
          ]
          print("OMEGA_REPRO_ENTRY_COUNT_BASE="+str(len(base)))
          print("OMEGA_REPRO_ENTRY_COUNT_LATEST="+str(len(latest)))
          print("OMEGA_REPRO_MISSING_BASE="+json.dumps(missing_base))
          print("OMEGA_REPRO_MISSING_LATEST="+json.dumps(missing_latest))
          print("OMEGA_REPRO_CHANGED_ENTRIES="+json.dumps(changed))
          print("OMEGA_REPRO_METADATA_ONLY_COUNT="+str(len(metadata_only)))
          Path("repro-result.json").write_text(json.dumps({
              "base_entries":len(base),
              "latest_entries":len(latest),
              "missing_base":missing_base,
              "missing_latest":missing_latest,
              "changed_entries":changed,
              "metadata_only_entries":metadata_only,
          },indent=2,sort_keys=True)+"\n")

          if not changed and not missing_base and not missing_latest:
              print("OMEGA_REPRO_CONTENT_EQUIVALENT=true")
          else:
              print("OMEGA_REPRO_CONTENT_EQUIVALENT=false")
          PY

      - name: Compare embedded release identity evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json,zipfile
          keys=[
            "source_sha","code_source_sha","omega_execution_id","omega_release_id",
            "release_epoch_id","release_epoch_sequence","finalized_at"
          ]
          def read(apk):
              with zipfile.ZipFile(apk) as z:
                  name="assets/evidence/release-stage.json"
                  obj=json.loads(z.read(name))
                  return {k:obj.get(k) for k in keys}
          import os
          b=read(os.environ["BASE_APK"])
          l=read(os.environ["LATEST_APK"])
          print("OMEGA_REPRO_BASE_RELEASE_STAGE="+json.dumps(b,sort_keys=True))
          print("OMEGA_REPRO_LATEST_RELEASE_STAGE="+json.dumps(l,sort_keys=True))
          print("OMEGA_REPRO_RELEASE_STAGE_DIFF="+json.dumps({
              k:[b.get(k),l.get(k)] for k in keys if b.get(k)!=l.get(k)
          },sort_keys=True))
          PY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: OMEGA-Unsigned-Reproducibility-Probe
          retention-days: 7
          path: repro-result.json
