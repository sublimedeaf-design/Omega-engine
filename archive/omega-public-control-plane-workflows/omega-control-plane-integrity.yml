name: OMEGA Control Plane Integrity

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "scripts/verify_control_plane.rb"
      - "scripts/control_state_policy.py"
      - "scripts/omega_gate_classifier.py"
      - "scripts/rollover_release_federation.py"
      - "external_validator/**"
      - "control-plane/**"
      - "tests/test_external_validator_admission.py"
      - "tests/test_control_state_policy.*"
      - "tests/test_generation_retry.mjs"
      - "tests/test_generation_reconciler_contract.py"
  push:
    paths:
      - ".github/workflows/**"
      - "scripts/verify_control_plane.rb"
      - "scripts/control_state_policy.py"
      - "scripts/omega_gate_classifier.py"
      - "scripts/rollover_release_federation.py"
      - "scripts/verify_federation_epoch.py"
      - "federation/epochs/**"
      - "external_validator/**"
      - "control-plane/**"
      - "tests/test_external_validator_admission.py"
      - "tests/test_control_state_policy.*"
      - "tests/test_generation_retry.mjs"
      - "tests/test_generation_reconciler_contract.py"

permissions:
  contents: read
  statuses: write

concurrency:
  # PR validation and production-main integrity are independent fault domains.
  # New commits may supersede older checks within the same ref, but main-state
  # churn must never cancel a pull-request proof.
  group: omega-control-plane-integrity-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install validator dependencies for admission tests
        run: python3 -m pip install -r external_validator/requirements.txt
      - name: Verify workflow syntax, immutable actions and failproof contracts
        shell: bash
        run: |
          ruby scripts/verify_control_plane.rb
          python3 scripts/omega_gate_classifier.py --self-test
          python3 -m py_compile scripts/rollover_release_federation.py external_validator/app.py
          node --check control-plane/certify.mjs
          node --check control-plane/certify-github.mjs
          node --check control-plane/reconcile.mjs
          node --check control-plane/generation-reconciler.mjs
          node --check control-plane/generation-reconciler-github.mjs
          python3 tests/test_control_state_policy.py
          node --test tests/test_control_state_policy.mjs
          node --test tests/test_generation_retry.mjs
          python3 tests/test_generation_reconciler_contract.py
          python3 tests/test_external_validator_admission.py

      - name: Publish exact-SHA control-plane integrity
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
        shell: bash
        run: |
          set -Eeuo pipefail
          state=failure
          [ "$RESULT" = success ] && state=success
          gh api --method POST "/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state="$state" \
            -f context="omega/control-plane-integrity" \
            -f description="control-plane syntax, classifier and routing contract: $RESULT" \
            -f target_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" >/dev/null
