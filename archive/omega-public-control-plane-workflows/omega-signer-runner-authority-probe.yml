# authority probe generation: 5
name: OMEGA Signer Runner Authority Probe

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/omega-signer-runner-authority-probe.yml"
  workflow_dispatch:
  schedule:
    # Public control-plane runner: continuously verify the free self-hosted signer fallback.
    - cron: "17 */6 * * *"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PRIVATE_REPOSITORY: sublimedeaf-design/Omega-engines
    steps:
      - name: Detect scoped OMEGA Release App credentials
        id: release_app_config
        env:
          APP_CLIENT_ID: ${{ vars.OMEGA_RELEASE_APP_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.OMEGA_RELEASE_APP_PRIVATE_KEY }}
        shell: bash
        run: |
          set -Eeuo pipefail
          configured=false
          if [ -n "${APP_CLIENT_ID:-}" ] && [ -n "${APP_PRIVATE_KEY:-}" ]; then
            configured=true
          fi
          echo "configured=$configured" >> "$GITHUB_OUTPUT"
          echo "OMEGA_SIGNER_RELEASE_APP_CONFIGURED=$configured"

      - name: Mint repository-scoped OMEGA Release App token
        id: release_app
        if: steps.release_app_config.outputs.configured == 'true'
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.OMEGA_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.OMEGA_RELEASE_APP_PRIVATE_KEY }}
          owner: sublimedeaf-design
          repositories: Omega-engines

      - name: Probe registered ARM64 signer runner
        env:
          RELEASE_APP_TOKEN: ${{ steps.release_app.outputs.token }}
          OMEGA_BOOTSTRAP_TOKEN: ${{ secrets.OMEGA_BOOTSTRAP_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          token="${RELEASE_APP_TOKEN:-${OMEGA_BOOTSTRAP_TOKEN:-}}"
          [ -n "$token" ] || { echo "OMEGA_SIGNER_AUTH_TOKEN_MISSING" >&2; exit 78; }
          source=bootstrap
          [ -n "${RELEASE_APP_TOKEN:-}" ] && source=release_app
          echo "OMEGA_SIGNER_AUTH_SOURCE=$source"
          runners_json="$(mktemp)"
          trap 'rm -f "$runners_json"' EXIT
          code="$(curl -sS -o "$runners_json" -w '%{http_code}' \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -H "Authorization: Bearer $token" \
            "https://api.github.com/repos/$PRIVATE_REPOSITORY/actions/runners?per_page=100" || true)"
          if [ "$code" != 200 ]; then
            echo "OMEGA_SIGNER_RUNNER_LIST_AUTH_BLOCKED http=$code" >&2
            exit 78
          fi
          state="$(python3 - "$runners_json" <<'PY'
          import json,sys
          required={"self-hosted","linux","arm64","omega-signer-rescue-v2"}
          with open(sys.argv[1],encoding="utf-8") as fh:
              rows=json.load(fh).get("runners",[])
          matches=[]
          for row in rows:
              labels={str(x.get("name") or "").lower() for x in row.get("labels",[])}
              if required <= labels:
                  matches.append(row)
          online=[r for r in matches if str(r.get("status") or "").lower()=="online"]
          print(f"{len(matches)}|{len(online)}")
          PY
          )"
          IFS='|' read -r matching online <<<"$state"
          if [ "${matching:-0}" -lt 1 ]; then
            echo "OMEGA_SIGNER_RUNNER_REGISTRATION_MISSING matching=0" >&2
            exit 80
          fi
          if [ "${online:-0}" -lt 1 ]; then
            echo "OMEGA_SIGNER_RUNNER_OFFLINE matching=$matching online=0" >&2
            exit 81
          fi
          echo "OMEGA_SIGNER_RUNNER_ONLINE_PASS matching=$matching online=$online"

      - name: Probe private self-hosted signer opt-in
        if: ${{ always() }}
        env:
          RELEASE_APP_TOKEN: ${{ steps.release_app.outputs.token }}
          OMEGA_BOOTSTRAP_TOKEN: ${{ secrets.OMEGA_BOOTSTRAP_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          token="${RELEASE_APP_TOKEN:-${OMEGA_BOOTSTRAP_TOKEN:-}}"
          [ -n "$token" ] || { echo "OMEGA_SIGNER_AUTH_TOKEN_MISSING" >&2; exit 78; }
          source=bootstrap
          [ -n "${RELEASE_APP_TOKEN:-}" ] && source=release_app
          echo "OMEGA_SIGNER_AUTH_SOURCE=$source"
          variable_json="$(mktemp)"
          trap 'rm -f "$variable_json"' EXIT
          code="$(curl -sS -o "$variable_json" -w '%{http_code}' \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -H "Authorization: Bearer $token" \
            "https://api.github.com/repos/$PRIVATE_REPOSITORY/actions/variables/OMEGA_ENABLE_PRIVATE_SELF_HOSTED" || true)"
          if [ "$code" != 200 ]; then
            echo "OMEGA_SIGNER_RUNNER_CONFIG_AUTH_BLOCKED http=$code" >&2
            exit 78
          fi
          opt_in="$(python3 - "$variable_json" <<'PY'
          import json,sys
          with open(sys.argv[1],encoding="utf-8") as fh:
              print(str(json.load(fh).get("value") or "").strip())
          PY
          )"
          if [ "$opt_in" != 1 ]; then
            echo "OMEGA_SIGNER_RUNNER_OPT_IN_BLOCKED value=${opt_in:-unset}" >&2
            exit 79
          fi
          echo "OMEGA_SIGNER_RUNNER_OPT_IN_PASS value=1"

      - name: Probe private self-hosted runner registration authority
        if: ${{ always() }}
        env:
          RELEASE_APP_TOKEN: ${{ steps.release_app.outputs.token }}
          OMEGA_BOOTSTRAP_TOKEN: ${{ secrets.OMEGA_BOOTSTRAP_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          token="${RELEASE_APP_TOKEN:-${OMEGA_BOOTSTRAP_TOKEN:-}}"
          [ -n "$token" ] || { echo "OMEGA_SIGNER_AUTH_TOKEN_MISSING" >&2; exit 78; }
          source=bootstrap
          [ -n "${RELEASE_APP_TOKEN:-}" ] && source=release_app
          echo "OMEGA_SIGNER_AUTH_SOURCE=$source"
          tmp="$(mktemp)"
          trap 'rm -f "$tmp"' EXIT
          code="$(curl -sS -o "$tmp" -w '%{http_code}' -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -H "Authorization: Bearer $token" \
            "https://api.github.com/repos/$PRIVATE_REPOSITORY/actions/runners/registration-token" || true)"
          rm -f "$tmp"
          if [ "$code" = 201 ]; then
            echo "OMEGA_SIGNER_RUNNER_AUTHORITY_PASS http=201"
            exit 0
          fi
          echo "OMEGA_SIGNER_RUNNER_AUTHORITY_BLOCKED http=$code" >&2
          exit 78
