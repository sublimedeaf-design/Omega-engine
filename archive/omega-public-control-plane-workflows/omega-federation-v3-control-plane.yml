name: OMEGA Federation v3 Control Plane
on:
  push:
    branches: [main, 'federation/**']
    paths:
      - 'federation/**'
      - 'scripts/verify_federation_epoch.py'
      - '.github/workflows/omega-federation-v3-control-plane.yml'
  pull_request:
    paths:
      - 'federation/**'
      - 'scripts/verify_federation_epoch.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - run: python scripts/verify_federation_epoch.py federation/epochs/current.json
