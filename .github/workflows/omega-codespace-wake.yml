name: OMEGA Free Codespace Bootstrap

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/omega-codespace-wake.yml"
      - "bootstrap/omega/**"
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

concurrency:
  group: omega-free-codespace-bootstrap
  cancel-in-progress: true

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      OMEGA_BOOTSTRAP_TOKEN: ${{ secrets.OMEGA_BOOTSTRAP_TOKEN }}
      OMEGA_CODESPACE_LIFECYCLE_TOKEN: ${{ secrets.OMEGA_BOOTSTRAP_TOKEN }}
      OMEGA_FORCE_RESTART: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify Codespaces secret tooling
        shell: bash
        run: |
          gh secret set --help | grep -q codespaces
      - name: Discover and converge existing OMEGA runtime
        id: wake
        shell: bash
        run: |
          python3 bootstrap/omega/codespace_wake.py
      - name: Repair omega-ci inside the existing Codespace
        if: ${{ steps.wake.outputs.codespace_name != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.OMEGA_BOOTSTRAP_TOKEN }}
          OMEGA_CODESPACE_NAME: ${{ steps.wake.outputs.codespace_name }}
        run: |
          set +x
          gh codespace cp -c "$OMEGA_CODESPACE_NAME" \
            bootstrap/omega/repair_runner_remote.sh \
            remote:/tmp/omega-repair-runner.sh
          gh codespace ssh -c "$OMEGA_CODESPACE_NAME" \
            "bash /tmp/omega-repair-runner.sh"
      - name: Seed private Codespaces federation secret
        if: ${{ always() }}
        shell: bash
        run: |
          if [ -z "${OMEGA_BOOTSTRAP_TOKEN:-}" ]; then
            echo "OMEGA_BOOTSTRAP_SECRET_NOT_CONFIGURED"
            exit 0
          fi
          set +x
          printf '%s' "$OMEGA_BOOTSTRAP_TOKEN" | \
            GH_TOKEN="$OMEGA_BOOTSTRAP_TOKEN" gh secret set OMEGA_FEDERATION_PAT \
              --app codespaces \
              --repo sublimedeaf-design/Omega-engines
