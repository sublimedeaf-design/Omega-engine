name: OMEGA Free Codespace Bootstrap

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

concurrency:
  group: omega-free-codespace-bootstrap
  cancel-in-progress: true

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      OMEGA_CODESPACE_LIFECYCLE_TOKEN: ${{ secrets.OMEGA_CODESPACE_LIFECYCLE_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Discover and wake existing OMEGA runtime
        shell: bash
        run: |
          python3 bootstrap/omega/codespace_wake.py
