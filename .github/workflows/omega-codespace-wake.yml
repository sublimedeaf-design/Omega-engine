name: OMEGA Free Codespace Bootstrap

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/omega-codespace-wake.yml"
      - "bootstrap/omega/**"
  schedule:
    - cron: "*/5 * * * *"

permissions:
  actions: write
  contents: read

concurrency:
  group: omega-free-codespace-bootstrap-v3
  cancel-in-progress: true

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      OMEGA_BOOTSTRAP_TOKEN: ${{ secrets.OMEGA_BOOTSTRAP_TOKEN }}
      OMEGA_CODESPACE_LIFECYCLE_TOKEN: ${{ secrets.OMEGA_BOOTSTRAP_TOKEN }}
      OMEGA_FORCE_RESTART: "0"
    steps:
      - name: Cancel superseded bootstrap runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +x
          current="$GITHUB_RUN_ID"
          mapfile -t stale < <(
            gh api -X GET "/repos/$GITHUB_REPOSITORY/actions/runs" -f per_page=50 \
              --jq '.workflow_runs[]
                | select(.name=="OMEGA Free Codespace Bootstrap")
                | select(.status=="in_progress" or .status=="queued" or .status=="pending")
                | .id' \
              | grep -vx "$current" || true
          )
          for run_id in "${stale[@]}"; do
            gh api --method POST "/repos/$GITHUB_REPOSITORY/actions/runs/$run_id/cancel" >/dev/null 2>&1 || true
            echo "OMEGA_BOOTSTRAP_CANCELLED_SUPERSEDED run_id=$run_id"
          done
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify Codespaces secret tooling
        shell: bash
        run: |
          gh secret set --help | grep -q codespaces
      - name: Discover and converge existing OMEGA runtime
        id: wake
        shell: bash
        run: |
          python3 bootstrap/omega/codespace_wake.py
      - name: Hot-sync and reload private OMEGA runtime
        if: ${{ steps.wake.outputs.codespace_name != '' && env.OMEGA_FORCE_RESTART != '1' }}
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.OMEGA_BOOTSTRAP_TOKEN }}
          OMEGA_CODESPACE_NAME: ${{ steps.wake.outputs.codespace_name }}
        run: |
          set +x
          timeout 180s gh codespace ssh -c "$OMEGA_CODESPACE_NAME" -- bash -s \
            < bootstrap/omega/hot_sync_runtime_remote.sh

      - name: Reuse any existing configured omega-ci runner
        id: reuse
        if: ${{ steps.wake.outputs.codespace_name != '' && env.OMEGA_FORCE_RESTART != '1' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.OMEGA_BOOTSTRAP_TOKEN }}
          OMEGA_PRIMARY_CODESPACE: ${{ steps.wake.outputs.codespace_name }}
        run: |
          set +x
          mapfile -t discovered < <(
            gh api -X GET /user/codespaces -f per_page=100 \
              --jq '.codespaces
                | map(select(
                    .repository.full_name=="sublimedeaf-design/Omega-engines" or
                    .repository.full_name=="sublimedeaf-design/Omega-release" or
                    .repository.full_name=="sublimedeaf-design/Omega-validation" or
                    .repository.full_name=="sublimedeaf-design/Omega-agents" or
                    .repository.full_name=="sublimedeaf-design/Omega-recovery" or
                    .repository.full_name=="sublimedeaf-design/Jarv"
                  ))
                | sort_by(
                    (if ((.state // "")|ascii_downcase)=="available" or ((.state // "")|ascii_downcase)=="running" then 0 else 1 end),
                    (.last_used_at // .created_at)
                  )
                | .[0:20]
                | .[].name'
          )
          candidates=("$OMEGA_PRIMARY_CODESPACE")
          for name in "${discovered[@]}"; do
            [ "$name" = "$OMEGA_PRIMARY_CODESPACE" ] || candidates+=("$name")
          done

          reused=false
          deadline=$((SECONDS+420))
          for name in "${candidates[@]}"; do
            [ "$SECONDS" -lt "$deadline" ] || { echo "OMEGA_RUNNER_REUSE_BUDGET_EXHAUSTED"; break; }
            [ -n "$name" ] || continue
            echo "OMEGA_RUNNER_REUSE_PROBE codespace=$name"

            state="$(gh api -X GET "/user/codespaces/$name" --jq '.state' 2>/dev/null || true)"
            original_state="${state,,}"
            started_for_probe=false
            case "$original_state" in
              available|running) ;;
              *)
                gh api --method POST "/user/codespaces/$name/start" >/dev/null 2>&1 || true
                for _ in $(seq 1 18); do
                  sleep 5
                  state="$(gh api -X GET "/user/codespaces/$name" --jq '.state' 2>/dev/null || true)"
                  case "${state,,}" in
                    available|running) started_for_probe=true; break ;;
                  esac
                done
                ;;
            esac

            case "${state,,}" in
              available|running) ;;
              *)
                echo "OMEGA_RUNNER_REUSE_SKIP codespace=$name state=$state"
                continue
                ;;
            esac

            set +e
            output="$(timeout 30s gh codespace ssh -c "$name" -- bash -s \
              < bootstrap/omega/resume_registered_runner_remote.sh 2>&1)"
            rc=$?
            set -e
            printf '%s\n' "$output"
            if [ "$rc" = 0 ]; then
              echo "runner_reused=true" >> "$GITHUB_OUTPUT"
              echo "runner_codespace=$name" >> "$GITHUB_OUTPUT"
              echo "OMEGA_RUNNER_REUSE_SUCCESS codespace=$name"
              reused=true
              break
            fi

            if [ "$started_for_probe" = true ] && [ "$name" != "$OMEGA_PRIMARY_CODESPACE" ]; then
              gh api --method POST "/user/codespaces/$name/stop" >/dev/null 2>&1 || true
              echo "OMEGA_RUNNER_REUSE_CLEANUP_STOP codespace=$name"
            fi
          done

          if [ "$reused" != true ]; then
            echo "runner_reused=false" >> "$GITHUB_OUTPUT"
            echo "OMEGA_RUNNER_REUSE_NONE"
          fi

      - name: Repair omega-ci inside the existing Codespace
        if: ${{ steps.wake.outputs.codespace_name != '' && env.OMEGA_FORCE_RESTART != '1' && steps.reuse.outputs.runner_reused != 'true' }}
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.OMEGA_BOOTSTRAP_TOKEN }}
          OMEGA_CODESPACE_NAME: ${{ steps.wake.outputs.codespace_name }}
        run: |
          set +x
          body="$(mktemp)"
          code="$(curl -sS -o "$body" -w '%{http_code}' -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/sublimedeaf-design/Omega-engines/actions/runners/registration-token || true)"
          if [ "$code" != 201 ]; then
            rm -f "$body"
            echo "OMEGA_RUNNER_REGISTRATION_CAPABILITY_HTTP=$code" >&2
            exit 31
          fi
          registration_token="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["token"])' "$body")"
          rm -f "$body"
          echo "::add-mask::$registration_token"
          {
            printf '%s\n' "$registration_token"
            cat bootstrap/omega/repair_runner_remote.sh
          } | gh codespace ssh -c "$OMEGA_CODESPACE_NAME" -- bash -c \
            'IFS= read -r OMEGA_RUNNER_REGISTRATION_TOKEN; export OMEGA_RUNNER_REGISTRATION_TOKEN; exec bash -s'
          unset registration_token
      - name: Seed private Codespaces federation secret
        if: ${{ always() }}
        shell: bash
        run: |
          if [ -z "${OMEGA_BOOTSTRAP_TOKEN:-}" ]; then
            echo "OMEGA_BOOTSTRAP_SECRET_NOT_CONFIGURED"
            exit 0
          fi
          set +x
          printf '%s' "$OMEGA_BOOTSTRAP_TOKEN" | \
            GH_TOKEN="$OMEGA_BOOTSTRAP_TOKEN" gh secret set OMEGA_FEDERATION_PAT \
              --app codespaces \
              --repo sublimedeaf-design/Omega-engines
