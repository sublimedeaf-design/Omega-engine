name: OMEGA Free Codespace Bootstrap

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/omega-codespace-wake.yml"
      - "bootstrap/omega/**"
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"

permissions:
  actions: write
  contents: read

concurrency:
  group: omega-free-codespace-bootstrap-v5
  cancel-in-progress: false

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      OMEGA_BOOTSTRAP_TOKEN: ${{ secrets.OMEGA_BOOTSTRAP_TOKEN }}
      OMEGA_CODESPACE_LIFECYCLE_TOKEN: ${{ secrets.OMEGA_BOOTSTRAP_TOKEN }}
      OMEGA_FORCE_RESTART: "0"
      OMEGA_ENABLE_RUNNER_REPAIR: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify Codespaces secret tooling
        shell: bash
        run: |
          gh secret set --help | grep -q codespaces
      - name: Discover and converge existing OMEGA runtime
        id: wake
        shell: bash
        run: |
          python3 bootstrap/omega/codespace_wake.py
      - name: Hot-sync and reload private OMEGA runtime
        if: ${{ steps.wake.outputs.codespace_name != '' && env.OMEGA_FORCE_RESTART != '1' }}
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.OMEGA_BOOTSTRAP_TOKEN }}
          OMEGA_CODESPACE_NAME: ${{ steps.wake.outputs.codespace_name }}
        run: |
          set +x
          expected="$(gh api /repos/sublimedeaf-design/Omega-engines/commits/main --jq '.sha')"
          [[ "$expected" =~ ^[0-9a-f]{40}$ ]]
          echo "OMEGA_PRIVATE_TARGET_DISCOVERED sha=$expected"
          {
            printf 'export OMEGA_EXPECTED_PRIVATE_HEAD=%q\n' "$expected"
            cat bootstrap/omega/hot_sync_runtime_remote.sh
          } | timeout 180s gh codespace ssh -c "$OMEGA_CODESPACE_NAME" -- bash -s

      - name: Reuse any existing configured omega-ci runner
        id: reuse
        if: ${{ steps.wake.outputs.codespace_name != '' && env.OMEGA_FORCE_RESTART != '1' && env.OMEGA_ENABLE_RUNNER_REPAIR == '1' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.OMEGA_BOOTSTRAP_TOKEN }}
          OMEGA_PRIMARY_CODESPACE: ${{ steps.wake.outputs.codespace_name }}
        run: |
          set +x
          mapfile -t discovered < <(
            gh api -X GET /user/codespaces -f per_page=100 \
              --jq '.codespaces
                | map(select(
                    .repository.full_name=="sublimedeaf-design/Omega-engines" or
                    .repository.full_name=="sublimedeaf-design/Omega-release" or
                    .repository.full_name=="sublimedeaf-design/Omega-validation" or
                    .repository.full_name=="sublimedeaf-design/Omega-agents" or
                    .repository.full_name=="sublimedeaf-design/Omega-recovery" or
                    .repository.full_name=="sublimedeaf-design/Jarv"
                  ))
                | sort_by(
                    (if ((.state // "")|ascii_downcase)=="available" or ((.state // "")|ascii_downcase)=="running" then 0 else 1 end),
                    (.last_used_at // .created_at)
                  )
                | .[0:20]
                | .[].name'
          )
          candidates=("$OMEGA_PRIMARY_CODESPACE")
          for name in "${discovered[@]}"; do
            [ "$name" = "$OMEGA_PRIMARY_CODESPACE" ] || candidates+=("$name")
          done

          reused=false
          deadline=$((SECONDS+420))
          for name in "${candidates[@]}"; do
            [ "$SECONDS" -lt "$deadline" ] || { echo "OMEGA_RUNNER_REUSE_BUDGET_EXHAUSTED"; break; }
            [ -n "$name" ] || continue
            echo "OMEGA_RUNNER_REUSE_PROBE codespace=$name"

            state="$(gh api -X GET "/user/codespaces/$name" --jq '.state' 2>/dev/null || true)"
            original_state="${state,,}"
            started_for_probe=false
            case "$original_state" in
              available|running) ;;
              *)
                gh api --method POST "/user/codespaces/$name/start" >/dev/null 2>&1 || true
                for _ in $(seq 1 18); do
                  sleep 5
                  state="$(gh api -X GET "/user/codespaces/$name" --jq '.state' 2>/dev/null || true)"
                  case "${state,,}" in
                    available|running) started_for_probe=true; break ;;
                  esac
                done
                ;;
            esac

            case "${state,,}" in
              available|running) ;;
              *)
                echo "OMEGA_RUNNER_REUSE_SKIP codespace=$name state=$state"
                continue
                ;;
            esac

            set +e
            output="$(timeout 30s gh codespace ssh -c "$name" -- bash -s \
              < bootstrap/omega/resume_registered_runner_remote.sh 2>&1)"
            rc=$?
            set -e
            printf '%s\n' "$output"
            if [ "$rc" = 0 ]; then
              echo "runner_reused=true" >> "$GITHUB_OUTPUT"
              echo "runner_codespace=$name" >> "$GITHUB_OUTPUT"
              echo "OMEGA_RUNNER_REUSE_SUCCESS codespace=$name"
              reused=true
              break
            fi

            if [ "$started_for_probe" = true ] && [ "$name" != "$OMEGA_PRIMARY_CODESPACE" ]; then
              gh api --method POST "/user/codespaces/$name/stop" >/dev/null 2>&1 || true
              echo "OMEGA_RUNNER_REUSE_CLEANUP_STOP codespace=$name"
            fi
          done

          if [ "$reused" != true ]; then
            echo "runner_reused=false" >> "$GITHUB_OUTPUT"
            echo "OMEGA_RUNNER_REUSE_NONE"
          fi

      - name: Repair omega-ci inside the existing Codespace
        if: ${{ steps.wake.outputs.codespace_name != '' && env.OMEGA_FORCE_RESTART != '1' && env.OMEGA_ENABLE_RUNNER_REPAIR == '1' && steps.reuse.outputs.runner_reused != 'true' }}
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.OMEGA_BOOTSTRAP_TOKEN }}
          OMEGA_CODESPACE_NAME: ${{ steps.wake.outputs.codespace_name }}
        run: |
          set +x
          body="$(mktemp)"
          code="$(curl -sS -o "$body" -w '%{http_code}' -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/sublimedeaf-design/Omega-engines/actions/runners/registration-token || true)"
          if [ "$code" != 201 ]; then
            rm -f "$body"
            echo "OMEGA_RUNNER_REGISTRATION_CAPABILITY_HTTP=$code" >&2
            exit 31
          fi
          registration_token="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["token"])' "$body")"
          rm -f "$body"
          echo "::add-mask::$registration_token"
          {
            printf '%s\n' "$registration_token"
            cat bootstrap/omega/repair_runner_remote.sh
          } | gh codespace ssh -c "$OMEGA_CODESPACE_NAME" -- bash -c \
            'IFS= read -r OMEGA_RUNNER_REGISTRATION_TOKEN; export OMEGA_RUNNER_REGISTRATION_TOKEN; exec bash -s'
          unset registration_token
      - name: Verify private federation evidence externally
        if: ${{ always() && steps.wake.outputs.codespace_name != '' }}
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.OMEGA_BOOTSTRAP_TOKEN }}
        run: |
          set +x
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          for file in federation-access.json federation-executor.json; do
            code="$(curl -sS -o "$tmp/$file" -w '%{http_code}'               -H 'Accept: application/vnd.github.raw+json'               -H 'X-GitHub-Api-Version: 2026-03-10'               -H "Authorization: Bearer $GH_TOKEN"               "https://api.github.com/repos/sublimedeaf-design/Omega-engines/contents/evidence/codespaces-live/$file?ref=main" || true)"
            [ "$code" = 200 ] || { echo "OMEGA_EXTERNAL_EVIDENCE_HTTP_$code:$file" >&2; exit 41; }
          done
          python3 - "$tmp/federation-access.json" "$tmp/federation-executor.json" <<'PY'
          import datetime as dt,json,sys
          access=json.load(open(sys.argv[1])); exe=json.load(open(sys.argv[2]))
          expected={"Omega-release","Omega-validation","Omega-agents","Omega-recovery","Jarv"}
          assert access.get("authorized") is True
          assert set(access.get("peer_http",{}))==expected
          assert all(access["peer_http"][x]==200 for x in expected)
          assert exe.get("ok") is True
          assert exe.get("credential_material_recorded") is False
          assert {x.get("repository") for x in exe.get("peers",[])}==expected
          for row in exe["peers"]:
              assert row.get("repository_http")==200
              assert row.get("source_pin_match") is True
              assert row.get("validator_rc")==0
              assert row.get("tests_rc")==0
              assert row.get("status_http") in (200,201)
              assert row.get("ok") is True
          checked=dt.datetime.fromisoformat(exe["checked_at"].replace("Z","+00:00"))
          age=(dt.datetime.now(dt.timezone.utc)-checked).total_seconds()
          assert -60 <= age <= 1800, age
          print("OMEGA_EXTERNAL_FEDERATION_GREEN source_pin="+str(exe.get("source_pin")))
          PY

      - name: Bridge exact acceptance state to private commit status
        if: ${{ always() && steps.wake.outputs.codespace_name != '' }}
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.OMEGA_BOOTSTRAP_TOKEN }}
          OMEGA_CODESPACE_NAME: ${{ steps.wake.outputs.codespace_name }}
        run: |
          set +x
          expected="$(gh api /repos/sublimedeaf-design/Omega-engines/commits/main --jq '.sha')"
          [[ "$expected" =~ ^[0-9a-f]{40}$ ]]
          state_json="$({
            printf 'export OMEGA_EXPECTED_PRIVATE_HEAD=%q\n' "$expected"
            cat <<'REMOTE'
          set -Eeuo pipefail
          STATE="${OMEGA_STATE:-/workspaces/.omega-state}"
          ROOT=""
          for candidate in /workspaces/*; do
            [ -d "$candidate/.git" ] || continue
            remote="$(git -C "$candidate" remote get-url origin 2>/dev/null || true)"
            case "$remote" in *sublimedeaf-design/Omega-engines*) ROOT="$candidate"; break;; esac
          done
          [ -n "$ROOT" ] || exit 44
          cd "$ROOT"
          actual_head="$(git rev-parse HEAD)"
          python3 - "$STATE" "$actual_head" "$OMEGA_EXPECTED_PRIVATE_HEAD" <<'PY'
          import datetime as dt,json,pathlib,sys
          state=pathlib.Path(sys.argv[1]); head=sys.argv[2]; expected=sys.argv[3]
          ev=state/"evidence"
          def load(name):
              p=ev/name
              try: return json.loads(p.read_text()) if p.is_file() else {}
              except Exception: return {}
          live=load("acceptance-live.json")
          pre=load("acceptance-pre-rebuild.json")
          runtime=load("acceptance-runtime-status.json")
          running=False
          import subprocess
          running=subprocess.run(
              ["pgrep","-f","deploy/codespaces/acceptance-test.sh"],
              stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL,
          ).returncode==0
          state_value="pending"; desc="acceptance running or awaiting exact evidence"
          if live.get("ok") is True and live.get("source_sha")==head:
              state_value="success"; desc="Codespace acceptance/recovery exact-SHA passed"
          elif runtime.get("sha")==head and runtime.get("state")=="failure" and not running:
              state_value="failure"; desc="Codespace acceptance/recovery exact-SHA failed"
          elif pre.get("ok") is True and pre.get("source_sha")==head:
              state_value="pending"; desc="Codespace acceptance pre-rebuild green; final recovery pending"
          print(json.dumps({"sha":head,"expected_sha":expected,"state":state_value,"description":desc,"running":running},separators=(",",":")))
          PY
          REMOTE
          } | timeout 30s gh codespace ssh -c "$OMEGA_CODESPACE_NAME" -- bash -s)"
          sha="$(python3 -c 'import json,sys; print(json.loads(sys.stdin.read())["sha"])' <<<"$state_json")"
          expected_sha="$(python3 -c 'import json,sys; print(json.loads(sys.stdin.read())["expected_sha"])' <<<"$state_json")"
          state="$(python3 -c 'import json,sys; print(json.loads(sys.stdin.read())["state"])' <<<"$state_json")"
          desc="$(python3 -c 'import json,sys; print(json.loads(sys.stdin.read())["description"])' <<<"$state_json")"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$expected_sha" =~ ^[0-9a-f]{40}$ ]]
          if ! gh api "/repos/sublimedeaf-design/Omega-engines/commits/$sha" >/dev/null 2>&1; then
            sha="$expected_sha"
            state="pending"
            desc="runtime local-only SHA detected; convergence pending"
          fi
          gh api --method POST "/repos/sublimedeaf-design/Omega-engines/statuses/$sha"             -f state="$state"             -f context="omega/acceptance-hosted"             -f description="$desc" >/dev/null
          echo "OMEGA_ACCEPTANCE_STATUS_BRIDGED sha=$sha state=$state"

      - name: Observe private acceptance diagnostics
        if: ${{ always() && steps.wake.outputs.codespace_name != '' }}
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.OMEGA_BOOTSTRAP_TOKEN }}
          OMEGA_CODESPACE_NAME: ${{ steps.wake.outputs.codespace_name }}
        run: |
          set +x
          timeout 30s gh codespace ssh -c "$OMEGA_CODESPACE_NAME" -- bash -s <<'REMOTE'
          set -Eeuo pipefail
          STATE="${OMEGA_STATE:-/workspaces/.omega-state}"
          ROOT=""
          for candidate in /workspaces/*; do
            [ -d "$candidate/.git" ] || continue
            remote="$(git -C "$candidate" remote get-url origin 2>/dev/null || true)"
            case "$remote" in *sublimedeaf-design/Omega-engines*) ROOT="$candidate"; break;; esac
          done
          [ -n "$ROOT" ] || exit 44
          cd "$ROOT"
          python3 - "$STATE" "$(git rev-parse HEAD)" <<'PY'
          import json,pathlib,re,subprocess,sys
          state=pathlib.Path(sys.argv[1]); head=sys.argv[2]
          def safe_tail(path,limit=30):
              p=pathlib.Path(path)
              if not p.is_file(): return []
              out=[]
              for line in p.read_text(encoding="utf-8",errors="replace").splitlines()[-limit:]:
                  if re.search(r'(?i)(authorization:|bearer\s+|github_pat_|ghp_|api[_-]?key\s*=|token\s*=)',line):
                      out.append("[REDACTED_SECRET_BEARING_LINE]")
                  else:
                      out.append("".join(ch if ch=="\t" or ord(ch)>=32 else "?" for ch in line)[:500])
              return out
          def exists(name): return (state/"evidence"/name).is_file()
          running=subprocess.run(["pgrep","-f","deploy/codespaces/acceptance-test.sh"],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL).returncode==0
          payload={
              "runtime_head":head,
              "acceptance_running":running,
              "pre_rebuild_present":exists("acceptance-pre-rebuild.json"),
              "live_present":exists("acceptance-live.json"),
              "pass_markers":safe_tail(state/"logs/codespaces-acceptance.pass",40),
              "acceptance_bootstrap_tail":safe_tail(state/"logs/acceptance-bootstrap.log",30),
              "acceptance_retry_tail":safe_tail(state/"logs/acceptance-retry.log",30),
              "preflight_tail":safe_tail(state/"logs/preflight.log",30),
              "credential_material_recorded":False,
          }
          print("OMEGA_ACCEPTANCE_OBSERVER "+json.dumps(payload,separators=(",",":")))
          PY
          REMOTE

      - name: Seed private Codespaces federation secret
        if: ${{ always() }}
        shell: bash
        run: |
          if [ -z "${OMEGA_BOOTSTRAP_TOKEN:-}" ]; then
            echo "OMEGA_BOOTSTRAP_SECRET_NOT_CONFIGURED"
            exit 0
          fi
          set +x
          printf '%s' "$OMEGA_BOOTSTRAP_TOKEN" | \
            GH_TOKEN="$OMEGA_BOOTSTRAP_TOKEN" gh secret set OMEGA_FEDERATION_PAT \
              --app codespaces \
              --repo sublimedeaf-design/Omega-engines
