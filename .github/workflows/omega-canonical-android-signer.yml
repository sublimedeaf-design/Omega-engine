name: OMEGA Canonical Android Signer

on:
  push:
    paths:
      - ".github/workflows/omega-canonical-android-signer.yml"
  workflow_run:
    workflows: ["OMEGA Recovery Evidence Release Stager"]
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: "17,47 * * * *"

permissions:
  contents: read
  actions: write

concurrency:
  group: omega-canonical-android-signer
  cancel-in-progress: false
  queue: max

env:
  PRIVATE_REPOSITORY: sublimedeaf-design/Omega-engines

jobs:
  sign:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Resolve exact current private unsigned release handoff
        id: handoff
        env:
          PRIVATE_TOKEN: ${{ secrets.OMEGA_BOOTSTRAP_TOKEN }}
          PUBLIC_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
          EVENT_WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          [ -n "${PRIVATE_TOKEN:-}" ] || { echo OMEGA_SIGNER_PRIVATE_AUTH_MISSING >&2; exit 77; }
          final="$(GH_TOKEN="$PRIVATE_TOKEN" gh api "/repos/$PRIVATE_REPOSITORY/commits/main" --jq .sha)"
          [[ "$final" =~ ^[0-9a-f]{40}$ ]] || { echo OMEGA_SIGNER_PRIVATE_MAIN_INVALID >&2; exit 64; }

          if [ "$EVENT_NAME" = workflow_run ] && [ "$EVENT_WORKFLOW_NAME" = "OMEGA Recovery Evidence Release Stager" ]; then
            runs=("$EVENT_RUN_ID")
          else
            mapfile -t runs < <(GH_TOKEN="$PUBLIC_TOKEN" gh api "/repos/${{ github.repository }}/actions/workflows/omega-recovery-evidence-release-stager.yml/runs?status=success&per_page=30" --jq '.workflow_runs[].id')
          fi

          found=""
          for run in "${runs[@]}"; do
            [ -n "$run" ] || continue
            artifacts="$(GH_TOKEN="$PUBLIC_TOKEN" gh api "/repos/${{ github.repository }}/actions/runs/$run/artifacts?per_page=100")"
            row="$(FINAL_SHA="$final" python3 - "$artifacts" <<'PY'
          import json,os,re,sys
          p=json.loads(sys.argv[1]); wanted=os.environ["FINAL_SHA"]
          rows=[]
          for a in p.get("artifacts",[]):
              name=str(a.get("name") or "")
              if name==f"OMEGA-Unsigned-Release-{wanted}" and not a.get("expired"):
                  rows.append((wanted,name))
          if len(rows)>1:
              raise SystemExit("OMEGA_SIGNER_UNSIGNED_ARTIFACT_AMBIGUOUS")
          if rows:
              print("|".join(rows[0]))
          PY
            )"
            if [ -n "$row" ]; then
              found="$run|$row"
              break
            fi
          done

          if [ -z "$found" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "final_sha=$final" >> "$GITHUB_OUTPUT"
            echo "OMEGA_SIGNER_CURRENT_MAIN_UNSIGNED_HANDOFF_MISSING:$final"
            exit 0
          fi
          IFS='|' read -r run exact artifact <<<"$found"
          [ "$exact" = "$final" ] || { echo OMEGA_SIGNER_HANDOFF_SOURCE_MISMATCH >&2; exit 65; }
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "stager_run_id=$run" >> "$GITHUB_OUTPUT"
          echo "final_sha=$final" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$artifact" >> "$GITHUB_OUTPUT"
          echo "OMEGA_SIGNER_CURRENT_MAIN_HANDOFF_PASS sha=$final run=$run artifact=$artifact"

      - name: Require unsigned handoff to remain current private main
        if: steps.handoff.outputs.ready == 'true'
        env:
          PRIVATE_TOKEN: ${{ secrets.OMEGA_BOOTSTRAP_TOKEN }}
          FINAL_SHA: ${{ steps.handoff.outputs.final_sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          [ -n "${PRIVATE_TOKEN:-}" ] || { echo OMEGA_SIGNER_PRIVATE_AUTH_MISSING >&2; exit 77; }
          current="$(GH_TOKEN="$PRIVATE_TOKEN" gh api "/repos/$PRIVATE_REPOSITORY/commits/main" --jq .sha)"
          [ "$current" = "$FINAL_SHA" ] || {
            echo "OMEGA_SIGNER_PRIVATE_MAIN_MOVED:$current!=$FINAL_SHA" >&2
            exit 75
          }
          echo "OMEGA_SIGNER_CURRENT_PRIVATE_MAIN_PASS sha=$FINAL_SHA"

      - name: Verify private exact-SHA handoff status
        id: gate
        if: steps.handoff.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.OMEGA_BOOTSTRAP_TOKEN }}
          FINAL_SHA: ${{ steps.handoff.outputs.final_sha }}
          STAGER_RUN_ID: ${{ steps.handoff.outputs.stager_run_id }}
        shell: bash
        run: |
          set -Eeuo pipefail
          status="$(gh api "/repos/$PRIVATE_REPOSITORY/commits/$FINAL_SHA/status?per_page=100")"
          STATUS_PAYLOAD="$status" STAGER_RUN_ID="$STAGER_RUN_ID" python3 <<'PY' > "$RUNNER_TEMP/signer-gate.txt"
          import json,os
          p=json.loads(os.environ["STATUS_PAYLOAD"]); latest={}
          for r in p.get("statuses",[]):
              c=str(r.get("context") or "")
              stamp=str(r.get("updated_at") or r.get("created_at") or "")
              if c and (c not in latest or stamp > str(latest[c].get("_omega_stamp") or "")):
                  latest[c]={**r,"_omega_stamp":stamp}
          for ctx in ("omega/release-evidence-staged","omega/android-release-unsigned"):
              if (latest.get(ctx) or {}).get("state")!="success":
                  raise SystemExit("OMEGA_SIGNER_PREREQUISITE_NOT_PASS:"+ctx)
              target=str((latest.get(ctx) or {}).get("target_url") or "")
              if not target.endswith("/actions/runs/"+os.environ["STAGER_RUN_ID"]):
                  raise SystemExit("OMEGA_SIGNER_HANDOFF_RUN_MISMATCH:"+ctx)
          # Recovery and recovery-attestation are already cryptographically bound
          # to the exact successful recovery run by Candidate Evidence Root and
          # Release Stager. Do not let an unrelated later scheduled recovery
          # overwrite that immutable release-generation proof.
          final_required=(
              "omega/exact-final-validation",
              "omega/federation-v3-release",
              "omega/candidate-evidence-root",
          )
          waiting=[]; blocked=[]
          for ctx in final_required:
              row=latest.get(ctx) or {}
              state=str(row.get("state") or "")
              if state=="success":
                  target=str(row.get("target_url") or "")
                  if not target.startswith("https://github.com/sublimedeaf-design/Omega-engine/actions/runs/"):
                      raise SystemExit("OMEGA_SIGNER_FINAL_CERTIFICATION_PROVENANCE_INVALID:"+ctx)
              elif state in ("","pending"):
                  waiting.append(ctx)
              else:
                  blocked.append(ctx)
          if blocked:
              print("BLOCK")
              raise SystemExit(0)
          if waiting:
              print("WAIT")
              raise SystemExit(0)
          signed=(latest.get("omega/android-release-signed") or {}).get("state")=="success"
          print("ALREADY" if signed else "SIGN")
          PY
          decision="$(cat "$RUNNER_TEMP/signer-gate.txt")"
          case "$decision" in
            SIGN)
              echo "need_sign=true" >> "$GITHUB_OUTPUT"
              echo "validation_state=success" >> "$GITHUB_OUTPUT"
              ;;
            ALREADY)
              echo "need_sign=false" >> "$GITHUB_OUTPUT"
              echo "validation_state=success" >> "$GITHUB_OUTPUT"
              echo "OMEGA_CANONICAL_SIGNER_ALREADY_PASS sha=$FINAL_SHA"
              ;;
            WAIT)
              echo "need_sign=false" >> "$GITHUB_OUTPUT"
              echo "validation_state=pending" >> "$GITHUB_OUTPUT"
              echo "OMEGA_CANONICAL_SIGNER_WAIT_FINAL_CERTIFICATION sha=$FINAL_SHA"
              ;;
            BLOCK)
              echo "need_sign=false" >> "$GITHUB_OUTPUT"
              echo "validation_state=failure" >> "$GITHUB_OUTPUT"
              echo "OMEGA_CANONICAL_SIGNER_BLOCKED_FINAL_CERTIFICATION sha=$FINAL_SHA"
              ;;
            *)
              echo "OMEGA_CANONICAL_SIGNER_DECISION_INVALID:$decision" >&2
              exit 65
              ;;
          esac

      - name: Publish signing wait state for full final certification
        if: steps.handoff.outputs.ready == 'true' && steps.gate.outputs.validation_state != 'success'
        env:
          GH_TOKEN: ${{ secrets.OMEGA_BOOTSTRAP_TOKEN }}
          FINAL_SHA: ${{ steps.handoff.outputs.final_sha }}
          VALIDATION_STATE: ${{ steps.gate.outputs.validation_state }}
        shell: bash
        run: |
          set -Eeuo pipefail
          state=pending
          [ "$VALIDATION_STATE" = failure ] && state=error
          gh api --method POST "/repos/$PRIVATE_REPOSITORY/statuses/$FINAL_SHA" \
            -f state="$state" \
            -f context="omega/android-release-signing" \
            -f description="waiting for full final-SHA certification ($VALIDATION_STATE)" \
            -f target_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" >/dev/null

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        if: steps.gate.outputs.need_sign == 'true'
        with:
          name: ${{ steps.handoff.outputs.artifact_name }}
          path: ${{ runner.temp }}/unsigned
          github-token: ${{ github.token }}
          run-id: ${{ steps.handoff.outputs.stager_run_id }}

      - name: Verify immutable unsigned handoff
        id: artifact
        if: steps.gate.outputs.need_sign == 'true'
        env:
          FINAL_SHA: ${{ steps.handoff.outputs.final_sha }}
          CONTROL_GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          apk="$(find "$RUNNER_TEMP/unsigned" -type f -name OMEGA-Engine-unsigned.apk -print -quit)"
          checksum="$(find "$RUNNER_TEMP/unsigned" -type f -name OMEGA-Engine-unsigned.apk.sha256 -print -quit)"
          prov="$(find "$RUNNER_TEMP/unsigned" -type f -name OMEGA-Engine-unsigned.provenance.json -print -quit)"
          intoto="$(find "$RUNNER_TEMP/unsigned" -type f -name OMEGA-Engine-unsigned.intoto.jsonl -print -quit)"
          sbom="$(find "$RUNNER_TEMP/unsigned" -type f -name omega-sbom.spdx.json -print -quit)"
          supply="$(find "$RUNNER_TEMP/unsigned" -type f -name release-stage-supply-chain.json -print -quit)"
          test -s "$apk"; test -s "$checksum"; test -s "$prov"; test -s "$intoto"; test -s "$sbom"; test -s "$supply"
          actual="$(sha256sum "$apk" | awk '{print $1}')"
          recorded="$(awk '{print $1}' "$checksum")"
          [ "$actual" = "$recorded" ]

          current_epoch="$RUNNER_TEMP/signer-current-federation-epoch.json"
          GH_TOKEN="$CONTROL_GH_TOKEN" gh api \
            "/repos/$GITHUB_REPOSITORY/contents/federation/epochs/current.json?ref=main" \
            --jq '.content' | tr -d '\n' | base64 -d > "$current_epoch"
          test -s "$current_epoch"
          current_control="$(GH_TOKEN="$CONTROL_GH_TOKEN" gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          contract_control="$(CURRENT_EPOCH_PATH="$current_epoch" python3 - <<'PY'
          import json,os,re
          d=json.load(open(os.environ["CURRENT_EPOCH_PATH"],encoding="utf-8"))
          control=str((d.get("release_epoch") or {}).get("control_contract_sha") or "")
          if not re.fullmatch(r"[0-9a-f]{40}",control):
              raise SystemExit("OMEGA_SIGNER_CONTROL_CONTRACT_INVALID")
          print(control)
          PY
          )"
          if [ "$contract_control" != "$current_control" ]; then
            compare="$(GH_TOKEN="$CONTROL_GH_TOKEN" gh api "/repos/$GITHUB_REPOSITORY/compare/$contract_control...$current_control")"
            COMPARE_PAYLOAD="$compare" python3 - <<'PY'
          import json,os
          p=json.loads(os.environ["COMPARE_PAYLOAD"])
          if str(p.get("status") or "") not in {"ahead","identical"} or int(p.get("behind_by") or 0)!=0:
              raise SystemExit("OMEGA_SIGNER_CONTROL_GENERATION_STALE:history")
          changed=[str(x.get("filename") or "") for x in p.get("files") or []]
          unsafe=[x for x in changed if not (x.startswith("federation/epochs/") or x.startswith("bootstrap/omega/"))]
          if unsafe:
              raise SystemExit("OMEGA_SIGNER_CONTROL_GENERATION_STALE:"+",".join(unsafe))
          PY
          fi

          python3 - "$prov" "$intoto" "$sbom" "$supply" "$FINAL_SHA" "$actual" "$current_epoch" <<'PY' > "$RUNNER_TEMP/signer-artifact.txt"
          import hashlib,json,pathlib,re,sys
          p=json.load(open(sys.argv[1],encoding="utf-8"))
          stmt=json.loads(pathlib.Path(sys.argv[2]).read_text(encoding="utf-8").strip())
          sbom=pathlib.Path(sys.argv[3]); supply=pathlib.Path(sys.argv[4])
          final=sys.argv[5]; digest=sys.argv[6]
          current_epoch=json.load(open(sys.argv[7],encoding="utf-8"))
          if p.get("classification")!="PRODUCTION_RELEASE_PAYLOAD_UNSIGNED" or p.get("production_final") is not False:
              raise SystemExit("OMEGA_SIGNER_UNSIGNED_CLASSIFICATION_INVALID")
          if p.get("source_commit")!=final or p.get("apk_sha256")!=digest or p.get("signer_state")!="PENDING_CANONICAL_SIGNER":
              raise SystemExit("OMEGA_SIGNER_UNSIGNED_PROVENANCE_MISMATCH")
          current_primary=current_epoch.get("primary") or {}
          current_release=current_epoch.get("release_epoch") or {}
          current_rollover=current_epoch.get("release_rollover") or {}
          current_id=str(current_release.get("id") or "")
          current_sequence=current_release.get("sequence")
          current_contract=str(current_release.get("control_contract_sha") or "")
          if (current_epoch.get("state")!="PASS"
              or current_primary.get("source_sha")!=final
              or current_rollover.get("stage")!="CERTIFIED_PASS"
              or str(current_rollover.get("release_epoch_id") or "")!=current_id):
              raise SystemExit("OMEGA_SIGNER_RELEASE_EPOCH_NOT_CERTIFIED")
          release_id=str(p.get("omega_release_id") or "")
          if not re.fullmatch(r"[0-9a-f]{64}",release_id):
              raise SystemExit("OMEGA_SIGNER_RELEASE_ID_INVALID")
          if (p.get("release_epoch_id")!=current_id
              or p.get("release_epoch_sequence")!=current_sequence
              or p.get("release_epoch_control_contract_sha")!=current_contract):
              raise SystemExit("OMEGA_SIGNER_RELEASE_EPOCH_STALE")
          fp=str(p.get("expected_signer_certificate_sha256") or "").replace(":","").lower()
          if not re.fullmatch(r"[0-9a-f]{64}",fp): raise SystemExit("OMEGA_SIGNER_EXPECTED_FINGERPRINT_INVALID")
          if stmt.get("_type")!="https://in-toto.io/Statement/v1" or stmt.get("predicateType")!="https://slsa.dev/provenance/v1":
              raise SystemExit("OMEGA_SIGNER_SLSA_STATEMENT_TYPE_INVALID")
          subjects=stmt.get("subject") or []
          if len(subjects)!=1 or subjects[0].get("name")!="OMEGA-Engine-unsigned.apk" or (subjects[0].get("digest") or {}).get("sha256")!=digest:
              raise SystemExit("OMEGA_SIGNER_SLSA_SUBJECT_MISMATCH")
          pred=stmt.get("predicate") or {}; definition=pred.get("buildDefinition") or {}; details=pred.get("runDetails") or {}
          external=definition.get("externalParameters") or {}
          if external.get("source_commit")!=final or external.get("expected_signer_certificate_sha256")!=fp:
              raise SystemExit("OMEGA_SIGNER_SLSA_EXTERNAL_PARAMETERS_MISMATCH")
          if (external.get("omega_release_id")!=release_id
              or external.get("release_epoch_id")!=current_id
              or external.get("release_epoch_sequence")!=current_sequence
              or external.get("release_epoch_control_contract_sha")!=current_contract):
              raise SystemExit("OMEGA_SIGNER_SLSA_RELEASE_EPOCH_MISMATCH")
          builder=str((details.get("builder") or {}).get("id") or "")
          if not re.fullmatch(r"https://github\.com/sublimedeaf-design/Omega-engine/\.github/workflows/omega-recovery-evidence-release-stager\.yml@[0-9a-f]{40}",builder):
              raise SystemExit("OMEGA_SIGNER_SLSA_BUILDER_INVALID")
          deps={str(x.get("uri") or ""):x.get("digest") or {} for x in definition.get("resolvedDependencies") or []}
          expected_deps={
              "git+https://github.com/sublimedeaf-design/Omega-engines@"+final:{"gitCommit":final},
              "file:reports/omega-sbom.spdx.json":{"sha256":hashlib.sha256(sbom.read_bytes()).hexdigest()},
              "file:reports/release-stage-supply-chain.json":{"sha256":hashlib.sha256(supply.read_bytes()).hexdigest()},
          }
          for uri,want in expected_deps.items():
              if deps.get(uri)!=want: raise SystemExit("OMEGA_SIGNER_SLSA_DEPENDENCY_MISMATCH:"+uri)
          print("|".join((fp,release_id,current_id,str(current_sequence),current_contract)))
          PY
          IFS='|' read -r expected release_id release_epoch_id release_epoch_sequence release_epoch_control_contract_sha < "$RUNNER_TEMP/signer-artifact.txt"
          [[ "$expected" =~ ^[0-9a-f]{64}$ ]]
          [[ "$release_id" =~ ^[0-9a-f]{64}$ ]]
          [[ "$release_epoch_id" =~ ^[0-9a-f]{64}$ ]]
          [[ "$release_epoch_sequence" =~ ^[0-9]+$ ]]
          [[ "$release_epoch_control_contract_sha" =~ ^[0-9a-f]{40}$ ]]
          echo "unsigned_apk=$apk" >> "$GITHUB_OUTPUT"
          echo "unsigned_sha256=$actual" >> "$GITHUB_OUTPUT"
          echo "expected_fingerprint=$expected" >> "$GITHUB_OUTPUT"
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"
          echo "release_epoch_id=$release_epoch_id" >> "$GITHUB_OUTPUT"
          echo "release_epoch_sequence=$release_epoch_sequence" >> "$GITHUB_OUTPUT"
          echo "release_epoch_control_contract_sha=$release_epoch_control_contract_sha" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        if: steps.gate.outputs.need_sign == 'true'
        with:
          distribution: temurin
          java-version: "17"

      - name: Import fingerprint-bound cache-rescue handoff when available
        id: rescue_sign
        if: steps.gate.outputs.need_sign == 'true'
        env:
          GH_TOKEN: ${{ secrets.OMEGA_BOOTSTRAP_TOKEN }}
          FINAL_SHA: ${{ steps.handoff.outputs.final_sha }}
          EXPECTED_FINGERPRINT: ${{ steps.artifact.outputs.expected_fingerprint }}
          UNSIGNED_SHA256: ${{ steps.artifact.outputs.unsigned_sha256 }}
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          prefix="omega-signer-rescue-${FINAL_SHA}-"
          releases="$(gh api "/repos/$PRIVATE_REPOSITORY/releases?per_page=100")"
          tag="$(python3 - "$releases" "$prefix" <<'PY'
          import json,sys
          rows=json.loads(sys.argv[1]); prefix=sys.argv[2]
          matches=[
              r for r in rows
              if not r.get("draft")
              and str(r.get("tag_name") or "").startswith(prefix)
          ]
          matches.sort(key=lambda r:str(r.get("created_at") or ""), reverse=True)
          if matches:
              print(matches[0]["tag_name"])
          PY
          )"
          if [ -z "$tag" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "OMEGA_CACHE_RESCUE_HANDOFF_NOT_FOUND sha=$FINAL_SHA"
            exit 0
          fi

          release="$(gh api "/repos/$PRIVATE_REPOSITORY/releases/tags/$tag")"
          target="$(printf '%s' "$release" | jq -r .target_commitish)"
          [ "$target" = "$FINAL_SHA" ] || {
            echo "OMEGA_CACHE_RESCUE_TARGET_MISMATCH:$target!=$FINAL_SHA" >&2
            exit 42
          }

          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "build-tools;36.0.0" >/dev/null
          dir="$RUNNER_TEMP/cache-rescue-signed"
          rm -rf "$dir"
          mkdir -p "$dir" dist
          gh release download "$tag" -R "$PRIVATE_REPOSITORY" \
            -p "OMEGA-Engine.apk" \
            -p "OMEGA-Engine.apk.sha256" \
            -p "OMEGA-Engine.signed.provenance.json" \
            -D "$dir"

          test -s "$dir/OMEGA-Engine.apk"
          test -s "$dir/OMEGA-Engine.apk.sha256"
          test -s "$dir/OMEGA-Engine.signed.provenance.json"
          actual_sha="$(sha256sum "$dir/OMEGA-Engine.apk" | awk '{print $1}')"
          recorded_sha="$(awk '{print $1}' "$dir/OMEGA-Engine.apk.sha256")"
          [ "$actual_sha" = "$recorded_sha" ] || {
            echo OMEGA_CACHE_RESCUE_SIGNED_SHA_MISMATCH >&2
            exit 43
          }

          python3 - "$dir/OMEGA-Engine.signed.provenance.json" "$FINAL_SHA" "$UNSIGNED_SHA256" "$actual_sha" "$EXPECTED_FINGERPRINT" <<'PY'
          import json,re,sys
          p=json.load(open(sys.argv[1],encoding="utf-8"))
          final,unsigned,signed,fp=sys.argv[2:]
          if p.get("classification")!="CANONICAL_SIGNED_RELEASE_CANDIDATE":
              raise SystemExit("OMEGA_CACHE_RESCUE_CLASSIFICATION_INVALID")
          if p.get("production_final") is not False:
              raise SystemExit("OMEGA_CACHE_RESCUE_PRODUCTION_FLAG_INVALID")
          if p.get("source_commit")!=final:
              raise SystemExit("OMEGA_CACHE_RESCUE_SOURCE_SHA_MISMATCH")
          if p.get("unsigned_apk_sha256")!=unsigned:
              raise SystemExit("OMEGA_CACHE_RESCUE_UNSIGNED_SHA_MISMATCH")
          if (p.get("signed_apk_sha256") or p.get("apk_sha256"))!=signed:
              raise SystemExit("OMEGA_CACHE_RESCUE_SIGNED_SHA_PROVENANCE_MISMATCH")
          if p.get("apk_sha256")!=signed:
              raise SystemExit("OMEGA_CACHE_RESCUE_APK_SHA_PROVENANCE_MISMATCH")
          if str(p.get("signer_certificate_sha256") or "").replace(":","").lower()!=fp:
              raise SystemExit("OMEGA_CACHE_RESCUE_FINGERPRINT_PROVENANCE_MISMATCH")
          if p.get("signer_continuity")!="PASS":
              raise SystemExit("OMEGA_CACHE_RESCUE_CONTINUITY_NOT_PASS")
          if p.get("signer_recovery_source") not in {
              "legacy_actions_cache_fingerprint_verified",
              "isolated_private_signer_fingerprint_verified",
          }:
              raise SystemExit("OMEGA_CACHE_RESCUE_SOURCE_INVALID")
          if p.get("private_key_exported") is not False:
              raise SystemExit("OMEGA_CACHE_RESCUE_PRIVATE_KEY_EXPORT_INVALID")
          PY

          out="$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$dir/OMEGA-Engine.apk")"
          actual_fp="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' <<<"$out" | head -1 | tr -d ':' | tr 'A-F' 'a-f')"
          [ "$actual_fp" = "$EXPECTED_FINGERPRINT" ] || {
            echo OMEGA_CACHE_RESCUE_APK_CERT_MISMATCH >&2
            exit 44
          }
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 "$dir/OMEGA-Engine.apk" >/dev/null

          cp "$dir/OMEGA-Engine.apk" dist/OMEGA-Engine.apk
          cp "$dir/OMEGA-Engine.apk.sha256" dist/OMEGA-Engine.apk.sha256
          cp "$dir/OMEGA-Engine.signed.provenance.json" dist/OMEGA-Engine.signed.provenance.json
          echo "available=true" >> "$GITHUB_OUTPUT"
          echo "apk_sha256=$actual_sha" >> "$GITHUB_OUTPUT"
          echo "OMEGA_CACHE_RESCUE_HANDOFF_PASS sha=$FINAL_SHA tag=$tag signed_sha256=$actual_sha"

      - name: Sign on hosted runner from fingerprint-bound escrow when available
        id: hosted_sign
        if: steps.gate.outputs.need_sign == 'true' && steps.rescue_sign.outputs.available != 'true'
        env:
          OMEGA_ANDROID_KEYSTORE_B64: ${{ secrets.OMEGA_ANDROID_KEYSTORE_B64 }}
          UNSIGNED_APK: ${{ steps.artifact.outputs.unsigned_apk }}
          EXPECTED_FINGERPRINT: ${{ steps.artifact.outputs.expected_fingerprint }}
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          if [ -z "${OMEGA_ANDROID_KEYSTORE_B64:-}" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "OMEGA_HOSTED_SIGNER_ESCROW_NOT_CONFIGURED"
            exit 0
          fi
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "build-tools;36.0.0" >/dev/null
          key="$(mktemp)"
          cleanup(){ rm -f "$key"; }
          trap cleanup EXIT
          umask 077
          printf '%s' "$OMEGA_ANDROID_KEYSTORE_B64" | base64 -d > "$key" || {
            echo OMEGA_HOSTED_SIGNER_ESCROW_DECODE_FAILED >&2
            exit 34
          }
          fingerprint(){
            keytool -list -v -keystore "$1" -storepass android -alias androiddebugkey 2>/dev/null |
              sed -n 's/.*SHA256: //p' | head -1 | tr -d ':' | tr 'A-F' 'a-f'
          }
          actual_fp="$(fingerprint "$key" || true)"
          [ "$actual_fp" = "$EXPECTED_FINGERPRINT" ] || {
            echo OMEGA_HOSTED_SIGNER_ESCROW_FINGERPRINT_MISMATCH >&2
            exit 35
          }
          mkdir -p dist
          rm -f dist/OMEGA-Engine.apk dist/OMEGA-Engine.apk.sha256
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign             --ks "$key" --ks-key-alias androiddebugkey             --ks-pass pass:android --key-pass pass:android             --out dist/OMEGA-Engine.apk "$UNSIGNED_APK"
          out="$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs dist/OMEGA-Engine.apk)"
          signed_fp="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' <<<"$out" | head -1 | tr -d ':' | tr 'A-F' 'a-f')"
          [ "$signed_fp" = "$EXPECTED_FINGERPRINT" ] || {
            echo OMEGA_HOSTED_SIGNED_APK_CERT_MISMATCH >&2
            exit 36
          }
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 dist/OMEGA-Engine.apk >/dev/null
          sha256sum dist/OMEGA-Engine.apk > dist/OMEGA-Engine.apk.sha256
          digest="$(awk '{print $1}' dist/OMEGA-Engine.apk.sha256)"
          echo "apk_sha256=$digest" >> "$GITHUB_OUTPUT"
          echo "available=true" >> "$GITHUB_OUTPUT"
          echo "OMEGA_HOSTED_CANONICAL_SIGN_PASS sha256=$digest"

      - name: Discover canonical private signer runtime
        id: wake
        if: steps.gate.outputs.need_sign == 'true' && steps.rescue_sign.outputs.available != 'true' && steps.hosted_sign.outputs.available != 'true'
        env:
          OMEGA_BOOTSTRAP_TOKEN: ${{ secrets.OMEGA_BOOTSTRAP_TOKEN }}
          OMEGA_CODESPACE_LIFECYCLE_TOKEN: ${{ secrets.OMEGA_BOOTSTRAP_TOKEN }}
          OMEGA_FORCE_RESTART: "0"
        shell: bash
        run: python3 bootstrap/omega/codespace_wake.py

      - name: Mark signing blocked while canonical runtime is quota-gated
        if: steps.gate.outputs.need_sign == 'true' && steps.rescue_sign.outputs.available != 'true' && steps.hosted_sign.outputs.available != 'true' && steps.wake.outputs.runtime_available != 'true'
        env:
          GH_TOKEN: ${{ secrets.OMEGA_BOOTSTRAP_TOKEN }}
          FINAL_SHA: ${{ steps.handoff.outputs.final_sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          gh api --method POST "/repos/$PRIVATE_REPOSITORY/statuses/$FINAL_SHA"             -f state=pending             -f context="omega/android-release-signing"             -f description="canonical signer runtime unavailable; automatic retry armed"             -f target_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" >/dev/null
          echo "OMEGA_CANONICAL_SIGNER_BLOCKED_AUTORETRY sha=$FINAL_SHA"

      - name: Request repo-local Samsung ARM64 signer actuation
        if: steps.gate.outputs.need_sign == 'true' && steps.rescue_sign.outputs.available != 'true' && steps.hosted_sign.outputs.available != 'true' && steps.wake.outputs.runtime_available != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          FINAL_SHA: ${{ steps.handoff.outputs.final_sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          # The private repository owns the Samsung signer and already has a
          # status-driven actuator with repo-local actions:write. Never require
          # a cross-repository PAT to dispatch the secret-bearing signer.
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            echo "OMEGA_NATIVE_SIGNER_STATUS_REQUESTED sha=$FINAL_SHA control_run=$GITHUB_RUN_ID"
            exit 0
          fi

          active="$(
            GH_TOKEN="$GH_TOKEN" gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/omega-canonical-android-signer.yml/runs?per_page=30"               --jq '[.workflow_runs[] | select(.event=="workflow_dispatch" and (.status=="queued" or .status=="in_progress"))] | length'
          )"
          if [ "$active" -eq 0 ]; then
            GH_TOKEN="$GH_TOKEN" gh workflow run omega-canonical-android-signer.yml               -R "$GITHUB_REPOSITORY" --ref main
            echo "OMEGA_NATIVE_SIGNER_CONTROL_DISPATCHED sha=$FINAL_SHA"
          else
            echo "OMEGA_NATIVE_SIGNER_CONTROL_ALREADY_ACTIVE sha=$FINAL_SHA count=$active"
          fi

      - name: Dispatch exact hosted private signer rescue fallback
        if: steps.gate.outputs.need_sign == 'true' && steps.rescue_sign.outputs.available != 'true' && steps.hosted_sign.outputs.available != 'true' && steps.wake.outputs.runtime_available != 'true'
        env:
          GH_TOKEN: ${{ secrets.OMEGA_BOOTSTRAP_TOKEN }}
          FINAL_SHA: ${{ steps.handoff.outputs.final_sha }}
          RESCUE_REF: rescue/hosted-signer-bcf882
        shell: bash
        run: |
          set -Eeuo pipefail
          current="$(gh api "/repos/$PRIVATE_REPOSITORY/commits/main" --jq .sha)"
          [ "$current" = "$FINAL_SHA" ] || { echo "OMEGA_HOSTED_RESCUE_MAIN_MOVED:$FINAL_SHA!=$current" >&2; exit 75; }
          ref_sha="$(gh api "/repos/$PRIVATE_REPOSITORY/commits/$RESCUE_REF" --jq .sha)"
          [ "$ref_sha" = "117e0eb4efe0326b658ecea278368398fd4e9c9e" ] || { echo "OMEGA_HOSTED_RESCUE_REF_MOVED:$ref_sha" >&2; exit 75; }
          active="$(
            gh api "/repos/$PRIVATE_REPOSITORY/actions/runs?branch=$RESCUE_REF&status=queued&per_page=100" --jq '[.workflow_runs[] | select(.name=="OMEGA Android Signing Keepalive" and .event=="workflow_dispatch")] | length'
          )"
          active="$((active + $(gh api "/repos/$PRIVATE_REPOSITORY/actions/runs?branch=$RESCUE_REF&status=in_progress&per_page=100" --jq '[.workflow_runs[] | select(.name=="OMEGA Android Signing Keepalive" and .event=="workflow_dispatch")] | length')))"
          if [ "$active" -eq 0 ]; then
            gh workflow run android-signing-keepalive.yml               -R "$PRIVATE_REPOSITORY"               --ref "$RESCUE_REF"               -f mode=rescue               -f allow_private_self_hosted=true
            echo "OMEGA_HOSTED_RESCUE_DISPATCHED source=$FINAL_SHA ref=$RESCUE_REF"
          else
            echo "OMEGA_HOSTED_RESCUE_ALREADY_ACTIVE source=$FINAL_SHA ref=$RESCUE_REF count=$active"
          fi

      - name: Hold certification pending when no canonical signer backend is available
        if: steps.gate.outputs.need_sign == 'true' && steps.rescue_sign.outputs.available != 'true' && steps.hosted_sign.outputs.available != 'true' && steps.wake.outputs.runtime_available != 'true'
        shell: bash
        run: |
          echo "OMEGA_CANONICAL_SIGNER_PENDING_FAIL_CLOSED"

      - name: Transfer immutable unsigned payload to canonical signer runtime
        if: steps.gate.outputs.need_sign == 'true' && steps.rescue_sign.outputs.available != 'true' && steps.hosted_sign.outputs.available != 'true' && steps.wake.outputs.runtime_available == 'true'
        env:
          GH_TOKEN: ${{ secrets.OMEGA_BOOTSTRAP_TOKEN }}
          OMEGA_CODESPACE_NAME: ${{ steps.wake.outputs.codespace_name }}
          UNSIGNED_APK: ${{ steps.artifact.outputs.unsigned_apk }}
          UNSIGNED_SHA256: ${{ steps.artifact.outputs.unsigned_sha256 }}
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          base64 -w0 "$UNSIGNED_APK" | timeout 120s gh codespace ssh -c "$OMEGA_CODESPACE_NAME" -- bash -c 'base64 -d > /tmp/omega-release-unsigned.apk'
          {
            printf 'export OMEGA_UNSIGNED_SHA256=%q\n' "$UNSIGNED_SHA256"
            cat <<'REMOTE'
          set -Eeuo pipefail
          actual="$(sha256sum /tmp/omega-release-unsigned.apk | awk '{print $1}')"
          [ "$actual" = "$OMEGA_UNSIGNED_SHA256" ] || { echo OMEGA_REMOTE_UNSIGNED_SHA_MISMATCH >&2; exit 41; }
          REMOTE
          } | timeout 60s gh codespace ssh -c "$OMEGA_CODESPACE_NAME" -- bash -s

      - name: Sign only with the established canonical Android identity
        if: steps.gate.outputs.need_sign == 'true' && steps.rescue_sign.outputs.available != 'true' && steps.hosted_sign.outputs.available != 'true' && steps.wake.outputs.runtime_available == 'true'
        env:
          GH_TOKEN: ${{ secrets.OMEGA_BOOTSTRAP_TOKEN }}
          OMEGA_CODESPACE_NAME: ${{ steps.wake.outputs.codespace_name }}
          EXPECTED_FINGERPRINT: ${{ steps.artifact.outputs.expected_fingerprint }}
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          {
            printf 'export OMEGA_EXPECTED_SIGNER=%q\n' "$EXPECTED_FINGERPRINT"
            cat <<'REMOTE'
          set -Eeuo pipefail
          key="$HOME/.android/debug.keystore"
          fingerprint(){
            keytool -list -v -keystore "$1" -storepass android -alias androiddebugkey 2>/dev/null |
              sed -n 's/.*SHA256: //p' | head -1 | tr -d ':' | tr 'A-F' 'a-f'
          }
          current=""
          [ -s "$key" ] && current="$(fingerprint "$key" || true)"
          if [ "$current" != "$OMEGA_EXPECTED_SIGNER" ]; then
            [ -n "${OMEGA_ANDROID_KEYSTORE_B64:-}" ] || { echo "OMEGA_SIGNER_UNAVAILABLE cache=false escrow=false" >&2; exit 34; }
            tmp="$(mktemp)"
            trap 'rm -f "$tmp"' EXIT
            printf '%s' "$OMEGA_ANDROID_KEYSTORE_B64" | base64 -d > "$tmp"
            [ "$(fingerprint "$tmp")" = "$OMEGA_EXPECTED_SIGNER" ] || { echo OMEGA_SIGNER_ESCROW_FINGERPRINT_MISMATCH >&2; exit 35; }
            mkdir -p "$HOME/.android"
            install -m 600 "$tmp" "$key"
          fi
          [ "$(fingerprint "$key")" = "$OMEGA_EXPECTED_SIGNER" ] || { echo OMEGA_SIGNER_FINGERPRINT_MISMATCH >&2; exit 36; }
          apksigner="${ANDROID_HOME:-$HOME/android-sdk}/build-tools/36.0.0/apksigner"
          if [ ! -x "$apksigner" ]; then
            apksigner="$(find "${ANDROID_HOME:-$HOME/android-sdk}/build-tools" -type f -name apksigner 2>/dev/null | sort -V | tail -1)"
          fi
          [ -x "$apksigner" ] || { echo OMEGA_REMOTE_APKSIGNER_MISSING >&2; exit 37; }
          rm -f /tmp/omega-release-signed.apk
          "$apksigner" sign             --ks "$key" --ks-key-alias androiddebugkey             --ks-pass pass:android --key-pass pass:android             --out /tmp/omega-release-signed.apk /tmp/omega-release-unsigned.apk
          "$apksigner" verify --verbose --print-certs /tmp/omega-release-signed.apk > /tmp/omega-signer-verify.txt
          actual="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' /tmp/omega-signer-verify.txt | head -1 | tr -d ':' | tr 'A-F' 'a-f')"
          [ "$actual" = "$OMEGA_EXPECTED_SIGNER" ] || { echo OMEGA_SIGNED_APK_CERT_MISMATCH >&2; exit 38; }
          echo OMEGA_CANONICAL_REMOTE_SIGN_PASS
          REMOTE
          } | timeout 120s gh codespace ssh -c "$OMEGA_CODESPACE_NAME" -- bash -s

      - name: Retrieve signed payload without exporting private key
        id: signed
        if: steps.gate.outputs.need_sign == 'true' && steps.rescue_sign.outputs.available != 'true' && steps.hosted_sign.outputs.available != 'true' && steps.wake.outputs.runtime_available == 'true'
        env:
          GH_TOKEN: ${{ secrets.OMEGA_BOOTSTRAP_TOKEN }}
          OMEGA_CODESPACE_NAME: ${{ steps.wake.outputs.codespace_name }}
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          mkdir -p dist
          timeout 120s gh codespace ssh -c "$OMEGA_CODESPACE_NAME" -- bash -c 'base64 -w0 /tmp/omega-release-signed.apk' > dist/OMEGA-Engine.apk.b64
          base64 -d dist/OMEGA-Engine.apk.b64 > dist/OMEGA-Engine.apk
          rm -f dist/OMEGA-Engine.apk.b64
          test -s dist/OMEGA-Engine.apk
          sha256sum dist/OMEGA-Engine.apk > dist/OMEGA-Engine.apk.sha256
          echo "apk_sha256=$(awk '{print $1}' dist/OMEGA-Engine.apk.sha256)" >> "$GITHUB_OUTPUT"
          timeout 30s gh codespace ssh -c "$OMEGA_CODESPACE_NAME" -- bash -c 'rm -f /tmp/omega-release-unsigned.apk /tmp/omega-release-signed.apk /tmp/omega-signer-verify.txt' || true

      - name: Independently verify signed APK and provenance
        if: steps.gate.outputs.need_sign == 'true' && (steps.rescue_sign.outputs.available == 'true' || steps.hosted_sign.outputs.available == 'true' || steps.wake.outputs.runtime_available == 'true')
        env:
          FINAL_SHA: ${{ steps.handoff.outputs.final_sha }}
          EXPECTED_FINGERPRINT: ${{ steps.artifact.outputs.expected_fingerprint }}
          UNSIGNED_SHA256: ${{ steps.artifact.outputs.unsigned_sha256 }}
          OMEGA_RELEASE_ID: ${{ steps.artifact.outputs.release_id }}
          OMEGA_RELEASE_EPOCH_ID: ${{ steps.artifact.outputs.release_epoch_id }}
          OMEGA_RELEASE_EPOCH_SEQUENCE: ${{ steps.artifact.outputs.release_epoch_sequence }}
          OMEGA_RELEASE_EPOCH_CONTROL_CONTRACT_SHA: ${{ steps.artifact.outputs.release_epoch_control_contract_sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "build-tools;36.0.0" >/dev/null
          test -s dist/OMEGA-Engine.apk
          sha256sum dist/OMEGA-Engine.apk > dist/OMEGA-Engine.apk.sha256
          export SIGNED_SHA256="$(awk '{print $1}' dist/OMEGA-Engine.apk.sha256)"
          out="$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs dist/OMEGA-Engine.apk)"
          actual="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' <<<"$out" | head -1 | tr -d ':' | tr 'A-F' 'a-f')"
          [ "$actual" = "$EXPECTED_FINGERPRINT" ]
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 dist/OMEGA-Engine.apk >/dev/null
          python3 - <<'PY'
          import json,os,pathlib,re
          final=os.environ["FINAL_SHA"]; expected=os.environ["EXPECTED_FINGERPRINT"]
          unsigned=os.environ["UNSIGNED_SHA256"]; signed=os.environ["SIGNED_SHA256"]
          release_id=os.environ["OMEGA_RELEASE_ID"]
          epoch_id=os.environ["OMEGA_RELEASE_EPOCH_ID"]
          epoch_sequence=os.environ["OMEGA_RELEASE_EPOCH_SEQUENCE"]
          epoch_control=os.environ["OMEGA_RELEASE_EPOCH_CONTROL_CONTRACT_SHA"]
          for x,n in ((final,40),(expected,64),(unsigned,64),(signed,64),(release_id,64),(epoch_id,64),(epoch_control,40)):
              if not re.fullmatch(r"[0-9a-f]{%d}"%n,x): raise SystemExit("OMEGA_SIGNED_PROVENANCE_IDENTITY_INVALID")
          if not re.fullmatch(r"[0-9]+",epoch_sequence):
              raise SystemExit("OMEGA_SIGNED_PROVENANCE_EPOCH_SEQUENCE_INVALID")
          payload={
              "schema_version":1,
              "classification":"CANONICAL_SIGNED_RELEASE_CANDIDATE",
              "production_final":False,
              "source_commit":final,
              "release_id":release_id,
              "release_epoch_id":epoch_id,
              "release_epoch_sequence":int(epoch_sequence),
              "release_epoch_control_contract_sha":epoch_control,
              "unsigned_apk_sha256":unsigned,
              "apk_sha256":signed,
              "signer_certificate_sha256":expected,
              "signer_continuity":"PASS",
              "private_key_exported":False,
          }
          pathlib.Path("dist/OMEGA-Engine.signed.provenance.json").write_text(
              json.dumps(payload,indent=2,sort_keys=True)+"\n",encoding="utf-8")
          PY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: steps.gate.outputs.need_sign == 'true' && (steps.rescue_sign.outputs.available == 'true' || steps.hosted_sign.outputs.available == 'true' || steps.wake.outputs.runtime_available == 'true')
        with:
          name: OMEGA-Signed-Release-${{ steps.handoff.outputs.final_sha }}
          retention-days: 7
          if-no-files-found: error
          path: |
            dist/OMEGA-Engine.apk
            dist/OMEGA-Engine.apk.sha256
            dist/OMEGA-Engine.signed.provenance.json

      - name: Publish canonical signer and signed-APK proof
        if: steps.gate.outputs.need_sign == 'true' && (steps.rescue_sign.outputs.available == 'true' || steps.hosted_sign.outputs.available == 'true' || steps.wake.outputs.runtime_available == 'true')
        env:
          GH_TOKEN: ${{ secrets.OMEGA_BOOTSTRAP_TOKEN }}
          FINAL_SHA: ${{ steps.handoff.outputs.final_sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          for ctx in omega/signer/continuity omega/android-release-signed; do
            gh api --method POST "/repos/$PRIVATE_REPOSITORY/statuses/$FINAL_SHA"               -f state=success -f context="$ctx"               -f description="canonical Android signer continuity verified on immutable release payload"               -f target_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" >/dev/null
          done

      - name: Dispatch exact signer run to cold-start without workflow_run depth chaining
        if: steps.gate.outputs.need_sign == 'true' && (steps.rescue_sign.outputs.available == 'true' || steps.hosted_sign.outputs.available == 'true' || steps.wake.outputs.runtime_available == 'true')
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNER_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -Eeuo pipefail
          gh workflow run omega-android-runtime-coldstart.yml \
            -R "$GITHUB_REPOSITORY" \
            --ref main \
            -f signer_run_id="$SIGNER_RUN_ID"
          echo "OMEGA_ANDROID_COLDSTART_DISPATCHED signer_run=$SIGNER_RUN_ID"
