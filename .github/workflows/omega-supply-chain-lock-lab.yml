name: OMEGA Supply Chain Lock Lab

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/omega-supply-chain-lock-lab.yml"
      - "bootstrap/omega/supply-chain-trigger.txt"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: omega-supply-chain-lock-lab
  cancel-in-progress: false

env:
  PRIVATE_REPOSITORY: sublimedeaf-design/Omega-engines

jobs:
  discover:
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.pin.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: pin
        env:
          GH_TOKEN: ${{ secrets.OMEGA_BOOTSTRAP_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          read -r marker sha _ < bootstrap/omega/supply-chain-trigger.txt
          test "$marker" = "generate-supply-chain-locks"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          gh api "/repos/$PRIVATE_REPOSITORY/commits/$sha" --jq '.sha' | grep -qx "$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  python-locks:
    needs: discover
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: py311
            python: "3.11"
          - lane: py312
            python: "3.12"
          - lane: py313
            python: "3.13"
          - lane: py314
            python: "3.14"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.PRIVATE_REPOSITORY }}
          ref: ${{ needs.discover.outputs.sha }}
          token: ${{ secrets.OMEGA_BOOTSTRAP_TOKEN }}
          persist-credentials: false
          path: omega
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
      - name: Generate exact wheel hash lock
        working-directory: omega
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --disable-pip-version-check "packaging==26.3"
          rm -rf .lock-wheelhouse
          mkdir -p .lock-wheelhouse reports/supply-chain
          python -m pip download --disable-pip-version-check --only-binary=:all:             --dest .lock-wheelhouse -r requirements-ci.lock
          PYVER="${{ matrix.python }}" LANE="${{ matrix.lane }}" python - <<'PY'
          import hashlib, os, pathlib, zipfile
          from email.parser import Parser
          from packaging.requirements import Requirement
          from packaging.utils import canonicalize_name

          root=pathlib.Path(".")
          wheels=list((root/".lock-wheelhouse").glob("*.whl"))
          found={}
          for wheel in wheels:
              with zipfile.ZipFile(wheel) as z:
                  meta=next(n for n in z.namelist() if n.endswith(".dist-info/METADATA"))
                  msg=Parser().parsestr(z.read(meta).decode("utf-8","replace"))
              name=canonicalize_name(msg["Name"])
              version=msg["Version"]
              digest=hashlib.sha256(wheel.read_bytes()).hexdigest()
              found[(name,version)]=(wheel.name,digest)

          active=[]
          for raw in (root/"requirements-ci.lock").read_text(encoding="utf-8").splitlines():
              line=raw.strip()
              if not line or line.startswith("#"):
                  continue
              req=Requirement(line)
              if req.marker and not req.marker.evaluate():
                  continue
              specs=list(req.specifier)
              if len(specs)!=1 or specs[0].operator!="==":
                  raise SystemExit(f"NON_EXACT_REQUIREMENT:{line}")
              key=(canonicalize_name(req.name),specs[0].version)
              if key not in found:
                  raise SystemExit(f"WHEEL_NOT_FOUND:{key}")
              _,digest=found[key]
              active.append(f"{req.name}=={specs[0].version} --hash=sha256:{digest}")

          out=root/"reports"/"supply-chain"/f"requirements-ci-{os.environ['LANE']}-linux-x86_64.lock"
          out.write_text(
              "# Generated on GitHub-hosted Ubuntu from exact wheels; review before promotion.\n"
              + "\n".join(active) + "\n",
              encoding="utf-8",
          )
          print(out.read_text())
          PY
          python -m pip install --dry-run --disable-pip-version-check             --require-hashes --only-binary=:all:             -r "reports/supply-chain/requirements-ci-${{ matrix.lane }}-linux-x86_64.lock"
          rm -rf .lock-wheelhouse
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: omega-python-lock-${{ matrix.lane }}-${{ needs.discover.outputs.sha }}
          path: omega/reports/supply-chain/requirements-ci-${{ matrix.lane }}-linux-x86_64.lock
          if-no-files-found: error
          retention-days: 7

  gradle-lock:
    needs: discover
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.PRIVATE_REPOSITORY }}
          ref: ${{ needs.discover.outputs.sha }}
          token: ${{ secrets.OMEGA_BOOTSTRAP_TOKEN }}
          persist-credentials: false
          path: omega
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: "8.13"
          cache-disabled: true
      - name: Install Android SDK 36
        shell: bash
        run: |
          set -Eeuo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install             "platforms;android-36" "build-tools;36.0.0" >/dev/null
      - name: Generate and prove Gradle verification metadata
        working-directory: omega/android
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f gradle/verification-metadata.xml
          gradle --no-daemon --stacktrace --write-verification-metadata sha256 lintDebug assembleDebug
          test -s gradle/verification-metadata.xml
          gradle --no-daemon --stacktrace --dependency-verification strict lintDebug assembleDebug
          mkdir -p ../reports/supply-chain
          cp gradle/verification-metadata.xml ../reports/supply-chain/gradle-verification-metadata.xml
          sha256sum ../reports/supply-chain/gradle-verification-metadata.xml             > ../reports/supply-chain/gradle-verification-metadata.xml.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: omega-gradle-verification-${{ needs.discover.outputs.sha }}
          path: |
            omega/reports/supply-chain/gradle-verification-metadata.xml
            omega/reports/supply-chain/gradle-verification-metadata.xml.sha256
          if-no-files-found: error
          retention-days: 7

  persist-snapshot:
    needs: [discover, python-locks, gradle-lock]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SOURCE_SHA: ${{ needs.discover.outputs.sha }}
      SNAPSHOT_BRANCH: supply-chain/snapshot-${{ needs.discover.outputs.sha }}
    steps:
      - name: Checkout public control repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
          path: control

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: omega-python-lock-*-${{ env.SOURCE_SHA }}
          path: generated/python
          merge-multiple: true

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: omega-gradle-verification-${{ env.SOURCE_SHA }}
          path: generated/gradle

      - name: Assemble immutable supply-chain snapshot
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -Eeuo pipefail
          snap="control/supply-chain/snapshots/$SOURCE_SHA"
          rm -rf "$snap"
          mkdir -p "$snap/python" "$snap/gradle"
          for lane in py311 py312 py313 py314; do
            src="generated/python/requirements-ci-${lane}-linux-x86_64.lock"
            test -s "$src"
            cp "$src" "$snap/python/"
          done
          test -s generated/gradle/gradle-verification-metadata.xml
          test -s generated/gradle/gradle-verification-metadata.xml.sha256
          expected="$(awk '{print $1}' generated/gradle/gradle-verification-metadata.xml.sha256)"
          actual="$(sha256sum generated/gradle/gradle-verification-metadata.xml | awk '{print $1}')"
          test "$expected" = "$actual"
          cp generated/gradle/gradle-verification-metadata.xml "$snap/gradle/"
          python3 - "$snap" "$SOURCE_SHA" "$RUN_ID" "$RUN_ATTEMPT" <<'PY'
          import hashlib,json,pathlib,sys
          root=pathlib.Path(sys.argv[1])
          rows=[]
          for p in sorted(x for x in root.rglob("*") if x.is_file()):
              rows.append({
                  "path":p.relative_to(root).as_posix(),
                  "bytes":p.stat().st_size,
                  "sha256":hashlib.sha256(p.read_bytes()).hexdigest(),
              })
          payload={
              "schema_version":1,
              "state":"IMMUTABLE_GENERATED_SNAPSHOT",
              "private_source_sha":sys.argv[2],
              "generator_repository":"sublimedeaf-design/Omega-engine",
              "workflow":"OMEGA Supply Chain Lock Lab",
              "workflow_run_id":int(sys.argv[3]),
              "workflow_run_attempt":int(sys.argv[4]),
              "files":rows,
          }
          canonical=json.dumps(payload,sort_keys=True,separators=(",",":"),allow_nan=False).encode()
          payload["snapshot_manifest_sha256"]=hashlib.sha256(canonical).hexdigest()
          (root/"manifest.json").write_text(json.dumps(payload,indent=2,sort_keys=True,allow_nan=False)+"\n",encoding="utf-8")
          PY
          test "$(sha256sum "$snap/gradle/gradle-verification-metadata.xml" | awk '{print $1}')" = "fa7d00cbdab8a18ece862be89206f4dec1d0b3d66c6fe76f621724434e02f5b9"

      - name: Commit snapshot on isolated public branch
        id: push
        working-directory: control
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          branch="supply-chain/snapshot-${SOURCE_SHA:0:12}"
          git switch -C "$branch" origin/main
          git config user.name "omega-supply-chain-bot"
          git config user.email "omega-supply-chain-bot@users.noreply.github.com"
          git add "supply-chain/snapshots/$SOURCE_SHA"
          if git diff --cached --quiet; then
            echo "branch=$branch" >> "$GITHUB_OUTPUT"
            echo "unchanged=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Supply chain: persist immutable snapshot ${SOURCE_SHA:0:12}"
          set +x
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth"             push --force-with-lease origin "HEAD:refs/heads/$branch"
          unset auth
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "snapshot_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Open snapshot PR
        if: steps.push.outputs.unchanged != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.push.outputs.branch }}
        shell: bash
        run: |
          set -Eeuo pipefail
          existing="$(gh api "/repos/${GITHUB_REPOSITORY}/pulls?state=open&head=${GITHUB_REPOSITORY_OWNER}:$BRANCH&base=main" --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            echo "existing_pr=$existing"
            exit 0
          fi
          gh api --method POST "/repos/${GITHUB_REPOSITORY}/pulls"             -f title="Supply chain: persist exact snapshot ${SOURCE_SHA:0:12}"             -f head="$BRANCH"             -f base="main"             -f body="Persists exact GitHub-hosted generated wheel hash locks and Gradle strict verification metadata for private source $SOURCE_SHA. Snapshot files are content-addressed and verified before commit."             --jq '.html_url'
