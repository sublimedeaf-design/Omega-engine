name: OMEGA Acceptance Read-Only Observer

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/omega-acceptance-observer.yml"
      - "bootstrap/omega/observer-trigger.txt"
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

concurrency:
  group: omega-acceptance-readonly-observer
  cancel-in-progress: true

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      GH_TOKEN: ${{ secrets.OMEGA_BOOTSTRAP_TOKEN }}
    steps:
      - name: Discover existing private runtime
        id: runtime
        shell: bash
        run: |
          set +x
          name="$(gh api -X GET /user/codespaces -f per_page=100 --jq '
            [.codespaces[]
              | select(.repository.full_name=="sublimedeaf-design/Omega-engines")
              | select((.git_status.ref // "")=="main" or (.git_status.ref // "")=="refs/heads/main")
              | select(((.state // "")|ascii_downcase)=="available" or ((.state // "")|ascii_downcase)=="running")]
            | sort_by(.last_used_at // .created_at) | reverse | .[0].name // empty')"
          [ -n "$name" ] || { echo "OMEGA_OBSERVER_RUNTIME_NOT_AVAILABLE"; exit 2; }
          echo "codespace_name=$name" >> "$GITHUB_OUTPUT"
          echo "OMEGA_OBSERVER_RUNTIME_FOUND"

      - name: Read redacted acceptance state
        env:
          OMEGA_CODESPACE_NAME: ${{ steps.runtime.outputs.codespace_name }}
        shell: bash
        run: |
          set +x
          timeout 45s gh codespace ssh -c "$OMEGA_CODESPACE_NAME" -- bash -s <<'REMOTE'
          set -Eeuo pipefail
          STATE="${OMEGA_STATE:-/workspaces/.omega-state}"
          ROOT=""
          for candidate in /workspaces/*; do
            [ -d "$candidate/.git" ] || continue
            remote="$(git -C "$candidate" remote get-url origin 2>/dev/null || true)"
            case "$remote" in *sublimedeaf-design/Omega-engines*) ROOT="$candidate"; break;; esac
          done
          [ -n "$ROOT" ] || exit 44
          cd "$ROOT"
          python3 - "$STATE" "$(git rev-parse HEAD)" <<'PY'
          import json,pathlib,re,subprocess,sys
          state=pathlib.Path(sys.argv[1]); head=sys.argv[2]
          def safe_tail(path,limit=80):
              p=pathlib.Path(path)
              if not p.is_file(): return []
              out=[]
              for line in p.read_text(encoding="utf-8",errors="replace").splitlines()[-limit:]:
                  if re.search(r'(?i)(authorization:|bearer\s+|github_pat_|ghp_|api[_-]?key\s*=|token\s*=)',line):
                      out.append("[REDACTED_SECRET_BEARING_LINE]")
                  else:
                      out.append("".join(ch if ch=="\t" or ord(ch)>=32 else "?" for ch in line)[:700])
              return out
          def exists(name): return (state/"evidence"/name).is_file()
          running=subprocess.run(["pgrep","-f","deploy/codespaces/acceptance-test.sh"],
              stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL).returncode==0
          payload={
              "runtime_head":head,
              "acceptance_running":running,
              "pre_rebuild_present":exists("acceptance-pre-rebuild.json"),
              "live_present":exists("acceptance-live.json"),
              "pass_markers":safe_tail(state/"logs/codespaces-acceptance.pass",60),
              "acceptance_autostart_tail":safe_tail(state/"logs/acceptance-autostart.log",100),
              "acceptance_retry_tail":safe_tail(state/"logs/acceptance-retry.log",60),
              "intelligence_refresh_tail":safe_tail(state/"logs/intelligence-refresh.log",50),
              "preflight_tail":safe_tail(state/"logs/preflight.log",50),
              "credential_material_recorded":False,
          }
          print("OMEGA_ACCEPTANCE_OBSERVER "+json.dumps(payload,separators=(",",":")))
          PY
          REMOTE
