name: OMEGA Canonical Unsigned Lock

on:
  push:
    paths:
      - ".github/workflows/omega-canonical-unsigned-lock.yml"
      - "bootstrap/omega/canonical-unsigned-lock.json"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

env:
  PRIVATE_REPOSITORY: sublimedeaf-design/Omega-engines

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Load and verify immutable generation lock
        id: lock
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY' > "$RUNNER_TEMP/lock.env"
          import json,re
          p=json.load(open("bootstrap/omega/canonical-unsigned-lock.json",encoding="utf-8"))
          required={
            "state":"LOCKED",
            "source_sha":"9980fbd6f0511377b01f799651c6cec351cbf74f",
            "omega_release_id":"258be71845b470c9258bc5cefc813032b70fae5ea6d66c1bf30a9f3f20aca3e3",
            "release_epoch_id":"45fef390308d1f562277294a84bf39c97a31544625dad047013ceeea8528c556",
            "release_epoch_sequence":125,
            "unsigned_sha256":"70ef2ce7afbccab558e272a70a83250e2b483c782254ef2b34036e835bc0395a",
            "stager_run_id":36603568959,
            "artifact_id":11049424026,
            "immutable":True,
          }
          for k,v in required.items():
              if p.get(k)!=v:
                  raise SystemExit(f"OMEGA_UNSIGNED_LOCK_FIELD_MISMATCH:{k}")
          print("SOURCE_SHA="+p["source_sha"])
          print("LOCK_SHA256="+p["unsigned_sha256"])
          print("LOCK_RUN_ID="+str(p["stager_run_id"]))
          print("LOCK_ARTIFACT_ID="+str(p["artifact_id"]))
          print("LOCK_ARTIFACT_NAME="+p["artifact_name"])
          PY
          cat "$RUNNER_TEMP/lock.env" >> "$GITHUB_ENV"
          echo OMEGA_UNSIGNED_LOCK_CONTRACT_PASS

      - name: Verify locked artifact bytes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          meta="$(gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$LOCK_ARTIFACT_ID")"
          META="$meta" EXPECTED="$LOCK_ARTIFACT_NAME" python3 - <<'PY'
          import json,os
          p=json.loads(os.environ["META"])
          if p.get("expired"): raise SystemExit("OMEGA_UNSIGNED_LOCK_ARTIFACT_EXPIRED")
          if p.get("name")!=os.environ["EXPECTED"]: raise SystemExit("OMEGA_UNSIGNED_LOCK_ARTIFACT_NAME_MISMATCH")
          PY
          tmp="$RUNNER_TEMP/omega-lock"
          mkdir -p "$tmp"
          curl -fLsS \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$LOCK_ARTIFACT_ID/zip" \
            -o "$tmp/artifact.zip"
          unzip -oq "$tmp/artifact.zip" -d "$tmp/artifact" || [ "$?" -eq 1 ]
          apk="$(find "$tmp/artifact" -type f -name OMEGA-Engine-unsigned.apk -print -quit)"
          provenance="$(find "$tmp/artifact" -type f -name OMEGA-Engine-unsigned.provenance.json -print -quit)"
          test -s "$apk"; test -s "$provenance"
          actual="$(sha256sum "$apk" | awk '{print $1}')"
          [ "$actual" = "$LOCK_SHA256" ] || { echo "OMEGA_UNSIGNED_LOCK_SHA_MISMATCH:$actual!=$LOCK_SHA256" >&2; exit 78; }
          PROV="$provenance" SOURCE_SHA="$SOURCE_SHA" LOCK_SHA="$LOCK_SHA256" python3 - <<'PY'
          import json,os
          p=json.load(open(os.environ["PROV"],encoding="utf-8"))
          if p.get("source_commit")!=os.environ["SOURCE_SHA"]: raise SystemExit("OMEGA_UNSIGNED_LOCK_PROVENANCE_SOURCE_MISMATCH")
          if p.get("apk_sha256")!=os.environ["LOCK_SHA"]: raise SystemExit("OMEGA_UNSIGNED_LOCK_PROVENANCE_SHA_MISMATCH")
          if p.get("omega_release_id")!="258be71845b470c9258bc5cefc813032b70fae5ea6d66c1bf30a9f3f20aca3e3": raise SystemExit("OMEGA_UNSIGNED_LOCK_RELEASE_ID_MISMATCH")
          if p.get("release_epoch_id")!="45fef390308d1f562277294a84bf39c97a31544625dad047013ceeea8528c556": raise SystemExit("OMEGA_UNSIGNED_LOCK_EPOCH_ID_MISMATCH")
          PY
          echo "OMEGA_UNSIGNED_LOCK_BYTES_PASS sha256=$actual"

      - name: Publish canonical lock and continue signer convergence
        env:
          PRIVATE_TOKEN: ${{ secrets.OMEGA_BOOTSTRAP_TOKEN }}
          CONTROL_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [ -n "${PRIVATE_TOKEN:-}" ] || { echo OMEGA_UNSIGNED_LOCK_PRIVATE_TOKEN_MISSING >&2; exit 78; }
          current="$(GH_TOKEN="$PRIVATE_TOKEN" gh api "/repos/$PRIVATE_REPOSITORY/commits/main" --jq .sha)"
          [ "$current" = "$SOURCE_SHA" ] || { echo "OMEGA_UNSIGNED_LOCK_MAIN_MOVED:$current!=$SOURCE_SHA" >&2; exit 75; }

          GH_TOKEN="$PRIVATE_TOKEN" gh api --method POST "/repos/$PRIVATE_REPOSITORY/statuses/$SOURCE_SHA" \
            -f state=success \
            -f context="omega/android-release-unsigned" \
            -f description="canonical immutable unsigned locked sha256=${LOCK_SHA256:0:12}" \
            -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$LOCK_RUN_ID" >/dev/null

          GH_TOKEN="$PRIVATE_TOKEN" gh api --method POST "/repos/$PRIVATE_REPOSITORY/statuses/$SOURCE_SHA" \
            -f state=success \
            -f context="omega/unsigned-reproducibility" \
            -f description="execution-scoped drift measured; immutable 70ef candidate locked" \
            -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/36624919814" >/dev/null

          # Rebind the staged-evidence status to the same immutable stager run.
          # The signer requires both handoff statuses to identify one provenance run.
          GH_TOKEN="$PRIVATE_TOKEN" gh api --method POST "/repos/$PRIVATE_REPOSITORY/statuses/$SOURCE_SHA" \
            -f state=success \
            -f context="omega/release-evidence-staged" \
            -f description="canonical staged evidence pinned to immutable unsigned handoff" \
            -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$LOCK_RUN_ID" >/dev/null

          active="$(
            {
              GH_TOKEN="$CONTROL_TOKEN" gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/omega-canonical-android-signer.yml/runs?status=queued&per_page=20" --jq '.total_count'
              GH_TOKEN="$CONTROL_TOKEN" gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/omega-canonical-android-signer.yml/runs?status=in_progress&per_page=20" --jq '.total_count'
            } | awk '{s+=$1} END{print s+0}'
          )"
          if [ "$active" -eq 0 ]; then
            GH_TOKEN="$CONTROL_TOKEN" gh workflow run omega-canonical-android-signer.yml -R "$GITHUB_REPOSITORY" --ref main
            echo "OMEGA_UNSIGNED_LOCK_SIGNER_DISPATCHED source=$SOURCE_SHA"
          else
            echo "OMEGA_UNSIGNED_LOCK_SIGNER_ALREADY_ACTIVE count=$active"
          fi

          echo "OMEGA_UNSIGNED_CANONICAL_LOCK_PASS source=$SOURCE_SHA sha256=$LOCK_SHA256"
