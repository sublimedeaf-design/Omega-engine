# authority probe generation: 3
name: OMEGA Signer Runner Authority Probe

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/omega-signer-runner-authority-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PRIVATE_REPOSITORY: sublimedeaf-design/Omega-engines
    steps:
      - name: Probe private signer opt-in and registered ARM64 runner
        env:
          OMEGA_BOOTSTRAP_TOKEN: ${{ secrets.OMEGA_BOOTSTRAP_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          variable_json="$(mktemp)"
          runners_json="$(mktemp)"
          cleanup(){ rm -f "$variable_json" "$runners_json"; }
          trap cleanup EXIT

          variable_code="$(curl -sS -o "$variable_json" -w '%{http_code}' \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -H "Authorization: Bearer $OMEGA_BOOTSTRAP_TOKEN" \
            "https://api.github.com/repos/$PRIVATE_REPOSITORY/actions/variables/OMEGA_ENABLE_PRIVATE_SELF_HOSTED" || true)"
          if [ "$variable_code" != 200 ]; then
            echo "OMEGA_SIGNER_RUNNER_CONFIG_AUTH_BLOCKED http=$variable_code" >&2
            exit 78
          fi
          opt_in="$(python3 - "$variable_json" <<'PY'
          import json,sys
          with open(sys.argv[1],encoding="utf-8") as fh:
              print(str(json.load(fh).get("value") or "").strip())
          PY
          )"
          if [ "$opt_in" != 1 ]; then
            echo "OMEGA_SIGNER_RUNNER_OPT_IN_BLOCKED value=${opt_in:-unset}" >&2
            exit 79
          fi
          echo "OMEGA_SIGNER_RUNNER_OPT_IN_PASS value=1"

          runners_code="$(curl -sS -o "$runners_json" -w '%{http_code}' \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -H "Authorization: Bearer $OMEGA_BOOTSTRAP_TOKEN" \
            "https://api.github.com/repos/$PRIVATE_REPOSITORY/actions/runners?per_page=100" || true)"
          if [ "$runners_code" != 200 ]; then
            echo "OMEGA_SIGNER_RUNNER_LIST_AUTH_BLOCKED http=$runners_code" >&2
            exit 78
          fi
          runner_state="$(python3 - "$runners_json" <<'PY'
          import json,sys
          required={"self-hosted","linux","arm64","omega-signer-rescue-v2"}
          with open(sys.argv[1],encoding="utf-8") as fh:
              rows=json.load(fh).get("runners",[])
          matches=[]
          for row in rows:
              labels={str(x.get("name") or "").lower() for x in row.get("labels",[])}
              if required <= labels:
                  matches.append(row)
          online=[r for r in matches if str(r.get("status") or "").lower()=="online"]
          print(f"{len(matches)}|{len(online)}")
          PY
          )"
          IFS='|' read -r matching online <<<"$runner_state"
          if [ "${matching:-0}" -lt 1 ]; then
            echo "OMEGA_SIGNER_RUNNER_REGISTRATION_MISSING matching=0" >&2
            exit 80
          fi
          if [ "${online:-0}" -lt 1 ]; then
            echo "OMEGA_SIGNER_RUNNER_OFFLINE matching=$matching online=0" >&2
            exit 81
          fi
          echo "OMEGA_SIGNER_RUNNER_ONLINE_PASS matching=$matching online=$online"

      - name: Probe private self-hosted runner registration authority
        env:
          OMEGA_BOOTSTRAP_TOKEN: ${{ secrets.OMEGA_BOOTSTRAP_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          tmp="$(mktemp)"
          trap 'rm -f "$tmp"' EXIT
          code="$(curl -sS -o "$tmp" -w '%{http_code}' -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -H "Authorization: Bearer $OMEGA_BOOTSTRAP_TOKEN" \
            "https://api.github.com/repos/$PRIVATE_REPOSITORY/actions/runners/registration-token" || true)"
          rm -f "$tmp"
          if [ "$code" = 201 ]; then
            echo "OMEGA_SIGNER_RUNNER_AUTHORITY_PASS http=201"
            exit 0
          fi
          echo "OMEGA_SIGNER_RUNNER_AUTHORITY_BLOCKED http=$code" >&2
          exit 78
