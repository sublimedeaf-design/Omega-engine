name: OMEGA Production Release Promotion

on:
  workflow_run:
    workflows: ["OMEGA Canonical Android Signer"]
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: "5 * * * *"

permissions:
  contents: read
  actions: read

concurrency:
  group: omega-production-release-promotion
  cancel-in-progress: false

env:
  PRIVATE_REPOSITORY: sublimedeaf-design/Omega-engines

jobs:
  promote:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Resolve latest immutable signed release
        id: signed
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ "$EVENT_NAME" = workflow_run ]; then
            runs=("$EVENT_RUN_ID")
          else
            mapfile -t runs < <(gh api "/repos/${{ github.repository }}/actions/workflows/omega-canonical-android-signer.yml/runs?status=success&per_page=20" --jq '.workflow_runs[].id')
          fi
          found=""
          for run in "${runs[@]}"; do
            [ -n "$run" ] || continue
            artifacts="$(gh api "/repos/${{ github.repository }}/actions/runs/$run/artifacts?per_page=100")"
            row="$(python3 - "$artifacts" <<'PY'
          import json,re,sys
          p=json.loads(sys.argv[1]); rows=[]
          for a in p.get("artifacts",[]):
              n=str(a.get("name") or "")
              m=re.fullmatch(r"OMEGA-Signed-Release-([0-9a-f]{40})",n)
              if m and not a.get("expired"):
                  rows.append((m.group(1),n))
          if len(rows)>1: raise SystemExit("OMEGA_PRODUCTION_SIGNED_ARTIFACT_AMBIGUOUS")
          if rows: print("|".join(rows[0]))
          PY
            )"
            if [ -n "$row" ]; then found="$run|$row"; break; fi
          done
          if [ -z "$found" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "OMEGA_PRODUCTION_NO_SIGNED_RELEASE"
            exit 0
          fi
          IFS='|' read -r run final artifact <<<"$found"
          [[ "$run" =~ ^[0-9]+$ ]]; [[ "$final" =~ ^[0-9a-f]{40}$ ]]
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "signer_run_id=$run" >> "$GITHUB_OUTPUT"
          echo "final_sha=$final" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$artifact" >> "$GITHUB_OUTPUT"

      - name: Require full exact-final certification
        id: gate
        if: steps.signed.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.OMEGA_BOOTSTRAP_TOKEN }}
          FINAL_SHA: ${{ steps.signed.outputs.final_sha }}
          SIGNER_RUN_ID: ${{ steps.signed.outputs.signer_run_id }}
        shell: bash
        run: |
          set -Eeuo pipefail
          status="$(gh api "/repos/$PRIVATE_REPOSITORY/commits/$FINAL_SHA/status?per_page=100")"
          STATUS_PAYLOAD="$status" SIGNER_RUN_ID="$SIGNER_RUN_ID" python3 <<'PY'
          import json,os
          p=json.loads(os.environ["STATUS_PAYLOAD"]); latest={}
          for row in p.get("statuses",[]):
              ctx=str(row.get("context") or "")
              if ctx and ctx not in latest: latest[ctx]=row
          required=(
              "omega/hosted-ci/python311",
              "omega/hosted-ci/python313",
              "omega/hosted-ci/python314",
              "omega/hosted-ci/storage",
              "omega/hosted-governance",
              "omega/hosted-android",
              "omega/exact-final-validation",
              "omega/release-evidence-staged",
              "omega/android-release-unsigned",
              "omega/federation-v3-release",
              "omega/hosted-recovery",
              "omega/recovery-attestation",
              "omega/candidate-evidence-root",
              "omega/signer/continuity",
              "omega/android-release-signed",
          )
          bad=[c for c in required if (latest.get(c) or {}).get("state")!="success"]
          if bad:
              raise SystemExit("OMEGA_PRODUCTION_REQUIRED_STATUS_NOT_PASS:"+",".join(bad))
          signer_run=os.environ["SIGNER_RUN_ID"]
          for ctx in ("omega/signer/continuity","omega/android-release-signed"):
              target=str((latest.get(ctx) or {}).get("target_url") or "")
              if not target.endswith("/actions/runs/"+signer_run):
                  raise SystemExit("OMEGA_PRODUCTION_SIGNER_RUN_BINDING_MISMATCH:"+ctx)
          for ctx in ("omega/exact-final-validation","omega/federation-v3-release","omega/hosted-recovery","omega/recovery-attestation","omega/candidate-evidence-root"):
              target=str((latest.get(ctx) or {}).get("target_url") or "")
              if not target.startswith("https://github.com/sublimedeaf-design/Omega-engine/actions/runs/"):
                  raise SystemExit("OMEGA_PRODUCTION_PROOF_PROVENANCE_INVALID:"+ctx)
          print("OMEGA_PRODUCTION_GATE_PASS")
          PY

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        if: steps.signed.outputs.ready == 'true'
        with:
          name: ${{ steps.signed.outputs.artifact_name }}
          path: ${{ runner.temp }}/signed
          github-token: ${{ github.token }}
          run-id: ${{ steps.signed.outputs.signer_run_id }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: steps.signed.outputs.ready == 'true'
        with:
          repository: ${{ env.PRIVATE_REPOSITORY }}
          ref: ${{ steps.signed.outputs.final_sha }}
          token: ${{ secrets.OMEGA_BOOTSTRAP_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: omega

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        if: steps.signed.outputs.ready == 'true'
        with:
          distribution: temurin
          java-version: "17"

      - name: Independently verify signed production payload
        id: verify
        if: steps.signed.outputs.ready == 'true'
        env:
          FINAL_SHA: ${{ steps.signed.outputs.final_sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          apk="$(find "$RUNNER_TEMP/signed" -type f -name OMEGA-Engine.apk -print -quit)"
          checksum="$(find "$RUNNER_TEMP/signed" -type f -name OMEGA-Engine.apk.sha256 -print -quit)"
          prov="$(find "$RUNNER_TEMP/signed" -type f -name OMEGA-Engine.signed.provenance.json -print -quit)"
          test -s "$apk"; test -s "$checksum"; test -s "$prov"
          actual="$(sha256sum "$apk" | awk '{print $1}')"
          recorded="$(awk '{print $1}' "$checksum")"
          [ "$actual" = "$recorded" ]
          expected="$(tr -d '[:space:]' < omega/android/signing-cert.sha256 | tr -d ':' | tr 'A-F' 'a-f')"
          python3 - "$prov" "$FINAL_SHA" "$actual" "$expected" <<'PY'
          import json,re,sys
          p=json.load(open(sys.argv[1],encoding="utf-8"))
          final,digest,expected=sys.argv[2:]
          if p.get("classification")!="CANONICAL_SIGNED_RELEASE_CANDIDATE" or p.get("production_final") is not False:
              raise SystemExit("OMEGA_PRODUCTION_SIGNED_CLASSIFICATION_INVALID")
          if p.get("source_commit")!=final or p.get("apk_sha256")!=digest:
              raise SystemExit("OMEGA_PRODUCTION_SIGNED_PROVENANCE_MISMATCH")
          if str(p.get("signer_certificate_sha256") or "").lower()!=expected:
              raise SystemExit("OMEGA_PRODUCTION_SIGNER_PROVENANCE_MISMATCH")
          if p.get("signer_continuity")!="PASS" or p.get("private_key_exported") is not False:
              raise SystemExit("OMEGA_PRODUCTION_SIGNER_CONTINUITY_INVALID")
          for x,n in ((final,40),(digest,64),(expected,64)):
              if not re.fullmatch(r"[0-9a-f]{%d}"%n,x):
                  raise SystemExit("OMEGA_PRODUCTION_IDENTITY_INVALID")
          PY
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "build-tools;36.0.0" >/dev/null
          out="$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk")"
          cert="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' <<<"$out" | head -1 | tr -d ':' | tr 'A-F' 'a-f')"
          [ "$cert" = "$expected" ]
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 "$apk" >/dev/null
          echo "apk=$apk" >> "$GITHUB_OUTPUT"
          echo "checksum=$checksum" >> "$GITHUB_OUTPUT"
          echo "provenance=$prov" >> "$GITHUB_OUTPUT"
          echo "apk_sha256=$actual" >> "$GITHUB_OUTPUT"
          echo "signer_sha256=$expected" >> "$GITHUB_OUTPUT"

      - name: Resolve exact release branch and fast-forward main without changing SHA
        id: promote
        if: steps.signed.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.OMEGA_BOOTSTRAP_TOKEN }}
          FINAL_SHA: ${{ steps.signed.outputs.final_sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          read -r marker trigger_sha source_ref _ < bootstrap/omega/pr-validation-trigger.txt
          [ "$marker" = validate-exact-pr ]
          [ "$trigger_sha" = "$FINAL_SHA" ]
          [[ "$source_ref" =~ ^release/recovery-evidence-[A-Za-z0-9._/-]+$ ]]
          tip="$(gh api "/repos/$PRIVATE_REPOSITORY/commits/$source_ref" --jq .sha)"
          [ "$tip" = "$FINAL_SHA" ]
          main="$(gh api "/repos/$PRIVATE_REPOSITORY/commits/main" --jq .sha)"
          if [ "$main" != "$FINAL_SHA" ]; then
            compare="$(gh api "/repos/$PRIVATE_REPOSITORY/compare/$main...$FINAL_SHA")"
            relation="$(jq -r '.status' <<<"$compare")"
            behind="$(jq -r '.behind_by' <<<"$compare")"
            [ "$relation" = ahead ] && [ "$behind" = 0 ] || {
              echo "OMEGA_PRODUCTION_MAIN_NOT_FAST_FORWARDABLE main=$main final=$FINAL_SHA relation=$relation behind=$behind" >&2
              exit 81
            }
            gh api --method PATCH "/repos/$PRIVATE_REPOSITORY/git/refs/heads/main" -f sha="$FINAL_SHA" -F force=false >/dev/null
          fi
          confirmed="$(gh api "/repos/$PRIVATE_REPOSITORY/commits/main" --jq .sha)"
          [ "$confirmed" = "$FINAL_SHA" ] || { echo "OMEGA_PRODUCTION_MAIN_SHA_MISMATCH" >&2; exit 82; }
          echo "source_ref=$source_ref" >> "$GITHUB_OUTPUT"
          echo "OMEGA_PRODUCTION_MAIN_FAST_FORWARD_PASS sha=$FINAL_SHA"

      - name: Publish immutable GitHub release
        id: release
        if: steps.signed.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.OMEGA_BOOTSTRAP_TOKEN }}
          FINAL_SHA: ${{ steps.signed.outputs.final_sha }}
          APK: ${{ steps.verify.outputs.apk }}
          CHECKSUM: ${{ steps.verify.outputs.checksum }}
          PROVENANCE: ${{ steps.verify.outputs.provenance }}
          APK_SHA256: ${{ steps.verify.outputs.apk_sha256 }}
          SIGNER_SHA256: ${{ steps.verify.outputs.signer_sha256 }}
        shell: bash
        run: |
          set -Eeuo pipefail
          tag="omega-live-${FINAL_SHA:0:12}"
          title="OMEGA production ${FINAL_SHA:0:12}"
          notes="$RUNNER_TEMP/release-notes.md"
          {
            echo "# OMEGA production release"
            echo
            echo "- Exact source SHA: `$FINAL_SHA`"
            echo "- APK SHA-256: `$APK_SHA256`"
            echo "- Signer certificate SHA-256: `$SIGNER_SHA256`"
            echo "- Promotion: exact-SHA fast-forward, no merge SHA introduced"
          } > "$notes"
          if gh release view "$tag" --repo "$PRIVATE_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "$APK" "$CHECKSUM" "$PROVENANCE" --repo "$PRIVATE_REPOSITORY" --clobber
          else
            gh release create "$tag" "$APK" "$CHECKSUM" "$PROVENANCE" \
              --repo "$PRIVATE_REPOSITORY" --target "$FINAL_SHA" --title "$title" --notes-file "$notes"
          fi
          url="$(gh release view "$tag" --repo "$PRIVATE_REPOSITORY" --json url --jq .url)"
          [ -n "$url" ]
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Publish production-live exact-SHA status
        if: steps.signed.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.OMEGA_BOOTSTRAP_TOKEN }}
          FINAL_SHA: ${{ steps.signed.outputs.final_sha }}
          RELEASE_URL: ${{ steps.release.outputs.url }}
          APK_SHA256: ${{ steps.verify.outputs.apk_sha256 }}
        shell: bash
        run: |
          set -Eeuo pipefail
          gh api --method POST "/repos/$PRIVATE_REPOSITORY/statuses/$FINAL_SHA" \
            -f state=success \
            -f context="omega/production-live" \
            -f description="production live; signed APK sha256=${APK_SHA256:0:12}" \
            -f target_url="$RELEASE_URL" >/dev/null
          echo "OMEGA_PRODUCTION_LIVE sha=$FINAL_SHA release=$RELEASE_URL"
