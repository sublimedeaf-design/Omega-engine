name: OMEGA Codespace 402 Diagnostic

on:
  push:
    branches:
      - control/codespace-402-diagnostic-20260926
    paths:
      - .github/workflows/omega-codespace-402-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Classify canonical Codespace start response without exposing credentials
        env:
          GH_TOKEN: ${{ secrets.OMEGA_BOOTSTRAP_TOKEN }}
          CODESPACE: zany-invention-vpr6jxpxppv4hpvp6
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          [ -n "${GH_TOKEN:-}" ] || { echo OMEGA_CODESPACE_DIAGNOSTIC_TOKEN_MISSING; exit 2; }
          body="$RUNNER_TEMP/codespace-start.json"
          code="$(curl -sS -o "$body" -w '%{http_code}' -X POST             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer $GH_TOKEN"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/user/codespaces/$CODESPACE/start")"
          python3 - "$code" "$body" <<'PY'
          import json,pathlib,sys
          code=sys.argv[1]
          try:
              p=json.loads(pathlib.Path(sys.argv[2]).read_text(encoding="utf-8") or "{}")
          except Exception:
              p={}
          safe={
              "http_status":code,
              "message":str(p.get("message") or "")[:500],
              "documentation_url":str(p.get("documentation_url") or "")[:500],
          }
          print(json.dumps(safe,sort_keys=True))
          PY
          case "$code" in
            200|202|304|409) exit 0 ;;
            402) exit 42 ;;
            *) exit 43 ;;
          esac
