# exact candidate validation: stale trigger must never advance to another SHA
name: OMEGA Private PR Hosted Bridge

on:
  workflow_dispatch:
  schedule:
    - cron: "2-59/5 * * * *"
  push:
    paths:
      - ".github/workflows/omega-private-pr-hosted-bridge.yml"
      - "bootstrap/omega/pr-validation-trigger.txt"

permissions:
  contents: read

# This workflow does not trust or require Actions cache state.
cache-mode: none

concurrency:
  group: omega-private-pr-hosted-bridge
  cancel-in-progress: false
  queue: max

env:
  PRIVATE_REPOSITORY: sublimedeaf-design/Omega-engines

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    outputs:
      found: ${{ steps.pr.outputs.found }}
      reuse: ${{ steps.pr.outputs.reuse }}
      prior_run_id: ${{ steps.pr.outputs.prior_run_id }}
      sha: ${{ steps.pr.outputs.sha }}
      base_sha: ${{ steps.pr.outputs.base_sha }}
      number: ${{ steps.pr.outputs.number }}
      android: ${{ steps.pr.outputs.android }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - id: pr
        env:
          GH_TOKEN: ${{ secrets.OMEGA_BOOTSTRAP_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -Eeuo pipefail
          requested_sha=''
          if [ -s bootstrap/omega/pr-validation-trigger.txt ]; then
            read -r marker candidate source_ref _ < bootstrap/omega/pr-validation-trigger.txt || true
            if [ "${marker:-}" = validate-exact-pr ] && [[ "${candidate:-}" =~ ^[0-9a-f]{40}$ ]]; then
              requested_sha="$candidate"
            fi
          fi

          if [ -z "$requested_sha" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "OMEGA_HOSTED_PR_NONE reason=no_exact_trigger event=$EVENT_NAME"
            exit 0
          fi

          # A queued push run must never validate a superseded public trigger.
          # Compare the trigger embedded in this event commit with canonical main.
          if [ "$EVENT_NAME" = push ]; then
            local_trigger="$(tr -d '\r\n' < bootstrap/omega/pr-validation-trigger.txt)"
            encoded="$(gh api "/repos/$GITHUB_REPOSITORY/contents/bootstrap/omega/pr-validation-trigger.txt?ref=main" --jq '.content // empty' 2>/dev/null || true)"
            [ -n "$encoded" ] || { echo "OMEGA_HOSTED_PR_CURRENT_TRIGGER_UNREADABLE" >&2; exit 68; }
            current_trigger="$(printf '%s' "$encoded" | python3 -c 'import base64,binascii,sys; raw="".join(sys.stdin.read().split()); print(base64.b64decode(raw,validate=True).decode("utf-8").replace("\\r","").replace("\\n",""),end="")')"
            if [ "$local_trigger" != "$current_trigger" ]; then
              echo "found=false" >> "$GITHUB_OUTPUT"
              echo "OMEGA_HOSTED_PR_STALE_TRIGGER_MAIN local=$local_trigger current=$current_trigger"
              exit 0
            fi
          fi

          base_sha="$(gh api "/repos/$PRIVATE_REPOSITORY/commits/main" --jq '.sha')"
          [[ "$base_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "${source_ref:-}" =~ ^[A-Za-z0-9._/-]+$ ]] || {
            echo "OMEGA_EXACT_TRIGGER_REF_INVALID:head=$requested_sha ref=${source_ref:-missing}" >&2
            exit 67
          }
          case "$source_ref" in *..*|/*|-*) echo "OMEGA_EXACT_TRIGGER_REF_UNSAFE:$source_ref" >&2; exit 67 ;; esac
          ref_tip="$(gh api "/repos/$PRIVATE_REPOSITORY/commits?sha=$source_ref&per_page=1" --jq '.[0].sha // empty')"
          [[ "$ref_tip" =~ ^[0-9a-f]{40}$ ]] || { echo "OMEGA_EXACT_TRIGGER_REF_TIP_INVALID:$source_ref" >&2; exit 67; }
          if [ "$ref_tip" != "$requested_sha" ]; then
            echo "OMEGA_EXACT_TRIGGER_STALE requested=$requested_sha current=$ref_tip ref=$source_ref" >&2
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 68
          fi
          compare="$(gh api "/repos/$PRIVATE_REPOSITORY/compare/$base_sha...$requested_sha")"
          relation="$(printf '%s' "$compare" | jq -r '.status // ""')"
          behind="$(printf '%s' "$compare" | jq -r '.behind_by // 999999')"
          if [ "$relation" != ahead ] || [ "$behind" != 0 ]; then
            echo "OMEGA_EXACT_TRIGGER_NOT_CURRENT_BASE:status=$relation behind=$behind base=$base_sha head=$requested_sha" >&2
            exit 66
          fi

          android=false
          if printf '%s' "$compare" | jq -r '.files[]?.filename' \
            | grep -Eq '^(android/|\.github/workflows/android-[^/]+\.yml$)'; then
            android=true
          fi

          statuses="$(gh api "/repos/$PRIVATE_REPOSITORY/commits/$requested_sha/status?per_page=100")"
          already_green="$(printf '%s' "$statuses" | ANDROID="$android" python3 -c '
          import json,os,sys
          p=json.load(sys.stdin)
          latest={}
          for row in p.get("statuses",[]):
              ctx=str(row.get("context") or "")
              if ctx and ctx not in latest:
                  latest[ctx]=str(row.get("state") or "")
          required={
              "omega/hosted-ci/python311",
              "omega/hosted-ci/python313",
              "omega/hosted-ci/python314",
              "omega/hosted-ci/storage",
              "omega/hosted-governance",
          }
          if os.environ.get("ANDROID")=="true":
              required.add("omega/hosted-android")
          print("true" if all(latest.get(x)=="success" for x in required) else "false")
          ')"
          if [ "$already_green" = true ]; then
            prior_run="$(printf '%s' "$statuses" | python3 -c '
          import json,re,sys
          p=json.load(sys.stdin); latest={}
          for row in p.get("statuses",[]):
              ctx=str(row.get("context") or "")
              if ctx and ctx not in latest: latest[ctx]=row
          row=latest.get("omega/exact-final-validation") or {}
          if row.get("state")!="success": raise SystemExit(1)
          m=re.search(r"/actions/runs/([0-9]+)$",str(row.get("target_url") or ""))
          if not m: raise SystemExit(1)
          print(m.group(1))
          ')" || { echo "OMEGA_HOSTED_PR_REUSE_PROOF_MISSING" >&2; exit 69; }
            prior_conclusion="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$prior_run" --jq '.conclusion // empty')"
            [ "$prior_conclusion" = success ] || { echo "OMEGA_HOSTED_PR_REUSE_RUN_NOT_SUCCESS:$prior_run" >&2; exit 69; }
            prior_exact="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$prior_run/jobs?filter=latest&per_page=100" --jq '[.jobs[] | select(.name=="exact_final" and .conclusion=="success")] | length')"
            [ "$prior_exact" = 1 ] || { echo "OMEGA_HOSTED_PR_REUSE_EXACT_FINAL_NOT_PASS:$prior_run" >&2; exit 69; }
            {
              echo "found=false"
              echo "reuse=true"
              echo "prior_run_id=$prior_run"
              echo "sha=$requested_sha"
              echo "base_sha=$base_sha"
              echo "number=0"
              echo "android=$android"
            } >> "$GITHUB_OUTPUT"
            echo "OMEGA_HOSTED_PR_REUSE_PROOF sha=$requested_sha prior_run=$prior_run android=$android"
            exit 0
          fi

          {
            echo "found=true"
            echo "reuse=false"
            echo "prior_run_id="
            echo "sha=$requested_sha"
            echo "base_sha=$base_sha"
            echo "number=0"
            echo "android=$android"
          } >> "$GITHUB_OUTPUT"
          echo "OMEGA_HOSTED_PR_PIN mode=exact_sha number=0 sha=$requested_sha android=$android"

  ci:
    needs: [discover, governance]
    if: ${{ needs.discover.outputs.found == 'true' && needs.governance.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: python311
            python: "3.11"
            extra: "dev"
            command: "python -m pytest -q && python -m compileall -q src scripts && python -m pip check"
          - lane: python313
            python: "3.13"
            extra: "dev"
            command: "python -m pytest -q && python -m compileall -q src scripts && python -m pip check && python scripts/materialize_gradle_verification.py && python scripts/validate_supply_chain_locks.py --out reports/supply-chain-locks.json && python scripts/generate_omega_sbom.py --out reports/omega-sbom.spdx.json && python scripts/repo_audit.py --out reports/repo-audit-ci.json && python -c \"from omega.research.preflight import run_preflight; r=run_preflight('reports/preflight-ci.json'); assert r['passed'], r\" && python scripts/final_audit_gate.py --audit reports/repo-audit-ci.json --out reports/final-audit-gate.json"
          - lane: python314
            python: "3.14"
            extra: "dev"
            command: "python -m pytest -q && python -m compileall -q src scripts && python -m pip check"
          - lane: storage
            python: "3.13"
            extra: "dev,data"
            command: "python -m pytest -q tests/test_storage.py tests/test_support_runtime_integrity.py && python -c \"from omega.research.preflight import run_preflight; [(_ for _ in ()).throw(AssertionError(r)) if not (r:=run_preflight(backend=b))['passed'] or r['storage_backend']!=b else None for b in ('sqlite','duckdb')]\" && python -m pip check"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.PRIVATE_REPOSITORY }}
          ref: ${{ needs.discover.outputs.sha }}
          token: ${{ secrets.OMEGA_BOOTSTRAP_TOKEN }}
          persist-credentials: false
          # Full Git ancestry is required by supply-chain release-readiness tests.
          fetch-depth: 0
          path: omega
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
          cache: "pip"
          cache-dependency-path: omega/requirements-ci.lock
      - name: Run exact private PR lane
        working-directory: omega
        shell: bash
        run: |
          python scripts/install_locked_ci_deps.py
          ${{ matrix.command }}
      - name: Publish exact-SHA hosted lane status
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ secrets.OMEGA_BOOTSTRAP_TOKEN }}
          OMEGA_SHA: ${{ needs.discover.outputs.sha }}
          LANE: ${{ matrix.lane }}
          RESULT: ${{ job.status }}
        shell: bash
        run: |
          set +x
          state=failure
          [ "$RESULT" = success ] && state=success
          gh api --method POST "/repos/$PRIVATE_REPOSITORY/statuses/$OMEGA_SHA" \
            -f state="$state" -f context="omega/hosted-ci/$LANE" \
            -f description="public hosted exact-PR lane: $RESULT" >/dev/null

  governance:
    needs: discover
    if: ${{ needs.discover.outputs.found == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.PRIVATE_REPOSITORY }}
          ref: ${{ needs.discover.outputs.sha }}
          token: ${{ secrets.OMEGA_BOOTSTRAP_TOKEN }}
          persist-credentials: false
          # Full Git ancestry is required by supply-chain release-readiness tests.
          fetch-depth: 0
          path: omega
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: Build actual PR event
        if: ${{ needs.discover.outputs.number != '0' }}
        env:
          GH_TOKEN: ${{ secrets.OMEGA_BOOTSTRAP_TOKEN }}
          PR_NUMBER: ${{ needs.discover.outputs.number }}
        shell: bash
        run: |
          set +x
          gh api "/repos/$PRIVATE_REPOSITORY/pulls/$PR_NUMBER" > /tmp/private-pr.json
          python3 - <<'PY'
          import json
          pr=json.load(open("/tmp/private-pr.json"))
          event={"pull_request":{
              "body":pr.get("body") or "",
              "base":{"sha":pr["base"]["sha"]},
              "head":{"sha":pr["head"]["sha"]},
          }}
          json.dump(event,open("/tmp/omega-pr-event.json","w"))
          PY
      - name: Preflight Python syntax once before matrix
        working-directory: omega
        shell: bash
        run: python -m compileall -q src scripts tests

      - name: Validate exact governance
        working-directory: omega
        shell: bash
        run: |
          if [ -s /tmp/omega-pr-event.json ]; then
            python scripts/validate_agent_handoff.py --self-check --event /tmp/omega-pr-event.json
          else
            python scripts/validate_agent_handoff.py --self-check
          fi
          python scripts/agent_orchestrator.py --agents .omega/agents.json --plan .omega/work-plan.json validate
      - name: Publish hosted governance status
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ secrets.OMEGA_BOOTSTRAP_TOKEN }}
          OMEGA_SHA: ${{ needs.discover.outputs.sha }}
          RESULT: ${{ job.status }}
        shell: bash
        run: |
          set +x
          state=failure
          [ "$RESULT" = success ] && state=success
          gh api --method POST "/repos/$PRIVATE_REPOSITORY/statuses/$OMEGA_SHA" \
            -f state="$state" -f context="omega/hosted-governance" \
            -f description="public hosted exact-PR governance: $RESULT" >/dev/null

  android:
    needs: [discover, governance]
    if: ${{ needs.discover.outputs.found == 'true' && needs.discover.outputs.android == 'true' && needs.governance.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.PRIVATE_REPOSITORY }}
          ref: ${{ needs.discover.outputs.sha }}
          token: ${{ secrets.OMEGA_BOOTSTRAP_TOKEN }}
          persist-credentials: false
          # Full Git ancestry is required by supply-chain release-readiness tests.
          fetch-depth: 0
          path: omega
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: "17"
      - name: Ensure Android SDK 36
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ -d "$ANDROID_HOME/platforms/android-36" ] && [ -x "$ANDROID_HOME/build-tools/36.0.0/apksigner" ]; then
            echo "OMEGA_ANDROID_SDK_REUSED platform=36 build_tools=36.0.0"
            exit 0
          fi
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          sdk_ok=false
          for attempt in 1 2 3 4; do
            if "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;36.0.0" >/dev/null; then
              sdk_ok=true
              break
            fi
            echo "OMEGA_ANDROID_SDK_RETRY attempt=$attempt" >&2
            sleep $((attempt * 5))
          done
          "$sdk_ok" || { echo "OMEGA_ANDROID_SDK_INSTALL_FAILED" >&2; exit 75; }
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: "8.13"
          cache-read-only: true
      - name: Materialize exact Gradle verification metadata
        working-directory: omega
        run: python3 scripts/materialize_gradle_verification.py
      - name: Build, lint and verify debug APK
        working-directory: omega/android
        shell: bash
        run: |
          gradle --no-daemon --dependency-verification strict --stacktrace lintDebug assembleDebug
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify app/build/outputs/apk/debug/app-debug.apk
      - name: Publish hosted Android status
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ secrets.OMEGA_BOOTSTRAP_TOKEN }}
          OMEGA_SHA: ${{ needs.discover.outputs.sha }}
          RESULT: ${{ job.status }}
        shell: bash
        run: |
          set +x
          state=failure
          [ "$RESULT" = success ] && state=success
          gh api --method POST "/repos/$PRIVATE_REPOSITORY/statuses/$OMEGA_SHA" \
            -f state="$state" -f context="omega/hosted-android" \
            -f description="public hosted exact-PR Android: $RESULT" >/dev/null


  exact_final:
    needs: [discover, governance, ci, android]
    if: ${{ always() && (needs.discover.outputs.found == 'true' || needs.discover.outputs.reuse == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Publish terminal exact-final-SHA validation or verified re-attestation
        env:
          GH_TOKEN: ${{ secrets.OMEGA_BOOTSTRAP_TOKEN }}
          OMEGA_SHA: ${{ needs.discover.outputs.sha }}
          REUSE_PROOF: ${{ needs.discover.outputs.reuse }}
          PRIOR_RUN_ID: ${{ needs.discover.outputs.prior_run_id }}
          GOVERNANCE_RESULT: ${{ needs.governance.result }}
          CI_RESULT: ${{ needs.ci.result }}
          ANDROID_REQUIRED: ${{ needs.discover.outputs.android }}
          ANDROID_RESULT: ${{ needs.android.result }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$OMEGA_SHA" =~ ^[0-9a-f]{40}$ ]]
          state=failure
          desc="exact final-SHA hosted validation: failure"
          if [ "$REUSE_PROOF" = true ]; then
            [[ "$PRIOR_RUN_ID" =~ ^[0-9]+$ ]]
            prior_conclusion="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$PRIOR_RUN_ID" --jq '.conclusion // empty')"
            prior_exact="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$PRIOR_RUN_ID/jobs?filter=latest&per_page=100" --jq '[.jobs[] | select(.name=="exact_final" and .conclusion=="success")] | length')"
            [ "$prior_conclusion" = success ] && [ "$prior_exact" = 1 ] || { echo "OMEGA_HOSTED_PR_REATTEST_INVALID:$PRIOR_RUN_ID" >&2; exit 69; }
            state=success
            desc="exact final-SHA proof re-attested from run $PRIOR_RUN_ID"
          elif [ "$GOVERNANCE_RESULT" = success ] && [ "$CI_RESULT" = success ]; then
            if [ "$ANDROID_REQUIRED" != true ] || [ "$ANDROID_RESULT" = success ]; then
              state=success
              desc="exact final-SHA hosted validation: success"
            fi
          fi
          gh api --method POST "/repos/$PRIVATE_REPOSITORY/statuses/$OMEGA_SHA" \
            -f state="$state" \
            -f context="omega/exact-final-validation" \
            -f description="$desc" \
            -f target_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" >/dev/null
          [ "$state" = success ] || exit 1
