# exact-main federation probe: cdcdd099740184a455f321975f259db320b75b46
name: OMEGA Hosted Federation Fallback

on:
  workflow_dispatch:
  schedule:
    - cron: "13,43 * * * *"
  push:
    paths:
      - ".github/workflows/omega-hosted-federation-fallback.yml"
      - "bootstrap/omega/federation-trigger.txt"

permissions:
  contents: read

concurrency:
  group: omega-hosted-federation-fallback
  cancel-in-progress: false
  queue: max

env:
  PRIVATE_REPOSITORY: sublimedeaf-design/Omega-engines

jobs:
  federation:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ secrets.OMEGA_BOOTSTRAP_TOKEN }}
      OMEGA_FEDERATION_PAT: ${{ secrets.OMEGA_BOOTSTRAP_TOKEN }}
    steps:
      - name: Pin current private main
        id: pin
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          sha="$(gh api "/repos/$PRIVATE_REPOSITORY/commits/main" --jq '.sha')"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          statuses="$(gh api "/repos/$PRIVATE_REPOSITORY/commits/$sha/status?per_page=100")"
          need_run="$(printf '%s' "$statuses" | python3 -c '
          import json,sys
          p=json.load(sys.stdin)
          latest={}
          for row in p.get("statuses",[]):
              ctx=str(row.get("context") or "")
              if ctx and ctx not in latest:
                  latest[ctx]=str(row.get("state") or "")
          required=[
              "omega-runtime/main-exact",
              "omega-federation/peer-http-5x",
              "omega-federation/exact-sha-executor",
              "omega-federation/evidence-verifier",
              "omega-federation/evidence-publish",
          ]
          print("false" if all(latest.get(x)=="success" for x in required) else "true")
          ')"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "need_run=$need_run" >> "$GITHUB_OUTPUT"
          echo "OMEGA_HOSTED_FEDERATION_PIN sha=$sha need_run=$need_run"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: ${{ steps.pin.outputs.need_run == 'true' }}
        with:
          repository: ${{ env.PRIVATE_REPOSITORY }}
          ref: ${{ steps.pin.outputs.sha }}
          token: ${{ secrets.OMEGA_BOOTSTRAP_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: omega

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        if: ${{ steps.pin.outputs.need_run == 'true' }}
        with:
          python-version: "3.13"

      - name: Verify exact main and peer authorization
        if: ${{ steps.pin.outputs.need_run == 'true' }}
        working-directory: omega
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.pin.outputs.sha }}
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          python3 - <<'PY'
          import json,os,urllib.error,urllib.request
          from pathlib import Path
          token=os.environ["OMEGA_FEDERATION_PAT"]
          owner="sublimedeaf-design"
          cfg=json.loads(Path(".omega/federation-execution.json").read_text())
          rows={}
          for item in cfg["peers"]:
              repo=item["repository"]
              req=urllib.request.Request(
                  f"https://api.github.com/repos/{owner}/{repo}",
                  headers={
                      "Accept":"application/vnd.github+json",
                      "Authorization":f"Bearer {token}",
                      "X-GitHub-Api-Version":"2022-11-28",
                      "User-Agent":"OMEGA-Hosted-Federation/1",
                  },
              )
              try:
                  with urllib.request.urlopen(req,timeout=20) as r:
                      rows[repo]=r.status
              except urllib.error.HTTPError as e:
                  rows[repo]=e.code
          expected={"Omega-release","Omega-validation","Omega-agents","Omega-recovery","Jarv"}
          if set(rows)!=expected or any(rows[x]!=200 for x in expected):
              raise SystemExit("OMEGA_HOSTED_FEDERATION_PEER_HTTP_FAILED:"+json.dumps(rows,sort_keys=True))
          Path("/tmp/federation-access.json").write_text(json.dumps({
              "schema_version":1,
              "authorized":True,
              "repository_head":os.environ["SOURCE_SHA"],
              "peer_http":rows,
              "credential_material_recorded":False,
          },indent=2)+"\n")
          print("OMEGA_STAGE_PEER_HTTP=success")
          PY

      - name: Run exact peer executor
        if: ${{ steps.pin.outputs.need_run == 'true' }}
        id: exec
        working-directory: omega
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.pin.outputs.sha }}
          OMEGA_STATE: ${{ runner.temp }}/omega-federation
          GITHUB_TOKEN: ${{ secrets.OMEGA_BOOTSTRAP_TOKEN }}
        run: |
          set -Eeuo pipefail
          mkdir -p "$OMEGA_STATE/evidence"
          source_pin="$(python3 -c 'import json; print(json.load(open(".omega/repository-mesh.json"))["validated_federation_source_pin"])')"
          python3 scripts/federation_executor.py             --source-pin "$source_pin"             --report "$OMEGA_STATE/evidence/federation-executor.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ["OMEGA_STATE"])/"evidence/federation-executor.json"
          d=json.loads(p.read_text())
          expected={"Omega-release","Omega-validation","Omega-agents","Omega-recovery","Jarv"}
          rows=d.get("peers") or []
          ok=(
              d.get("ok") is True and
              {r.get("repository") for r in rows}==expected and
              all(
                  r.get("ok") is True and
                  r.get("repository_http")==200 and
                  r.get("source_pin_match") is True and
                  r.get("validator_rc")==0 and
                  r.get("tests_rc")==0 and
                  r.get("status_http") in (200,201)
                  for r in rows
              )
          )
          if not ok:
              raise SystemExit("OMEGA_HOSTED_FEDERATION_EXECUTOR_NOT_GREEN")
          print("OMEGA_STAGE_EXECUTOR=success")
          PY

      - name: Independent hosted verifier
        if: ${{ steps.pin.outputs.need_run == 'true' }}
        working-directory: omega
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.pin.outputs.sha }}
          OMEGA_STATE: ${{ runner.temp }}/omega-federation
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          root=Path(".")
          source=os.environ["SOURCE_SHA"]
          head=subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip()
          if head!=source:
              raise SystemExit("HOSTED_FEDERATION_MAIN_SHA_MISMATCH")
          mesh=json.loads((root/".omega/repository-mesh.json").read_text())
          report=json.loads((Path(os.environ["OMEGA_STATE"])/"evidence/federation-executor.json").read_text())
          expected={"Omega-release","Omega-validation","Omega-agents","Omega-recovery","Jarv"}
          if report.get("source_pin")!=mesh.get("validated_federation_source_pin"):
              raise SystemExit("HOSTED_FEDERATION_SOURCE_PIN_MISMATCH")
          rows=report.get("peers") or []
          if report.get("ok") is not True or {r.get("repository") for r in rows}!=expected:
              raise SystemExit("HOSTED_FEDERATION_REPORT_INVALID")
          for row in rows:
              if not (
                  row.get("ok") is True and row.get("repository_http")==200
                  and row.get("source_pin_match") is True
                  and row.get("validator_rc")==0 and row.get("tests_rc")==0
                  and row.get("status_http") in (200,201)
              ):
                  raise SystemExit("HOSTED_FEDERATION_PEER_INVALID:"+str(row.get("repository")))
          print("OMEGA_STAGE_VERIFIER=success")
          PY

      - name: Publish exact-main federation stages
        if: ${{ always() && steps.pin.outputs.need_run == 'true' }}
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.pin.outputs.sha }}
          RESULT: ${{ job.status }}
        run: |
          set +x
          state=failure
          [ "$RESULT" = success ] && state=success
          target="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          post() {
            gh api --method POST "/repos/$PRIVATE_REPOSITORY/statuses/$SOURCE_SHA"               -f state="$state"               -f context="$1"               -f description="hosted federation fallback: $RESULT"               -f target_url="$target" >/dev/null
          }
          post omega-runtime/main-exact
          post omega-federation/peer-http-5x
          post omega-federation/exact-sha-executor
          post omega-federation/evidence-verifier
          post omega-federation/evidence-publish
