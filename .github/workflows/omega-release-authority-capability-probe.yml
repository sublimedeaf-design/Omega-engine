name: OMEGA Release Authority Capability Probe

on:
  push:
    paths:
      - ".github/workflows/omega-release-authority-capability-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      PRIVATE_REPOSITORY: sublimedeaf-design/Omega-engines
      GH_TOKEN: ${{ secrets.OMEGA_BOOTSTRAP_TOKEN }}
    steps:
      - name: Prove bounded create/delete ref authority
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          [ -n "${GH_TOKEN:-}" ] || { echo OMEGA_RELEASE_PROBE_TOKEN_MISSING >&2; exit 77; }
          sha="$(gh api "/repos/$PRIVATE_REPOSITORY/commits/main" --jq .sha)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || exit 64
          ref="audit/release-authority-probe-${sha:0:12}-$GITHUB_RUN_ID"
          cleanup() {
            gh api --method DELETE "/repos/$PRIVATE_REPOSITORY/git/refs/heads/$ref" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          gh api --method POST "/repos/$PRIVATE_REPOSITORY/git/refs" -f ref="refs/heads/$ref" -f sha="$sha" >/dev/null
          got="$(gh api "/repos/$PRIVATE_REPOSITORY/git/ref/heads/$ref" --jq .object.sha)"
          [ "$got" = "$sha" ] || { echo OMEGA_RELEASE_PROBE_REF_MISMATCH >&2; exit 68; }
          gh api --method DELETE "/repos/$PRIVATE_REPOSITORY/git/refs/heads/$ref" >/dev/null
          trap - EXIT
          echo "OMEGA_RELEASE_AUTHORITY_CAPABILITY_PASS source=$sha"
