name: OMEGA Hosted Runtime Fallback

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Hosted shadow/data cycle to run
        required: true
        type: choice
        options: [daily, t24, t60]
        default: t24
  schedule:
    - cron: "17 2 * * *"
    - cron: "7 * * * *"
    - cron: "3,18,33,48 * * * *"
  push:
    paths:
      - ".github/workflows/omega-hosted-runtime-fallback.yml"

permissions:
  contents: read
  actions: read

# Hosted shadow/fallback execution is rebuilt from exact source every run.
cache-mode: none

concurrency:
  group: omega-hosted-runtime-fallback
  cancel-in-progress: false

env:
  PRIVATE_REPOSITORY: sublimedeaf-design/Omega-engines

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    outputs:
      run: ${{ steps.target.outputs.run }}
      mode: ${{ steps.target.outputs.mode }}
      sha: ${{ steps.target.outputs.sha }}
    steps:
      - id: target
        env:
          GH_TOKEN: ${{ secrets.OMEGA_BOOTSTRAP_TOKEN }}
          REQUESTED_MODE: ${{ inputs.mode || '' }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule || '' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          mode="$REQUESTED_MODE"
          if [ "$EVENT_NAME" = "push" ]; then
            mode=t60
          fi
          if [ "$EVENT_NAME" = "schedule" ]; then
            case "$EVENT_SCHEDULE" in
              "17 2 * * *") mode=daily ;;
              "7 * * * *") mode=t24 ;;
              "3,18,33,48 * * * *") mode=t60 ;;
              *) echo "OMEGA_HOSTED_RUNTIME_UNKNOWN_SCHEDULE:$EVENT_SCHEDULE" >&2; exit 64 ;;
            esac
          fi
          case "$mode" in daily|t24|t60) ;; *) exit 64 ;; esac

          set +x
          sha="$(gh api "/repos/$PRIVATE_REPOSITORY/commits/main" --jq '.sha')"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]

          runtime_available=false
          if payload="$(gh api -X GET /user/codespaces -f per_page=100 2>/dev/null)"; then
            if printf '%s' "$payload" | python3 -c 'import json,sys; p=json.load(sys.stdin); ok=any((x.get("repository") or {}).get("full_name")=="sublimedeaf-design/Omega-engines" and str((x.get("git_status") or {}).get("ref") or "").replace("refs/heads/","")=="main" and str(x.get("state") or "").lower() in {"available","running"} for x in p.get("codespaces",[])); raise SystemExit(0 if ok else 1)'; then
              runtime_available=true
            fi
          fi

          # An "available" Codespace is not proof that its autonomous cycle is
          # healthy. Keep a provider-independent hosted shadow cycle running on
          # every schedule so Codespace sleep, stale state, or runner loss cannot
          # create a silent observation gap.
          run=true
          {
            echo "run=$run"
            echo "mode=$mode"
            echo "sha=$sha"
          } >> "$GITHUB_OUTPUT"
          echo "OMEGA_HOSTED_RUNTIME_TARGET mode=$mode sha=$sha primary_runtime_available=$runtime_available independent_shadow=true run=$run"

  fallback:
    needs: discover
    if: ${{ needs.discover.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMEGA_SHA: ${{ needs.discover.outputs.sha }}
      OMEGA_MODE: ${{ needs.discover.outputs.mode }}
      OMEGA_BOOTSTRAP_TOKEN: ${{ secrets.OMEGA_BOOTSTRAP_TOKEN }}
      # Shadow redundancy must stay zero-cost and must not consume paid/provider
      # quota. The cycle is explicitly allowed to use public provider fallbacks.
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"

      - name: Checkout exact private source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.PRIVATE_REPOSITORY }}
          ref: ${{ env.OMEGA_SHA }}
          token: ${{ secrets.OMEGA_BOOTSTRAP_TOKEN }}
          persist-credentials: false
          fetch-depth: 20
          path: omega

      - name: Restore exact-SHA hosted state chain
        if: ${{ env.OMEGA_MODE != 'daily' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/omega-state/evidence" "$RUNNER_TEMP/omega-prior"
          restore_mode() {
            local wanted_mode="$1"
            local name="omega-runtime-handoff-${wanted_mode}-$OMEGA_SHA"
            local meta id expired
            meta="$(gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts?name=$name&per_page=100")"
            id="$(printf '%s' "$meta" | python3 -c '
          import json,sys
          p=json.load(sys.stdin)
          rows=[
              x for x in p.get("artifacts",[])
              if not x.get("expired") and str(x.get("name") or "")==sys.argv[1]
          ]
          rows.sort(key=lambda x:str(x.get("created_at") or ""),reverse=True)
          print(rows[0].get("id","") if rows else "")
          ' "$name")"
            if [ -z "$id" ]; then
              echo "OMEGA_HOSTED_STATE_SEED_NONE mode=$wanted_mode sha=$OMEGA_SHA"
              return 0
            fi
            local zip="$RUNNER_TEMP/omega-prior/${wanted_mode}.zip"
            local dst="$RUNNER_TEMP/omega-prior/${wanted_mode}"
            rm -rf "$dst" "$zip"
            curl -fsSL --retry 4 --retry-all-errors --connect-timeout 20 --max-time 120 \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" \
              -o "$zip"
            mkdir -p "$dst"
            unzip -q "$zip" -d "$dst"
            python3 - "$dst" "$OMEGA_SHA" "$wanted_mode" <<'PY'
          import hashlib,json,pathlib,sys
          root=pathlib.Path(sys.argv[1]).resolve()
          sha=sys.argv[2]; mode=sys.argv[3]
          manifest=root/"manifest.json"
          if not manifest.is_file():
              raise SystemExit("OMEGA_HOSTED_STATE_MANIFEST_MISSING")
          p=json.loads(manifest.read_text(encoding="utf-8"))
          if p.get("schema_version")!=1 or p.get("source_sha")!=sha or p.get("mode")!=mode:
              raise SystemExit("OMEGA_HOSTED_STATE_MANIFEST_IDENTITY_MISMATCH")
          rows=p.get("files")
          if not isinstance(rows,list) or not rows:
              raise SystemExit("OMEGA_HOSTED_STATE_MANIFEST_EMPTY")
          for row in rows:
              rel=pathlib.PurePosixPath(str(row.get("path") or ""))
              if rel.is_absolute() or ".." in rel.parts:
                  raise SystemExit("OMEGA_HOSTED_STATE_PATH_UNSAFE")
              path=(root/"files"/pathlib.Path(*rel.parts)).resolve()
              if root not in path.parents or not path.is_file():
                  raise SystemExit(f"OMEGA_HOSTED_STATE_FILE_MISSING:{rel}")
              data=path.read_bytes()
              got=hashlib.sha256(data).hexdigest()
              if got!=row.get("sha256") or len(data)!=int(row.get("size",-1)):
                  raise SystemExit(f"OMEGA_HOSTED_STATE_HASH_MISMATCH:{rel}")
          print(f"OMEGA_HOSTED_STATE_VERIFIED mode={mode} sha={sha} files={len(rows)}")
          PY
            if [ -d "$dst/files/evidence" ]; then
              cp -a "$dst/files/evidence/." "$RUNNER_TEMP/omega-state/evidence/"
            fi
          }
          case "$OMEGA_MODE" in
            t24)
              restore_mode t24
              ;;
            t60)
              restore_mode t24
              restore_mode t60
              ;;
          esac

      - name: Run canonical hosted fallback cycle
        shell: bash
        run: |
          set -Eeuo pipefail
          cd omega
          test "$(git rev-parse HEAD)" = "$OMEGA_SHA"
          python -m venv .venv
          mkdir -p "$RUNNER_TEMP/omega-state/evidence"

          set +x
          auth_header="$(python3 - <<'PY'
          import base64,os
          token=os.environ["OMEGA_BOOTSTRAP_TOKEN"]
          print("AUTHORIZATION: basic "+base64.b64encode(("x-access-token:"+token).encode()).decode())
          PY
          )"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0='http.https://github.com/.extraheader'
          export GIT_CONFIG_VALUE_0="$auth_header"
          export OMEGA_REPO="$GITHUB_WORKSPACE/omega"
          export OMEGA_HOME="$RUNNER_TEMP/omega-home"
          export OMEGA_STATE="$RUNNER_TEMP/omega-state"
          export OMEGA_LOCK="$RUNNER_TEMP/omega-state.lock"
          export OMEGA_GIT_SHA="$OMEGA_SHA"
          export OMEGA_GIT_REF=main
          export OMEGA_ENV_FILE=/dev/null
          export OMEGA_ALLOW_PUBLIC_PROVIDER_FALLBACK=1
          timeout --signal=TERM --kill-after=30s 16m bash deploy/vm/omega-cycle.sh "$OMEGA_MODE"
          auth_header=""
          unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0

      - name: Stage immutable shadow/data handoff
        id: promote
        shell: bash
        run: |
          set -Eeuo pipefail
          cd omega
          test "$(git rev-parse HEAD)" = "$OMEGA_SHA"

          files=()
          case "$OMEGA_MODE" in
            daily)
              mkdir -p evidence
              cp data/fabric/inventory.json evidence/data-inventory.json
              cp data/fabric/last_update.json evidence/data-last-update.json
              cp data/fabric/history_overlay.json evidence/history-overlay.json
              files=(evidence/data-inventory.json evidence/data-last-update.json evidence/history-overlay.json data/fabric/sync_state.json)
              ;;
            t24)
              files=(evidence/latest-24h.json evidence/coverage-gaps.json evidence/forecast-ledger.jsonl evidence/prematch-intelligence.jsonl evidence/prematch-intelligence-refresh-24h.json data/fabric/sync_state.json)
              ;;
            t60)
              files=(evidence/latest-t60.json evidence/shadow-ledger.jsonl evidence/prematch-intelligence.jsonl evidence/prematch-intelligence-refresh-t60.json)
              ;;
            *) exit 64 ;;
          esac

          if ! git diff --quiet -- android/ evidence/release-stage.json; then
            echo "OMEGA_HOSTED_RUNTIME_FORBIDDEN_RELEASE_MUTATION" >&2
            exit 88
          fi

          handoff="$RUNNER_TEMP/omega-runtime-handoff"
          rm -rf "$handoff"
          mkdir -p "$handoff/files"

          copied=0
          for src in "${files[@]}"; do
            if [ -e "$src" ]; then
              mkdir -p "$handoff/files/$(dirname "$src")"
              cp -a "$src" "$handoff/files/$src"
              copied=$((copied+1))
            fi
          done
          [ "$copied" -gt 0 ] || { echo "OMEGA_HOSTED_RUNTIME_HANDOFF_EMPTY" >&2; exit 89; }

          python3 - "$handoff" "$OMEGA_SHA" "$OMEGA_MODE" <<'PY'
          import hashlib,json,sys
          from datetime import datetime,timezone
          from pathlib import Path
          root=Path(sys.argv[1])
          source_sha=sys.argv[2]
          mode=sys.argv[3]
          rows=[]
          for path in sorted((root/"files").rglob("*")):
              if not path.is_file():
                  continue
              h=hashlib.sha256(path.read_bytes()).hexdigest()
              rows.append({
                  "path":str(path.relative_to(root/"files")),
                  "sha256":h,
                  "size":path.stat().st_size,
              })
          if not rows:
              raise SystemExit("OMEGA_HOSTED_RUNTIME_HANDOFF_EMPTY")
          payload={
              "schema_version":1,
              "source_sha":source_sha,
              "mode":mode,
              "generated_at":datetime.now(timezone.utc).isoformat(),
              "semantics":"shadow_data_handoff_only",
              "production_release_authority":False,
              "signing_authority":False,
              "files":rows,
          }
          (root/"manifest.json").write_text(json.dumps(payload,indent=2,sort_keys=True)+"\n",encoding="utf-8")
          print(json.dumps(payload,sort_keys=True))
          PY

          echo "promotion_status=handoff_ready" >> "$GITHUB_OUTPUT"
          echo "handoff_path=$handoff" >> "$GITHUB_OUTPUT"

      - name: Upload immutable runtime handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: omega-runtime-handoff-${{ env.OMEGA_MODE }}-${{ env.OMEGA_SHA }}
          path: ${{ runner.temp }}/omega-runtime-handoff
          if-no-files-found: error
          retention-days: 7

      - name: Publish hosted runtime fallback status
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ secrets.OMEGA_BOOTSTRAP_TOKEN }}
          RESULT: ${{ job.status }}
        shell: bash
        run: |
          set +x
          state=failure
          [ "$RESULT" = success ] && state=success
          gh api --method POST "/repos/$PRIVATE_REPOSITORY/statuses/$OMEGA_SHA" \
            -f state="$state" \
            -f context="omega/hosted-runtime-fallback/$OMEGA_MODE" \
            -f description="public hosted immutable shadow/data handoff: $RESULT" \
            -f target_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" >/dev/null
