name: OMEGA Post Live Verification

on:
  workflow_dispatch:
    inputs:
      final_sha:
        description: "Exact production-final SHA certified by the promoter"
        required: false
        type: string
      promoter_run_id:
        description: "Exact successful Final Release Promoter run id"
        required: false
        type: string
  schedule:
    - cron: "19 * * * *"

permissions:
  contents: read

concurrency:
  group: omega-post-live-verification
  cancel-in-progress: false
  queue: max

env:
  PRIVATE_REPOSITORY: sublimedeaf-design/Omega-engines
  CONTROL_REPOSITORY: sublimedeaf-design/Omega-engine

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Resolve exact live release from current control state
        id: live
        env:
          GH_TOKEN: ${{ secrets.OMEGA_BOOTSTRAP_TOKEN }}
          PROMOTER_RUN_ID: ${{ inputs.promoter_run_id || '' }}
          INPUT_FINAL_SHA: ${{ inputs.final_sha || '' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          read -r marker candidate source_ref _ < bootstrap/omega/pr-validation-trigger.txt || true
          if [ -n "${INPUT_FINAL_SHA:-}" ]; then
            [[ "$INPUT_FINAL_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "OMEGA_POST_LIVE_INPUT_SHA_INVALID:$INPUT_FINAL_SHA" >&2; exit 64; }
            [ "${candidate:-}" = "$INPUT_FINAL_SHA" ] || { echo "OMEGA_POST_LIVE_INPUT_SHA_MISMATCH:${candidate:-missing}!=$INPUT_FINAL_SHA" >&2; exit 64; }
          fi
          if [ "${marker:-}" != validate-exact-pr ] || [[ ! "${candidate:-}" =~ ^[0-9a-f]{40}$ ]] || [[ ! "${source_ref:-}" =~ ^release/[A-Za-z0-9._/-]+$ ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo OMEGA_POST_LIVE_NOT_EXECUTED_NO_STAGED_RELEASE
            exit 0
          fi
          case "$source_ref" in *..*|/*|-*) echo "OMEGA_POST_LIVE_REF_UNSAFE:$source_ref" >&2; exit 64 ;; esac
          tip="$(gh api "/repos/$PRIVATE_REPOSITORY/commits/$source_ref" --jq .sha)"
          [ "$tip" = "$candidate" ] || { echo "OMEGA_POST_LIVE_RELEASE_BRANCH_MOVED:$tip!=$candidate" >&2; exit 61; }
          statuses="$(gh api "/repos/$PRIVATE_REPOSITORY/commits/$candidate/status?per_page=100")"
          decision="$(STATUS_PAYLOAD="$statuses" PROMOTER_RUN_ID="${PROMOTER_RUN_ID:-}" python3 <<'PY'
          import json,os,re
          p=json.loads(os.environ["STATUS_PAYLOAD"]); latest={}
          for row in p.get("statuses",[]):
              ctx=str(row.get("context") or "")
              stamp=str(row.get("updated_at") or row.get("created_at") or "")
              if ctx and (ctx not in latest or stamp > str(latest[ctx].get("_omega_stamp") or "")):
                  latest[ctx]={**row,"_omega_stamp":stamp}
          row=latest.get("omega/release-live") or {}
          if row.get("state")!="success":
              print("WAIT")
          else:
              target=str(row.get("target_url") or "")
              current=os.environ.get("PROMOTER_RUN_ID") or ""
              if current and target.endswith("/actions/runs/"+current):
                  print("READY")
              elif current:
                  print("STALE")
              else:
                  print("READY")
          PY
          )"
          if [ "$decision" != READY ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "OMEGA_POST_LIVE_NOT_EXECUTED state=$decision candidate=$candidate"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "final_sha=$candidate" >> "$GITHUB_OUTPUT"
          echo "source_ref=$source_ref" >> "$GITHUB_OUTPUT"

      - name: Verify release, provenance and immediate health contract
        if: steps.live.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.OMEGA_BOOTSTRAP_TOKEN }}
          FINAL_SHA: ${{ steps.live.outputs.final_sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/post-live/assets" "$RUNNER_TEMP/post-live/report"
          publish_failure() {
            rc=$?
            trap - EXIT
            if [ "$rc" -ne 0 ]; then
              for ctx in omega/post-live-smoke omega/live-certified; do
                gh api --method POST "/repos/$PRIVATE_REPOSITORY/statuses/$FINAL_SHA"                   -f state=failure -f context="$ctx"                   -f description="post-live production verification failed"                   -f target_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" >/dev/null || true
              done
            fi
            exit "$rc"
          }
          trap publish_failure EXIT

          main_sha="$(gh api "/repos/$PRIVATE_REPOSITORY/commits/main" --jq .sha)"
          [ "$main_sha" = "$FINAL_SHA" ] || { echo "OMEGA_POST_LIVE_MAIN_SHA_MISMATCH:$main_sha!=$FINAL_SHA" >&2; exit 70; }

          statuses="$(gh api "/repos/$PRIVATE_REPOSITORY/commits/$FINAL_SHA/status?per_page=100")"
          STATUS_PAYLOAD="$statuses" python3 <<'PY'
          import json,sys
          p=json.loads(__import__("os").environ["STATUS_PAYLOAD"]); latest={}
          for row in p.get("statuses",[]):
              ctx=str(row.get("context") or "")
              stamp=str(row.get("updated_at") or row.get("created_at") or "")
              if ctx and (ctx not in latest or stamp > str(latest[ctx].get("_omega_stamp") or "")):
                  latest[ctx]={**row,"_omega_stamp":stamp}
          required=(
              "omega/hosted-ci/python311","omega/hosted-ci/python313","omega/hosted-ci/python314",
              "omega/hosted-ci/storage","omega/hosted-governance","omega/hosted-android",
              "omega/exact-final-validation","omega/release-evidence-staged","omega/android-release-unsigned",
              "omega/federation-v3-release","omega/hosted-recovery","omega/recovery-attestation",
              "omega/candidate-evidence-root","omega/signer/continuity","omega/android-release-signed",
              "omega/android-runtime-coldstart","omega/release-live",
          )
          bad=[ctx for ctx in required if (latest.get(ctx) or {}).get("state")!="success"]
          if bad:
              raise SystemExit("OMEGA_POST_LIVE_REQUIRED_GATE_NOT_PASS:"+",".join(bad))
          PY

          authority="$(gh api "/repos/$CONTROL_REPOSITORY/contents/federation/epochs/current.json?ref=main" --jq '.content' | python3 -c 'import base64,sys; print(base64.b64decode("".join(sys.stdin.read().split()),validate=True).decode(),end="")')"
          AUTHORITY="$authority" FINAL_SHA="$FINAL_SHA" python3 <<'PY'
          import json,os
          d=json.loads(os.environ["AUTHORITY"]); p=d.get("primary") or {}
          if d.get("state")!="PASS" or p.get("certification_state")!="PASS" or p.get("source_sha")!=os.environ["FINAL_SHA"]:
              raise SystemExit("OMEGA_POST_LIVE_FEDERATION_AUTHORITY_MISMATCH")
          if any(x.get("state")!="PASS" or x.get("contract_state")!="PASS" for x in d.get("peers") or []):
              raise SystemExit("OMEGA_POST_LIVE_FEDERATION_PEER_NOT_PASS")
          PY

          releases="$(gh api "/repos/$PRIVATE_REPOSITORY/releases?per_page=30")"
          row="$(RELEASES="$releases" FINAL_SHA="$FINAL_SHA" python3 <<'PY'
          import json,os
          rows=[r for r in json.loads(os.environ["RELEASES"]) if str(r.get("target_commitish") or "")==os.environ["FINAL_SHA"] and not r.get("draft") and not r.get("prerelease")]
          if len(rows)!=1:
              raise SystemExit(f"OMEGA_POST_LIVE_RELEASE_COUNT:{len(rows)}")
          print(rows[0]["tag_name"])
          PY
          )"
          tag="$row"
          gh release download "$tag" -R "$PRIVATE_REPOSITORY" -D "$RUNNER_TEMP/post-live/assets"

          cd "$RUNNER_TEMP/post-live/assets"
          required=(
            OMEGA-Engine.apk
            OMEGA-Engine.apk.sha256
            OMEGA-Engine.provenance.json
            OMEGA-Engine.apk.sigstore.json
            OMEGA-Engine.provenance.sigstore.json
            OMEGA-Engine.sbom.spdx.json
            OMEGA-Engine.supply-chain.json
            OMEGA-Engine.final-recovery-root.json
          )
          for name in "${required[@]}"; do test -s "$name" || { echo "OMEGA_POST_LIVE_RELEASE_ASSET_MISSING:$name" >&2; exit 71; }; done
          actual="$(sha256sum OMEGA-Engine.apk | awk '{print $1}')"
          recorded="$(awk '{print $1}' OMEGA-Engine.apk.sha256)"
          [ "$actual" = "$recorded" ] || { echo OMEGA_POST_LIVE_APK_CHECKSUM_MISMATCH >&2; exit 72; }

          FINAL_SHA="$FINAL_SHA" APK_SHA="$actual" python3 <<'PY'
          import hashlib,json,os,pathlib,re
          prov=json.loads(pathlib.Path("OMEGA-Engine.provenance.json").read_text(encoding="utf-8"))
          root=json.loads(pathlib.Path("OMEGA-Engine.final-recovery-root.json").read_text(encoding="utf-8"))
          if prov.get("classification")!="PRODUCTION_FINAL" or prov.get("production_final") is not True:
              raise SystemExit("OMEGA_POST_LIVE_PROVENANCE_CLASS_INVALID")
          if prov.get("source_commit")!=os.environ["FINAL_SHA"] or prov.get("apk_sha256")!=os.environ["APK_SHA"]:
              raise SystemExit("OMEGA_POST_LIVE_PROVENANCE_IDENTITY_MISMATCH")
          if prov.get("signer_continuity")!="PASS":
              raise SystemExit("OMEGA_POST_LIVE_SIGNER_CONTINUITY_NOT_PASS")
          if root.get("state")!="PASS" or root.get("source_sha")!=os.environ["FINAL_SHA"]:
              raise SystemExit("OMEGA_POST_LIVE_FINAL_RECOVERY_ROOT_NOT_PASS")
          if prov.get("candidate_evidence_root_sha256")!=root.get("candidate_evidence_root_sha256"):
              raise SystemExit("OMEGA_POST_LIVE_ROOT_DIGEST_MISMATCH")
          for name,key in (
              ("OMEGA-Engine.sbom.spdx.json","sbom_file_sha256"),
              ("OMEGA-Engine.supply-chain.json","supply_chain_report_sha256"),
          ):
              digest=hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()
              if prov.get(key)!=digest:
                  raise SystemExit("OMEGA_POST_LIVE_ASSET_PROVENANCE_MISMATCH:"+name)
          PY

          cd "$GITHUB_WORKSPACE"
          python3 - <<'PY' > "$RUNNER_TEMP/post-live/report/post-live.json"
          import datetime,json,os
          print(json.dumps({
            "schema_version":1,
            "state":"PASS",
            "source_sha":os.environ["FINAL_SHA"],
            "checked_at":datetime.datetime.now(datetime.timezone.utc).isoformat(),
            "checks":[
              "private_main_exact_sha","all_release_gates_success","federation_authority_pass",
              "release_asset_set_complete","apk_checksum","production_provenance","final_recovery_root",
              "sbom_digest","supply_chain_digest","sigstore_verification_pending_next_step"
            ],
          },indent=2))
          PY

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        if: steps.live.outputs.ready == 'true'

      - name: Verify release Sigstore bundles and certify live
        if: steps.live.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.OMEGA_BOOTSTRAP_TOKEN }}
          FINAL_SHA: ${{ steps.live.outputs.final_sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$RUNNER_TEMP/post-live/assets"
          identity="https://github.com/${{ github.repository }}/.github/workflows/omega-final-release-promoter.yml@refs/heads/main"
          issuer="https://token.actions.githubusercontent.com"
          cosign verify-blob OMEGA-Engine.apk             --bundle OMEGA-Engine.apk.sigstore.json             --certificate-identity "$identity"             --certificate-oidc-issuer "$issuer" >/dev/null
          cosign verify-blob OMEGA-Engine.provenance.json             --bundle OMEGA-Engine.provenance.sigstore.json             --certificate-identity "$identity"             --certificate-oidc-issuer "$issuer" >/dev/null
          FINAL_SHA="$FINAL_SHA" python3 <<'PY' > "$RUNNER_TEMP/post-live/report/live-certified.json"
          import datetime,hashlib,json,os,pathlib
          def sha(name):
              return hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()
          prov=json.loads(pathlib.Path("OMEGA-Engine.provenance.json").read_text(encoding="utf-8"))
          print(json.dumps({
              "schema_version":1,
              "state":"LIVE-CERTIFIED",
              "source_sha":os.environ["FINAL_SHA"],
              "apk_sha256":sha("OMEGA-Engine.apk"),
              "provenance_sha256":sha("OMEGA-Engine.provenance.json"),
              "sbom_sha256":sha("OMEGA-Engine.sbom.spdx.json"),
              "supply_chain_sha256":sha("OMEGA-Engine.supply-chain.json"),
              "final_recovery_root_sha256":sha("OMEGA-Engine.final-recovery-root.json"),
              "signer_certificate_sha256":prov.get("signer_certificate_sha256"),
              "sigstore_verified":True,
              "post_live_run_id":os.environ.get("GITHUB_RUN_ID"),
              "certified_at":datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "immutability":{
                  "new_deviation_requires_new_epoch":True,
                  "old_evidence_runs_are_never_mutated":True
              }
          },indent=2,sort_keys=True,allow_nan=False))
          PY
          for ctx in omega/post-live-smoke omega/live-certified; do
            gh api --method POST "/repos/$PRIVATE_REPOSITORY/statuses/$FINAL_SHA"               -f state=success -f context="$ctx"               -f description="published production release and immediate health/provenance independently verified"               -f target_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" >/dev/null
          done
          echo "OMEGA_POST_LIVE_PASS sha=$FINAL_SHA state=LIVE-CERTIFIED"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && steps.live.outputs.ready == 'true'
        with:
          name: OMEGA-Post-Live-${{ steps.live.outputs.final_sha }}
          path: ${{ runner.temp }}/post-live/report
          if-no-files-found: warn
          retention-days: 30
