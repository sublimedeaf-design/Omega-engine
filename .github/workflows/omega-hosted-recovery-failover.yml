# exact-main recovery probe: cdcdd099740184a455f321975f259db320b75b46
name: OMEGA Hosted Recovery Failover

on:
  workflow_dispatch:
  schedule:
    - cron: "7,37 * * * *"   # production-main recovery
    - cron: "22,52 * * * *"  # current hardening-candidate recovery watchdog
  push:
    paths:
      - "bootstrap/omega/recovery-trigger.txt"

permissions:
  contents: read

# Recovery consumes caches as untrusted acceleration only. Never allow this
# proof workflow to publish/overwrite cache entries; model bytes are still
# SHA-256 verified before execution.
cache-mode: read

concurrency:
  # Serialize every candidate recovery proof in one candidate lane, regardless
  # of whether it came from an exact-trigger push or the candidate watchdog.
  # This prevents duplicate clean-recovery runs for the same frozen candidate
  # from consuming hosted-runner minutes in parallel. Routine-main stays isolated.
  group: omega-hosted-recovery-v3-${{ (github.event_name == 'push' || (github.event_name == 'schedule' && github.event.schedule == '22,52 * * * *')) && 'candidate' || 'routine-main' }}
  # A trigger-file push is an explicit newer control-plane intent and may
  # supersede an older candidate watchdog/proof still occupying this lane.
  # Scheduled watchdogs and routine-main never cancel active recovery.
  cancel-in-progress: ${{ github.event_name == 'push' }}
  queue: max

env:
  PRIVATE_REPOSITORY: sublimedeaf-design/Omega-engines

jobs:
  pin:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    outputs:
      sha: ${{ steps.pin.outputs.sha }}
      need_run: ${{ steps.pin.outputs.need_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: pin
        env:
          GH_TOKEN: ${{ secrets.OMEGA_BOOTSTRAP_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule || '' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          main_sha="$(gh api "/repos/$PRIVATE_REPOSITORY/commits/main" --jq '.sha')"
          [[ "$main_sha" =~ ^[0-9a-f]{40}$ ]]
          sha="$main_sha"
          mode=main
          candidate_watch=false
          if [ "$EVENT_NAME" = push ] || { [ "$EVENT_NAME" = schedule ] && [ "$EVENT_SCHEDULE" = "22,52 * * * *" ]; }; then
            candidate_watch=true
          fi
          if [ "$candidate_watch" = true ] && [ -s bootstrap/omega/recovery-trigger.txt ]; then
            local_trigger="$(tr -d '\r\n' < bootstrap/omega/recovery-trigger.txt)"
            current_b64="$(gh api "/repos/${GITHUB_REPOSITORY}/contents/bootstrap/omega/recovery-trigger.txt?ref=main" --jq '.content' 2>/dev/null || true)"
            current_trigger=""
            if [ -n "$current_b64" ]; then
              current_trigger="$(printf '%s' "$current_b64" | base64 -d | tr -d '\r\n')"
            fi
            [ -n "$current_trigger" ] || { echo "OMEGA_RECOVERY_CURRENT_TRIGGER_UNREADABLE" >&2; exit 68; }
            if [ "$local_trigger" != "$current_trigger" ]; then
              read -r _ stale_candidate _ < bootstrap/omega/recovery-trigger.txt || true
              [[ "${stale_candidate:-}" =~ ^[0-9a-f]{40}$ ]] || stale_candidate="$main_sha"
              echo "sha=$stale_candidate" >> "$GITHUB_OUTPUT"
              echo "need_run=false" >> "$GITHUB_OUTPUT"
              echo "OMEGA_HOSTED_RECOVERY_STALE_TRIGGER skipped local=$local_trigger current=$current_trigger"
              exit 0
            fi
            read -r marker candidate source_ref _ < bootstrap/omega/recovery-trigger.txt || true
            if [ "${marker:-}" = recover-exact ]; then
              [[ "${candidate:-}" =~ ^[0-9a-f]{40}$ ]] || { echo "OMEGA_RECOVERY_TRIGGER_SHA_INVALID" >&2; exit 64; }
              [[ "${source_ref:-}" =~ ^[A-Za-z0-9._/-]+$ ]] || {
                echo "OMEGA_RECOVERY_TRIGGER_REF_INVALID:candidate=$candidate ref=${source_ref:-missing}" >&2
                exit 67
              }
              case "$source_ref" in *..*|/*|-*) echo "OMEGA_RECOVERY_TRIGGER_REF_UNSAFE:$source_ref" >&2; exit 67 ;; esac
              ref_tip="$(gh api "/repos/$PRIVATE_REPOSITORY/commits?sha=$source_ref&per_page=1" --jq '.[0].sha // empty')"
              [[ "$ref_tip" =~ ^[0-9a-f]{40}$ ]] || { echo "OMEGA_RECOVERY_TRIGGER_REF_TIP_INVALID:$source_ref" >&2; exit 67; }
              if [ "$ref_tip" != "$candidate" ]; then
                echo "OMEGA_RECOVERY_TRIGGER_ADVANCED stale=$candidate current=$ref_tip ref=$source_ref"
                candidate="$ref_tip"
              fi
              if [ "$candidate" != "$main_sha" ]; then
                compare="$(gh api "/repos/$PRIVATE_REPOSITORY/compare/$main_sha...$candidate")"
                relation="$(printf '%s' "$compare" | jq -r '.status // ""')"
                behind="$(printf '%s' "$compare" | jq -r '.behind_by // 999999')"
                if [ "$relation" != ahead ] || [ "$behind" != 0 ]; then
                  echo "OMEGA_RECOVERY_TRIGGER_NOT_CURRENT_BASE:status=$relation behind=$behind main=$main_sha candidate=$candidate" >&2
                  exit 66
                fi
              fi
              sha="$candidate"
              mode=exact_candidate
            fi
          fi
          if [ "$mode" = main ]; then
            protocol_ok=true
            for required in scripts/install_locked_ci_deps.py scripts/materialize_gradle_verification.py scripts/validate_supply_chain_locks.py deploy/hosted/recovery-contract.json; do
              if ! gh api "/repos/$PRIVATE_REPOSITORY/contents/$required?ref=$sha" >/dev/null 2>&1; then
                protocol_ok=false
                echo "OMEGA_HOSTED_RECOVERY_MAIN_PROTOCOL_MISSING:$required sha=$sha"
              fi
            done
            if [ "$protocol_ok" != true ]; then
              echo "sha=$sha" >> "$GITHUB_OUTPUT"
              echo "need_run=false" >> "$GITHUB_OUTPUT"
              echo "OMEGA_HOSTED_RECOVERY_MAIN_PROTOCOL_NOT_EXECUTED sha=$sha"
              exit 0
            fi
          fi
          payload="$(gh api "/repos/$PRIVATE_REPOSITORY/commits/$sha/status")"
          need_run=true
          # Exact-candidate probes always rerun: a success emitted by an older
          # recovery implementation must never suppress validation of a newer
          # failproof protocol for the same source SHA.
          # Explicit push probes always rerun. Scheduled main/candidate watchdogs
          # skip an exact SHA that already has a green recovery certificate.
          if { [ "$mode" != exact_candidate ] || [ "$EVENT_NAME" = schedule ]; } && printf '%s' "$payload" | python3 -c 'import json,sys; d=json.load(sys.stdin); latest={}; [(latest.setdefault(str(x.get("context") or ""),str(x.get("state") or ""))) for x in d.get("statuses",[]) if x.get("context")]; raise SystemExit(0 if latest.get("omega/hosted-recovery")=="success" else 1)'; then
            need_run=false
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "need_run=$need_run" >> "$GITHUB_OUTPUT"
          echo "OMEGA_HOSTED_RECOVERY_PIN sha=$sha need_run=$need_run mode=$mode main=$main_sha"

  pre_recovery:
    needs: pin
    if: ${{ needs.pin.outputs.need_run == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      recovery_package_sha256: ${{ steps.package.outputs.sha256 }}
    timeout-minutes: 90
    env:
      OMEGA_SOURCE_SHA: ${{ needs.pin.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.PRIVATE_REPOSITORY }}
          ref: ${{ env.OMEGA_SOURCE_SHA }}
          token: ${{ secrets.OMEGA_BOOTSTRAP_TOKEN }}
          persist-credentials: false
          # Full history is a proof input here: validate_supply_chain_locks.py
          # must prove the recorded Gradle dependency-root source is an ancestor
          # of this exact candidate and inspect dependency-input drift.
          fetch-depth: 0
          path: omega
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: omega/requirements-ci.lock
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: "8.13"
          cache-read-only: true
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/omega-state/model-cache
          key: omega-localbrain-models-v4-${{ hashFiles('omega/deploy/hosted/hf-model-manifest.json') }}
      - name: Prepare exact hosted runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          need_apt=false
          for cmd in gcc g++ make cmake ninja pkg-config zstd; do
            command -v "$cmd" >/dev/null 2>&1 || need_apt=true
          done
          pkg-config --exists libcurl >/dev/null 2>&1 || need_apt=true
          if [ "$need_apt" = true ]; then
            sudo apt-get -o Acquire::Retries=4 update -qq
            sudo apt-get -o Acquire::Retries=4 install -y --no-install-recommends build-essential cmake ninja-build pkg-config libcurl4-openssl-dev zstd
          else
            echo "OMEGA_HOSTED_PREREQS_REUSED"
          fi
          if [ -d "$ANDROID_HOME/platforms/android-36" ] && [ -x "$ANDROID_HOME/build-tools/36.0.0/apksigner" ]; then
            echo "OMEGA_ANDROID_SDK_REUSED platform=36 build_tools=36.0.0"
          else
            sdk_ok=false
            for attempt in 1 2 3 4; do
              if "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;36.0.0" >/dev/null; then
                sdk_ok=true
                break
              fi
              echo "OMEGA_ANDROID_SDK_RETRY attempt=$attempt" >&2
              sleep $((attempt * 5))
            done
            "$sdk_ok" || { echo "OMEGA_ANDROID_SDK_INSTALL_FAILED" >&2; exit 75; }
          fi
          cd omega
          test "$(git rev-parse HEAD)" = "$OMEGA_SOURCE_SHA"
          python -m venv .venv
          .venv/bin/python scripts/install_locked_ci_deps.py
          .venv/bin/python scripts/materialize_gradle_verification.py
          .venv/bin/python scripts/validate_supply_chain_locks.py --out reports/recovery-supply-chain-locks.json
          {
            echo "OMEGA_STATE=$RUNNER_TEMP/omega-state"
            echo "OMEGA_AUTO_REBUILD=0"
            echo "OMEGA_LOCAL_BRAIN_CONTEXT=4096"
            echo "OMEGA_LOCAL_BRAIN_THREADS=4"
          } >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/omega-state/evidence" "$RUNNER_TEMP/omega-state/logs"
      - name: Run full exact-SHA pre-recovery acceptance
        working-directory: omega
        shell: bash
        run: |
          set -Eeuo pipefail
          source_sha="$(git rev-parse HEAD)"
          test "$source_sha" = "$OMEGA_SOURCE_SHA"
          # The workflow executes in the public helper repo, so GitHub's default
          # GITHUB_SHA identifies the helper commit. Child OMEGA processes must
          # instead serialize the exact private execution source.
          export OMEGA_GIT_COMMIT="$source_sha"
          export GITHUB_SHA="$source_sha"
          timeout --signal=TERM --kill-after=30s 50m bash deploy/codespaces/acceptance-test.sh
          test -s "$OMEGA_STATE/evidence/acceptance-pre-rebuild.json"
      - name: Record source and VM identity
        working-directory: omega
        shell: bash
        run: |
          python3 - <<'PY'
          import datetime,json,os,pathlib,subprocess
          state=pathlib.Path(os.environ["OMEGA_STATE"])/"evidence"
          source=subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip()
          payload={
              "schema_version":1,
              "source_sha":source,
              "boot_id":pathlib.Path("/proc/sys/kernel/random/boot_id").read_text().strip(),
              "github_run_id":os.environ["GITHUB_RUN_ID"],
              "github_job":os.environ["GITHUB_JOB"],
              "at":datetime.datetime.now(datetime.timezone.utc).isoformat(),
          }
          (state/"hosted-pre-recovery.json").write_text(json.dumps(payload,indent=2)+"\n",encoding="utf-8")
          PY
      - name: Materialize complete bound evidence set for release handoff
        if: ${{ success() }}
        working-directory: omega
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import hashlib,json,os,pathlib,shutil

          # Acceptance generates the authoritative recovery bindings and ledgers
          # directly under OMEGA_STATE/evidence. Packaging must preserve that
          # exact dynamic evidence root instead of reading stale checkout evidence.
          source=(pathlib.Path(os.environ["OMEGA_STATE"])/"evidence").resolve()
          destination=source
          destination.mkdir(parents=True,exist_ok=True)

          required={
              "execution-envelope.json",
              "execution-runtime.json",
              "federation-epoch.json",
              "federation-epoch.authority.json",
              "t24-binding.json",
              "t60-binding.json",
              "qa-binding.json",
              "settlement-binding.json",
              "latest-24h.json",
              "latest-t60.json",
              "latest-settlement.json",
              "coverage-gaps.json",
              "intelligence-refresh-t24.json",
              "intelligence-refresh-t60.json",
              "acceptance-agents.json",
              "latest-agent-promotion.json",
              "repo-audit-after-agents.json",
              "forecast-ledger.jsonl",
              "shadow-ledger.jsonl",
              "prematch-intelligence.jsonl",
          }
          bindings=("t24-binding.json","t60-binding.json","qa-binding.json","settlement-binding.json")

          def digest(path):
              h=hashlib.sha256()
              with path.open("rb") as fh:
                  for chunk in iter(lambda:fh.read(1<<20),b""):
                      h.update(chunk)
              return h.hexdigest()

          for binding_name in bindings:
              binding_path=source/binding_name
              if not binding_path.is_file():
                  raise SystemExit("OMEGA_RECOVERY_BOUND_BINDING_MISSING:"+binding_name)
              binding=json.loads(binding_path.read_text(encoding="utf-8"))
              if binding.get("binding_state")!="PASS":
                  raise SystemExit("OMEGA_RECOVERY_BOUND_BINDING_NOT_PASS:"+binding_name)
              for row in binding.get("artifacts",[]):
                  raw=str(row.get("path") or "")
                  logical=pathlib.PurePosixPath(raw)
                  if logical.is_absolute() or ".." in logical.parts or not logical.parts:
                      raise SystemExit("OMEGA_RECOVERY_BOUND_PATH_UNSAFE:"+raw)
                  required.add(str(logical))
                  artifact=source/pathlib.Path(*logical.parts)
                  if not artifact.is_file():
                      raise SystemExit("OMEGA_RECOVERY_BOUND_ARTIFACT_MISSING:"+raw)
                  expected=str(row.get("sha256") or "").lower()
                  actual=digest(artifact)
                  if actual!=expected:
                      raise SystemExit("OMEGA_RECOVERY_BOUND_ARTIFACT_HASH_MISMATCH:"+raw)

          manifest=[]
          for raw in sorted(required):
              logical=pathlib.PurePosixPath(raw)
              if logical.is_absolute() or ".." in logical.parts or not logical.parts:
                  raise SystemExit("OMEGA_RECOVERY_EVIDENCE_PATH_UNSAFE:"+raw)
              src=source/pathlib.Path(*logical.parts)
              if not src.is_file():
                  raise SystemExit("OMEGA_RECOVERY_RELEASE_EVIDENCE_MISSING:"+raw)
              if src.is_symlink():
                  raise SystemExit("OMEGA_RECOVERY_RELEASE_EVIDENCE_SYMLINK:"+raw)
              dst=destination/pathlib.Path(*logical.parts)
              dst.parent.mkdir(parents=True,exist_ok=True)
              if src.resolve()!=dst.resolve():
                  shutil.copy2(src,dst)
              manifest.append({
                  "path":raw,
                  "sha256":digest(dst),
                  "bytes":dst.stat().st_size,
              })

          manifest_path=destination/"recovery-package-manifest.json"
          manifest_path.write_text(
              json.dumps(
                  {"schema_version":1,"source_sha":os.environ["OMEGA_SOURCE_SHA"],"artifacts":manifest},
                  indent=2,sort_keys=True,allow_nan=False,
              )+"\n",
              encoding="utf-8",
          )
          print(f"OMEGA_RECOVERY_RELEASE_EVIDENCE_READY artifacts={len(manifest)}")
          PY
          python3 scripts/evidence_identity.py verify \
            --envelope "$OMEGA_STATE/evidence/execution-envelope.json" \
            --binding "$OMEGA_STATE/evidence/t24-binding.json" \
            --binding "$OMEGA_STATE/evidence/t60-binding.json" \
            --binding "$OMEGA_STATE/evidence/qa-binding.json" \
            --json-file "$OMEGA_STATE/evidence/latest-24h.json" \
            --json-file "$OMEGA_STATE/evidence/latest-t60.json"

      - name: Package recovery state with hard integrity manifest
        id: package
        if: ${{ success() }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -s "$RUNNER_TEMP/omega-state/evidence/acceptance-pre-rebuild.json"
          test -s "$RUNNER_TEMP/omega-state/evidence/hosted-pre-recovery.json"
          test -s "$RUNNER_TEMP/omega-state/evidence/recovery-package-manifest.json"
          test -s "$RUNNER_TEMP/omega-state/logs/codespaces-acceptance.pass"
          tar -C "$RUNNER_TEMP/omega-state" -czf "$RUNNER_TEMP/omega-recovery-state.tgz" \
            evidence logs
          (
            cd "$RUNNER_TEMP"
            sha256sum omega-recovery-state.tgz > omega-recovery-state.tgz.sha256
            sha256sum -c omega-recovery-state.tgz.sha256
            digest="$(awk '{print $1}' omega-recovery-state.tgz.sha256)"
            [[ "$digest" =~ ^[0-9a-f]{64}$ ]]
            echo "sha256=$digest" >> "$GITHUB_OUTPUT"
          )
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ success() }}
        with:
          name: omega-hosted-recovery-${{ needs.pin.outputs.sha }}
          path: |
            ${{ runner.temp }}/omega-recovery-state.tgz
            ${{ runner.temp }}/omega-recovery-state.tgz.sha256
          retention-days: 2
          if-no-files-found: error

      - name: Preserve failed pre-recovery diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: omega-hosted-recovery-failure-${{ needs.pin.outputs.sha }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/omega-state/evidence
            ${{ runner.temp }}/omega-state/logs
          retention-days: 2
          if-no-files-found: warn

  post_recovery:
    needs: [pin, pre_recovery]
    if: ${{ always() && needs.pin.outputs.need_run == 'true' && needs.pre_recovery.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OMEGA_SOURCE_SHA: ${{ needs.pin.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.PRIVATE_REPOSITORY }}
          ref: ${{ env.OMEGA_SOURCE_SHA }}
          token: ${{ secrets.OMEGA_BOOTSTRAP_TOKEN }}
          persist-credentials: false
          # Full history is a proof input here: validate_supply_chain_locks.py
          # must prove the recorded Gradle dependency-root source is an ancestor
          # of this exact candidate and inspect dependency-input drift.
          fetch-depth: 0
          path: omega
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: omega/requirements-ci.lock
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: "8.13"
          cache-read-only: true
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/omega-state/model-cache
          key: omega-localbrain-models-v4-${{ hashFiles('omega/deploy/hosted/hf-model-manifest.json') }}
      - name: Prepare clean recovery VM
        shell: bash
        run: |
          set -Eeuo pipefail
          need_apt=false
          for cmd in gcc g++ make cmake ninja pkg-config zstd; do
            command -v "$cmd" >/dev/null 2>&1 || need_apt=true
          done
          pkg-config --exists libcurl >/dev/null 2>&1 || need_apt=true
          if [ "$need_apt" = true ]; then
            sudo apt-get -o Acquire::Retries=4 update -qq
            sudo apt-get -o Acquire::Retries=4 install -y --no-install-recommends build-essential cmake ninja-build pkg-config libcurl4-openssl-dev zstd
          else
            echo "OMEGA_HOSTED_PREREQS_REUSED"
          fi
          if [ -d "$ANDROID_HOME/platforms/android-36" ] && [ -x "$ANDROID_HOME/build-tools/36.0.0/apksigner" ]; then
            echo "OMEGA_ANDROID_SDK_REUSED platform=36 build_tools=36.0.0"
          else
            sdk_ok=false
            for attempt in 1 2 3 4; do
              if "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;36.0.0" >/dev/null; then
                sdk_ok=true
                break
              fi
              echo "OMEGA_ANDROID_SDK_RETRY attempt=$attempt" >&2
              sleep $((attempt * 5))
            done
            "$sdk_ok" || { echo "OMEGA_ANDROID_SDK_INSTALL_FAILED" >&2; exit 75; }
          fi
          cd omega
          test "$(git rev-parse HEAD)" = "$OMEGA_SOURCE_SHA"
          python -m venv .venv
          .venv/bin/python scripts/install_locked_ci_deps.py
          .venv/bin/python scripts/materialize_gradle_verification.py
          .venv/bin/python scripts/validate_supply_chain_locks.py --out reports/recovery-supply-chain-locks.json
          echo "OMEGA_STATE=$RUNNER_TEMP/omega-state" >> "$GITHUB_ENV"
          echo "OMEGA_LOCAL_BRAIN_CONTEXT=4096" >> "$GITHUB_ENV"
          echo "OMEGA_LOCAL_BRAIN_THREADS=4" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/omega-state/evidence"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: omega-hosted-recovery-${{ needs.pin.outputs.sha }}
          path: ${{ runner.temp }}/omega-recovery-artifact
      - name: Verify recovery artifact integrity and restore
        id: restore
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$RUNNER_TEMP/omega-recovery-artifact"
          test -s omega-recovery-state.tgz
          test -s omega-recovery-state.tgz.sha256
          # download-artifact already verifies GitHub's immutable v4 artifact digest.
          # Re-runs can lose a successful upstream job output, so the content-level
          # digest inside that immutable artifact is the canonical recovery-package
          # digest when the needs output is absent.
          recorded="$(awk '{print $1}' omega-recovery-state.tgz.sha256)"
          [[ "$recorded" =~ ^[0-9a-f]{64}$ ]] || { echo "OMEGA_RECOVERY_RECORDED_DIGEST_INVALID" >&2; exit 41; }
          expected="${{ needs.pre_recovery.outputs.recovery_package_sha256 }}"
          if [[ "$expected" =~ ^[0-9a-f]{64}$ ]]; then
            [ "$recorded" = "$expected" ] || { echo "OMEGA_RECOVERY_DIGEST_METADATA_MISMATCH:$recorded!=$expected" >&2; exit 42; }
          else
            expected="$recorded"
            echo "OMEGA_RECOVERY_UPSTREAM_OUTPUT_UNAVAILABLE using_immutable_artifact_digest=$expected"
          fi
          actual="$(sha256sum omega-recovery-state.tgz | awk '{print $1}')"
          [ "$actual" = "$expected" ] || { echo "OMEGA_RECOVERY_ARTIFACT_HASH_MISMATCH:$actual!=$expected" >&2; exit 43; }
          sha256sum -c omega-recovery-state.tgz.sha256
          echo "sha256=$expected" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/omega-state"
          python3 - "$RUNNER_TEMP/omega-recovery-artifact/omega-recovery-state.tgz" "$RUNNER_TEMP/omega-state" <<'PY'
          import pathlib,sys,tarfile
          archive=pathlib.Path(sys.argv[1])
          dest=pathlib.Path(sys.argv[2])
          with tarfile.open(archive,"r:gz") as tf:
              members=tf.getmembers()
              if not members:
                  raise SystemExit("OMEGA_RECOVERY_ARCHIVE_EMPTY")
              for member in members:
                  name=pathlib.PurePosixPath(member.name)
                  if name.is_absolute() or ".." in name.parts:
                      raise SystemExit(f"OMEGA_RECOVERY_ARCHIVE_PATH_UNSAFE:{member.name}")
                  if not name.parts or name.parts[0] not in {"evidence","logs"}:
                      raise SystemExit(f"OMEGA_RECOVERY_ARCHIVE_SCOPE_INVALID:{member.name}")
                  if member.issym() or member.islnk() or member.isdev():
                      raise SystemExit(f"OMEGA_RECOVERY_ARCHIVE_SPECIAL_FILE_REJECTED:{member.name}")
              tf.extractall(dest,members=members,filter="data")
          PY
          test -s "$RUNNER_TEMP/omega-state/evidence/acceptance-pre-rebuild.json"
          test -s "$RUNNER_TEMP/omega-state/evidence/hosted-pre-recovery.json"
      - name: Verify clean-environment recovery
        working-directory: omega
        shell: bash
        run: bash deploy/hosted/verify-recovery.sh

      - name: Issue machine-readable recovery attestation
        id: attestation
        working-directory: omega
        env:
          RECOVERY_PACKAGE_SHA256: ${{ steps.restore.outputs.sha256 }}
        shell: bash
        run: |
          set -Eeuo pipefail
          .venv/bin/python - <<'PY'
          import datetime,hashlib,json,os,pathlib,re

          state=pathlib.Path(os.environ["OMEGA_STATE"])/"evidence"
          source=os.environ["OMEGA_SOURCE_SHA"]
          package_sha=os.environ["RECOVERY_PACKAGE_SHA256"].lower()
          if not re.fullmatch(r"[0-9a-f]{40}",source):
              raise SystemExit("RECOVERY_ATTESTATION_SOURCE_SHA_INVALID")
          if not re.fullmatch(r"[0-9a-f]{64}",package_sha):
              raise SystemExit("RECOVERY_ATTESTATION_PACKAGE_SHA_INVALID")

          names=(
              "hosted-pre-recovery.json",
              "hosted-recovery-live.json",
              "execution-envelope.json",
              "recovery-binding.json",
              "hosted-recovery-agents.json",
              "repo-audit-hosted-recovery.json",
              "OMEGA-Engine-debug-hosted-recovery.apk.sha256",
          )
          for name in names:
              if not (state/name).is_file():
                  raise SystemExit(f"RECOVERY_ATTESTATION_EVIDENCE_MISSING:{name}")

          def load(name):
              return json.loads((state/name).read_text(encoding="utf-8"))
          def sha(path):
              h=hashlib.sha256()
              with path.open("rb") as fh:
                  for chunk in iter(lambda:fh.read(1<<20),b""):
                      h.update(chunk)
              return h.hexdigest()
          def parse_time(value):
              return datetime.datetime.fromisoformat(str(value).replace("Z","+00:00")).astimezone(datetime.timezone.utc)

          pre=load("hosted-pre-recovery.json")
          live=load("hosted-recovery-live.json")
          env=load("execution-envelope.json")
          binding=load("recovery-binding.json")
          if pre.get("source_sha")!=source or live.get("source_sha")!=source or env.get("source_sha")!=source:
              raise SystemExit("RECOVERY_ATTESTATION_SOURCE_MISMATCH")
          xid=str(env.get("omega_execution_id") or "")
          if not re.fullmatch(r"[0-9a-f]{64}",xid):
              raise SystemExit("RECOVERY_ATTESTATION_EXECUTION_ID_INVALID")
          if live.get("omega_execution_id")!=xid or binding.get("omega_execution_id")!=xid:
              raise SystemExit("RECOVERY_ATTESTATION_EXECUTION_ID_MISMATCH")
          if binding.get("binding_state")!="PASS":
              raise SystemExit("RECOVERY_ATTESTATION_BINDING_NOT_PASS")
          required_true=(
              "recovery_gate","fresh_vm_proven","ledger_hashes_match_pre_rebuild",
              "localbrain_recovered","independent_qa_recovered",
              "multi_agent_smoke_recovered","apk_signature_verified",
          )
          bad=[k for k in required_true if live.get(k) is not True]
          if bad:
              raise SystemExit("RECOVERY_ATTESTATION_LIVE_ASSERTION_FAILED:"+",".join(bad))

          rows=[]
          for name in names:
              path=state/name
              rows.append({"path":name,"sha256":sha(path),"bytes":path.stat().st_size})
          supply=pathlib.Path("reports/recovery-supply-chain-locks.json")
          if not supply.is_file():
              raise SystemExit("RECOVERY_ATTESTATION_SUPPLY_CHAIN_REPORT_MISSING")
          rows.append({"path":"reports/recovery-supply-chain-locks.json","sha256":sha(supply),"bytes":supply.stat().st_size})
          rows.sort(key=lambda x:x["path"])
          root=hashlib.sha256(json.dumps(rows,sort_keys=True,separators=(",",":")).encode()).hexdigest()

          start=parse_time(pre["at"])
          finish=parse_time(live["at"])
          observed=max(0.0,(finish-start).total_seconds())
          ledger_names=("forecast-ledger.jsonl","shadow-ledger.jsonl","prematch-intelligence.jsonl","inplay-ledger.jsonl")
          protected_bytes=0
          for name in ledger_names:
              p=state/name
              if not p.is_file():
                  raise SystemExit(f"RECOVERY_ATTESTATION_LEDGER_MISSING:{name}")
              protected_bytes+=p.stat().st_size

          predicate={
              "schema_version":1,
              "result":"PASS",
              "source_sha":source,
              "omega_execution_id":xid,
              "recovery_package_sha256":package_sha,
              "evidence_root_sha256":root,
              "federation_lock_sha256":env.get("federation_lock_sha256"),
              "federation_authority_repository":env.get("federation_authority_repository"),
              "federation_authority_commit":env.get("federation_authority_commit"),
              "dependency_lock_sha256":env.get("dependency_lock_sha256"),
              "environment_lock_sha256":env.get("environment_lock_sha256"),
              "hf_model_manifest_sha256":env.get("hf_model_manifest_sha256"),
              "worker_model_sha256":live.get("worker_model_sha256"),
              "qa_model_sha256":live.get("qa_model_sha256"),
              "fresh_environment":{
                  "pre_boot_id":live.get("pre_boot_id"),
                  "post_boot_id":live.get("post_boot_id"),
                  "proven":live.get("fresh_vm_proven") is True,
              },
              "continuity":{
                  "protected_ledgers":list(ledger_names),
                  "protected_bytes":protected_bytes,
                  "data_loss_bytes":0,
                  "basis":"exact pre/post SHA-256 equality for all protected ledgers",
              },
              "rto":{
                  "state":"MEASURED",
                  "seconds":round(observed,3),
                  "semantics":"hosted clean-recovery evidence window from pre-recovery snapshot timestamp to verified recovery completion",
              },
              "rpo":{
                  "state":"MEASURED",
                  "seconds":round(observed,3),
                  "objective_seconds":None,
                  "semantics":"observed age of the restored protected-state snapshot at certification completion in the isolated two-VM recovery test; production RPO objective is not configured",
              },
              "artifacts":rows,
              "completed_at":finish.isoformat(),
              "github_run_id":os.environ.get("GITHUB_RUN_ID"),
              "github_run_attempt":os.environ.get("GITHUB_RUN_ATTEMPT"),
          }
          statement={
              "_type":"https://in-toto.io/Statement/v1",
              "subject":[{"name":"omega-hosted-recovery-evidence","digest":{"sha256":root}}],
              "predicateType":"https://omega.local/attestation/recovery/v1",
              "predicate":predicate,
          }
          out=state/"recovery-attestation.json"
          out.write_text(json.dumps(statement,indent=2,sort_keys=True,allow_nan=False)+"\n",encoding="utf-8")
          digest=sha(out)
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as fh:
              fh.write(f"sha256={digest}\n")
              fh.write(f"evidence_root_sha256={root}\n")
          print(f"OMEGA_RECOVERY_ATTESTATION_PASS source={source} execution_id={xid} sha256={digest} rto_seconds={observed:.3f} observed_rpo_seconds={observed:.3f} data_loss_bytes=0")
          PY

      - name: Upload immutable recovery attestation evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: omega-recovery-attestation-${{ needs.pin.outputs.sha }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/omega-state/evidence/recovery-attestation.json
            ${{ runner.temp }}/omega-state/evidence/hosted-recovery-live.json
            ${{ runner.temp }}/omega-state/evidence/execution-envelope.json
            ${{ runner.temp }}/omega-state/evidence/recovery-binding.json
            ${{ runner.temp }}/omega-state/evidence/hosted-recovery-agents.json
            ${{ runner.temp }}/omega-state/evidence/repo-audit-hosted-recovery.json
            ${{ runner.temp }}/omega-state/evidence/OMEGA-Engine-debug-hosted-recovery.apk.sha256
            omega/reports/recovery-supply-chain-locks.json
          retention-days: 7
          if-no-files-found: error

      - name: Publish hosted recovery status
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ secrets.OMEGA_BOOTSTRAP_TOKEN }}
          RESULT: ${{ job.status }}
          ATTESTATION_SHA256: ${{ steps.attestation.outputs.sha256 }}
        shell: bash
        run: |
          set +x
          state=failure
          [ "$RESULT" = success ] && state=success
          target="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          desc="clean two-VM hosted recovery: $RESULT"
          attest_desc="recovery attestation: $RESULT"
          [ -n "$ATTESTATION_SHA256" ] && attest_desc="$attest_desc sha256=${ATTESTATION_SHA256:0:12}"
          gh api --method POST "/repos/$PRIVATE_REPOSITORY/statuses/$OMEGA_SOURCE_SHA" \
            -f state="$state" \
            -f context="omega/hosted-recovery" \
            -f description="$desc" \
            -f target_url="$target" >/dev/null
          gh api --method POST "/repos/$PRIVATE_REPOSITORY/statuses/$OMEGA_SOURCE_SHA" \
            -f state="$state" \
            -f context="omega/recovery-attestation" \
            -f description="$attest_desc" \
            -f target_url="$target" >/dev/null

  pre_recovery_failure_status:
    needs: [pin, pre_recovery]
    if: ${{ always() && needs.pin.outputs.need_run == 'true' && needs.pre_recovery.result == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Publish pre-recovery failure
        env:
          GH_TOKEN: ${{ secrets.OMEGA_BOOTSTRAP_TOKEN }}
          OMEGA_SOURCE_SHA: ${{ needs.pin.outputs.sha }}
        shell: bash
        run: |
          set +x
          gh api --method POST "/repos/$PRIVATE_REPOSITORY/statuses/$OMEGA_SOURCE_SHA" \
            -f state=failure \
            -f context="omega/hosted-recovery" \
            -f description="hosted pre-recovery acceptance failed" >/dev/null
          gh api --method POST "/repos/$PRIVATE_REPOSITORY/statuses/$OMEGA_SOURCE_SHA" \
            -f state=failure \
            -f context="omega/recovery-attestation" \
            -f description="recovery attestation unavailable: pre-recovery failed" >/dev/null
