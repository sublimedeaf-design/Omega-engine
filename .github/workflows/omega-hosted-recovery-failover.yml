# exact-main recovery probe: cdcdd099740184a455f321975f259db320b75b46
name: OMEGA Hosted Recovery Failover

on:
  workflow_dispatch:
  schedule:
    - cron: "7,37 * * * *"
  push:
    paths:
      - "bootstrap/omega/recovery-trigger.txt"

permissions:
  contents: read

# Recovery consumes caches as untrusted acceleration only. Never allow this
# proof workflow to publish/overwrite cache entries; model bytes are still
# SHA-256 verified before execution.
cache-mode: read

concurrency:
  # Serialize explicit recovery proofs and keep their queue. The pin job rejects
  # stale trigger revisions, preventing cancellation livelock and redundant
  # parallel recovery jobs from exhausting hosted-runner capacity.
  group: omega-hosted-recovery-${{ github.event_name == 'schedule' && 'routine' || 'exact-candidate' }}
  cancel-in-progress: false
  queue: max

env:
  PRIVATE_REPOSITORY: sublimedeaf-design/Omega-engines

jobs:
  pin:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    outputs:
      sha: ${{ steps.pin.outputs.sha }}
      need_run: ${{ steps.pin.outputs.need_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: pin
        env:
          GH_TOKEN: ${{ secrets.OMEGA_BOOTSTRAP_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          main_sha="$(gh api "/repos/$PRIVATE_REPOSITORY/commits/main" --jq '.sha')"
          [[ "$main_sha" =~ ^[0-9a-f]{40}$ ]]
          sha="$main_sha"
          mode=main
          if [ "$EVENT_NAME" = push ] && [ -s bootstrap/omega/recovery-trigger.txt ]; then
            local_trigger="$(tr -d '\r\n' < bootstrap/omega/recovery-trigger.txt)"
            current_b64="$(gh api "/repos/${GITHUB_REPOSITORY}/contents/bootstrap/omega/recovery-trigger.txt?ref=main" --jq '.content' 2>/dev/null || true)"
            current_trigger=""
            if [ -n "$current_b64" ]; then
              current_trigger="$(printf '%s' "$current_b64" | base64 -d | tr -d '\r\n')"
            fi
            [ -n "$current_trigger" ] || { echo "OMEGA_RECOVERY_CURRENT_TRIGGER_UNREADABLE" >&2; exit 68; }
            if [ "$local_trigger" != "$current_trigger" ]; then
              read -r _ stale_candidate _ < bootstrap/omega/recovery-trigger.txt || true
              [[ "${stale_candidate:-}" =~ ^[0-9a-f]{40}$ ]] || stale_candidate="$main_sha"
              echo "sha=$stale_candidate" >> "$GITHUB_OUTPUT"
              echo "need_run=false" >> "$GITHUB_OUTPUT"
              echo "OMEGA_HOSTED_RECOVERY_STALE_TRIGGER skipped local=$local_trigger current=$current_trigger"
              exit 0
            fi
            read -r marker candidate source_ref _ < bootstrap/omega/recovery-trigger.txt || true
            if [ "${marker:-}" = recover-exact ]; then
              [[ "${candidate:-}" =~ ^[0-9a-f]{40}$ ]] || { echo "OMEGA_RECOVERY_TRIGGER_SHA_INVALID" >&2; exit 64; }
              if [ "$candidate" != "$main_sha" ]; then
                compare="$(gh api "/repos/$PRIVATE_REPOSITORY/compare/$main_sha...$candidate")"
                relation="$(printf '%s' "$compare" | jq -r '.status // ""')"
                behind="$(printf '%s' "$compare" | jq -r '.behind_by // 999999')"
                if [ "$relation" != ahead ] || [ "$behind" != 0 ]; then
                  echo "OMEGA_RECOVERY_TRIGGER_NOT_CURRENT_BASE:status=$relation behind=$behind main=$main_sha candidate=$candidate" >&2
                  exit 66
                fi
              fi
              # Bind the trigger to the current tip of an explicit source branch.
              # This uses the commits endpoint already available to the least-privilege
              # bootstrap token and rejects stale-but-still-ahead candidate SHAs.
              [[ "${source_ref:-}" =~ ^[A-Za-z0-9._/-]+$ ]] || {
                echo "OMEGA_RECOVERY_TRIGGER_REF_INVALID:candidate=$candidate ref=${source_ref:-missing}" >&2
                exit 67
              }
              case "$source_ref" in *..*|/*|-*) echo "OMEGA_RECOVERY_TRIGGER_REF_UNSAFE:$source_ref" >&2; exit 67 ;; esac
              ref_tip="$(gh api "/repos/$PRIVATE_REPOSITORY/commits?sha=$source_ref&per_page=1" --jq '.[0].sha // empty')"
              [ "$ref_tip" = "$candidate" ] || {
                echo "OMEGA_RECOVERY_TRIGGER_NOT_REF_TIP:candidate=$candidate ref=$source_ref tip=$ref_tip" >&2
                exit 67
              }
              sha="$candidate"
              mode=exact_candidate
            fi
          fi
          payload="$(gh api "/repos/$PRIVATE_REPOSITORY/commits/$sha/status")"
          need_run=true
          # Exact-candidate probes always rerun: a success emitted by an older
          # recovery implementation must never suppress validation of a newer
          # failproof protocol for the same source SHA.
          if [ "$mode" != exact_candidate ] && printf '%s' "$payload" | python3 -c 'import json,sys; d=json.load(sys.stdin); latest={}; [(latest.setdefault(str(x.get("context") or ""),str(x.get("state") or ""))) for x in d.get("statuses",[]) if x.get("context")]; raise SystemExit(0 if latest.get("omega/hosted-recovery")=="success" else 1)'; then
            need_run=false
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "need_run=$need_run" >> "$GITHUB_OUTPUT"
          echo "OMEGA_HOSTED_RECOVERY_PIN sha=$sha need_run=$need_run mode=$mode main=$main_sha"

  pre_recovery:
    needs: pin
    if: ${{ needs.pin.outputs.need_run == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      recovery_package_sha256: ${{ steps.package.outputs.sha256 }}
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ secrets.OMEGA_BOOTSTRAP_TOKEN }}
      OMEGA_SOURCE_SHA: ${{ needs.pin.outputs.sha }}
      OMEGA_LLAMA_CPP_COMMIT: "b29c606e28a01b1bc8c1351026a0fa6e616bf6c4"
      OMEGA_LOCAL_BRAIN_MODEL_SHA256: "cc324af070c2ecbfd324a30884d2f951a7ff756aba85cb811a6ec436933bb046"
      OMEGA_LOCAL_QA_BRAIN_MODEL_SHA256: "1d9614638d18024d0fbb36575a15f1302a3adf044df10345688ec4f6e1c4ff32"
      OMEGA_LOCAL_BRAIN_MODEL_URL: "https://huggingface.co/Qwen/Qwen2.5-Coder-1.5B-Instruct-GGUF/resolve/2ab9f8f42af02fc212effaef7c4850c885e965f4/qwen2.5-coder-1.5b-instruct-q4_k_m.gguf?download=true"
      OMEGA_LOCAL_QA_BRAIN_MODEL_URL: "https://huggingface.co/Qwen/Qwen2.5-Coder-0.5B-Instruct-GGUF/resolve/bf1da6ca8f02b444067db175f02a14e74f49c5c0/qwen2.5-coder-0.5b-instruct-q4_k_m.gguf?download=true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.PRIVATE_REPOSITORY }}
          ref: ${{ env.OMEGA_SOURCE_SHA }}
          token: ${{ secrets.OMEGA_BOOTSTRAP_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: omega
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: "8.13"
          cache-disabled: true
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/omega-state/model-cache
          key: omega-localbrain-models-v3-worker-cc324af070c2ecbfd324a30884d2f951a7ff756aba85cb811a6ec436933bb046-qa-1d9614638d18024d0fbb36575a15f1302a3adf044df10345688ec4f6e1c4ff32
      - name: Prepare exact hosted runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get -o Acquire::Retries=4 update -qq
          sudo apt-get -o Acquire::Retries=4 install -y --no-install-recommends build-essential cmake ninja-build pkg-config libcurl4-openssl-dev zstd
          sdk_ok=false
          for attempt in 1 2 3 4; do
            if "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;36.0.0" >/dev/null; then
              sdk_ok=true
              break
            fi
            echo "OMEGA_ANDROID_SDK_RETRY attempt=$attempt" >&2
            sleep $((attempt * 5))
          done
          "$sdk_ok" || { echo "OMEGA_ANDROID_SDK_INSTALL_FAILED" >&2; exit 75; }
          cd omega
          test "$(git rev-parse HEAD)" = "$OMEGA_SOURCE_SHA"
          python -m venv .venv
          .venv/bin/python -m pip --retries 5 --timeout 60 install --upgrade pip
          .venv/bin/python -m pip --retries 5 --timeout 60 install -c requirements-ci.lock -e '.[dev,data]'
          {
            echo "OMEGA_STATE=$RUNNER_TEMP/omega-state"
            echo "OMEGA_AUTO_REBUILD=0"
            echo "OMEGA_LOCAL_BRAIN_CONTEXT=4096"
            echo "OMEGA_LOCAL_BRAIN_THREADS=4"
          } >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/omega-state/evidence" "$RUNNER_TEMP/omega-state/logs"
      - name: Run full exact-SHA pre-recovery acceptance
        working-directory: omega
        shell: bash
        run: |
          set -Eeuo pipefail
          timeout --signal=TERM --kill-after=30s 50m bash deploy/codespaces/acceptance-test.sh
          test -s "$OMEGA_STATE/evidence/acceptance-pre-rebuild.json"
      - name: Record source and VM identity
        working-directory: omega
        shell: bash
        run: |
          python3 - <<'PY'
          import datetime,json,os,pathlib,subprocess
          state=pathlib.Path(os.environ["OMEGA_STATE"])/"evidence"
          source=subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip()
          payload={
              "schema_version":1,
              "source_sha":source,
              "boot_id":pathlib.Path("/proc/sys/kernel/random/boot_id").read_text().strip(),
              "github_run_id":os.environ["GITHUB_RUN_ID"],
              "github_job":os.environ["GITHUB_JOB"],
              "at":datetime.datetime.now(datetime.timezone.utc).isoformat(),
          }
          (state/"hosted-pre-recovery.json").write_text(json.dumps(payload,indent=2)+"\n",encoding="utf-8")
          PY
      - name: Package recovery state with hard integrity manifest
        id: package
        if: ${{ success() }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -s "$RUNNER_TEMP/omega-state/evidence/acceptance-pre-rebuild.json"
          test -s "$RUNNER_TEMP/omega-state/evidence/hosted-pre-recovery.json"
          test -s "$RUNNER_TEMP/omega-state/logs/codespaces-acceptance.pass"
          tar -C "$RUNNER_TEMP/omega-state" -czf "$RUNNER_TEMP/omega-recovery-state.tgz" \
            evidence logs
          (
            cd "$RUNNER_TEMP"
            sha256sum omega-recovery-state.tgz > omega-recovery-state.tgz.sha256
            sha256sum -c omega-recovery-state.tgz.sha256
            digest="$(awk '{print $1}' omega-recovery-state.tgz.sha256)"
            [[ "$digest" =~ ^[0-9a-f]{64}$ ]]
            echo "sha256=$digest" >> "$GITHUB_OUTPUT"
          )
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ success() }}
        with:
          name: omega-hosted-recovery-${{ needs.pin.outputs.sha }}
          path: |
            ${{ runner.temp }}/omega-recovery-state.tgz
            ${{ runner.temp }}/omega-recovery-state.tgz.sha256
          retention-days: 2
          if-no-files-found: error

      - name: Preserve failed pre-recovery diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: omega-hosted-recovery-failure-${{ needs.pin.outputs.sha }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/omega-state/evidence
            ${{ runner.temp }}/omega-state/logs
          retention-days: 2
          if-no-files-found: warn

  post_recovery:
    needs: [pin, pre_recovery]
    if: ${{ always() && needs.pin.outputs.need_run == 'true' && needs.pre_recovery.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ secrets.OMEGA_BOOTSTRAP_TOKEN }}
      OMEGA_SOURCE_SHA: ${{ needs.pin.outputs.sha }}
      OMEGA_LLAMA_CPP_COMMIT: "b29c606e28a01b1bc8c1351026a0fa6e616bf6c4"
      OMEGA_LOCAL_BRAIN_MODEL_SHA256: "cc324af070c2ecbfd324a30884d2f951a7ff756aba85cb811a6ec436933bb046"
      OMEGA_LOCAL_QA_BRAIN_MODEL_SHA256: "1d9614638d18024d0fbb36575a15f1302a3adf044df10345688ec4f6e1c4ff32"
      OMEGA_LOCAL_BRAIN_MODEL_URL: "https://huggingface.co/Qwen/Qwen2.5-Coder-1.5B-Instruct-GGUF/resolve/2ab9f8f42af02fc212effaef7c4850c885e965f4/qwen2.5-coder-1.5b-instruct-q4_k_m.gguf?download=true"
      OMEGA_LOCAL_QA_BRAIN_MODEL_URL: "https://huggingface.co/Qwen/Qwen2.5-Coder-0.5B-Instruct-GGUF/resolve/bf1da6ca8f02b444067db175f02a14e74f49c5c0/qwen2.5-coder-0.5b-instruct-q4_k_m.gguf?download=true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.PRIVATE_REPOSITORY }}
          ref: ${{ env.OMEGA_SOURCE_SHA }}
          token: ${{ secrets.OMEGA_BOOTSTRAP_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: omega
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: "8.13"
          cache-disabled: true
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/omega-state/model-cache
          key: omega-localbrain-models-v3-worker-cc324af070c2ecbfd324a30884d2f951a7ff756aba85cb811a6ec436933bb046-qa-1d9614638d18024d0fbb36575a15f1302a3adf044df10345688ec4f6e1c4ff32
      - name: Prepare clean recovery VM
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get -o Acquire::Retries=4 update -qq
          sudo apt-get -o Acquire::Retries=4 install -y --no-install-recommends build-essential cmake ninja-build pkg-config libcurl4-openssl-dev zstd
          sdk_ok=false
          for attempt in 1 2 3 4; do
            if "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;36.0.0" >/dev/null; then
              sdk_ok=true
              break
            fi
            echo "OMEGA_ANDROID_SDK_RETRY attempt=$attempt" >&2
            sleep $((attempt * 5))
          done
          "$sdk_ok" || { echo "OMEGA_ANDROID_SDK_INSTALL_FAILED" >&2; exit 75; }
          cd omega
          test "$(git rev-parse HEAD)" = "$OMEGA_SOURCE_SHA"
          python -m venv .venv
          .venv/bin/python -m pip --retries 5 --timeout 60 install --upgrade pip
          .venv/bin/python -m pip --retries 5 --timeout 60 install -c requirements-ci.lock -e '.[dev,data]'
          echo "OMEGA_STATE=$RUNNER_TEMP/omega-state" >> "$GITHUB_ENV"
          echo "OMEGA_LOCAL_BRAIN_CONTEXT=4096" >> "$GITHUB_ENV"
          echo "OMEGA_LOCAL_BRAIN_THREADS=4" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/omega-state/evidence"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: omega-hosted-recovery-${{ needs.pin.outputs.sha }}
          path: ${{ runner.temp }}/omega-recovery-artifact
      - name: Verify recovery artifact integrity and restore
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$RUNNER_TEMP/omega-recovery-artifact"
          test -s omega-recovery-state.tgz
          test -s omega-recovery-state.tgz.sha256
          expected="${{ needs.pre_recovery.outputs.recovery_package_sha256 }}"
          [[ "$expected" =~ ^[0-9a-f]{64}$ ]] || { echo "OMEGA_RECOVERY_EXPECTED_DIGEST_INVALID" >&2; exit 41; }
          recorded="$(awk '{print $1}' omega-recovery-state.tgz.sha256)"
          [ "$recorded" = "$expected" ] || { echo "OMEGA_RECOVERY_DIGEST_METADATA_MISMATCH:$recorded!=$expected" >&2; exit 42; }
          actual="$(sha256sum omega-recovery-state.tgz | awk '{print $1}')"
          [ "$actual" = "$expected" ] || { echo "OMEGA_RECOVERY_ARTIFACT_HASH_MISMATCH:$actual!=$expected" >&2; exit 43; }
          sha256sum -c omega-recovery-state.tgz.sha256
          mkdir -p "$RUNNER_TEMP/omega-state"
          python3 - "$RUNNER_TEMP/omega-recovery-state.tgz" "$RUNNER_TEMP/omega-state" <<'PY'
          import pathlib,sys,tarfile
          archive=pathlib.Path(sys.argv[1])
          dest=pathlib.Path(sys.argv[2])
          with tarfile.open(archive,"r:gz") as tf:
              members=tf.getmembers()
              if not members:
                  raise SystemExit("OMEGA_RECOVERY_ARCHIVE_EMPTY")
              for member in members:
                  name=pathlib.PurePosixPath(member.name)
                  if name.is_absolute() or ".." in name.parts:
                      raise SystemExit(f"OMEGA_RECOVERY_ARCHIVE_PATH_UNSAFE:{member.name}")
                  if not name.parts or name.parts[0] not in {"evidence","logs"}:
                      raise SystemExit(f"OMEGA_RECOVERY_ARCHIVE_SCOPE_INVALID:{member.name}")
                  if member.issym() or member.islnk() or member.isdev():
                      raise SystemExit(f"OMEGA_RECOVERY_ARCHIVE_SPECIAL_FILE_REJECTED:{member.name}")
              tf.extractall(dest,members=members,filter="data")
          PY
          test -s "$RUNNER_TEMP/omega-state/evidence/acceptance-pre-rebuild.json"
          test -s "$RUNNER_TEMP/omega-state/evidence/hosted-pre-recovery.json"
      - name: Verify clean-environment recovery
        working-directory: omega
        shell: bash
        run: bash deploy/hosted/verify-recovery.sh
      - name: Publish hosted recovery status
        if: ${{ always() }}
        env:
          RESULT: ${{ job.status }}
        shell: bash
        run: |
          set +x
          state=failure
          [ "$RESULT" = success ] && state=success
          gh api --method POST "/repos/$PRIVATE_REPOSITORY/statuses/$OMEGA_SOURCE_SHA" \
            -f state="$state" \
            -f context="omega/hosted-recovery" \
            -f description="clean two-VM hosted recovery: $RESULT" >/dev/null

  pre_recovery_failure_status:
    needs: [pin, pre_recovery]
    if: ${{ always() && needs.pin.outputs.need_run == 'true' && needs.pre_recovery.result == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Publish pre-recovery failure
        env:
          GH_TOKEN: ${{ secrets.OMEGA_BOOTSTRAP_TOKEN }}
          OMEGA_SOURCE_SHA: ${{ needs.pin.outputs.sha }}
        shell: bash
        run: |
          set +x
          gh api --method POST "/repos/$PRIVATE_REPOSITORY/statuses/$OMEGA_SOURCE_SHA" \
            -f state=failure \
            -f context="omega/hosted-recovery" \
            -f description="hosted pre-recovery acceptance failed" >/dev/null
