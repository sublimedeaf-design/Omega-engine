# exact-SHA hosted bridge generation: 12
name: OMEGA Private CI Hosted Bridge

on:
  workflow_dispatch:
  schedule:
    - cron: "17,47 * * * *"
  push:
    paths:
      - ".github/workflows/omega-private-ci-bridge.yml"
      - "bootstrap/omega/validation-trigger.txt"

permissions:
  contents: read

# Exact-source proof path: no dependency/build cache enters the trust boundary.
cache-mode: none

concurrency:
  group: omega-private-ci-hosted-bridge
  cancel-in-progress: false
  queue: max

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.head.outputs.sha }}
      need_run: ${{ steps.head.outputs.need_run }}
    steps:
      - id: head
        env:
          GH_TOKEN: ${{ secrets.OMEGA_BOOTSTRAP_TOKEN }}
        shell: bash
        run: |
          set +x
          sha="$(gh api /repos/sublimedeaf-design/Omega-engines/commits/main --jq .sha)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          need_run=true
          max_age_minutes="$(gh api "/repos/sublimedeaf-design/Omega-engines/contents/.omega/external-validation.json?ref=$sha" --jq '.content' | tr -d '\n' | base64 -d | jq -r '.max_status_age_minutes // 180')"
          [[ "$max_age_minutes" =~ ^[0-9]+$ ]] && [ "$max_age_minutes" -ge 1 ] && [ "$max_age_minutes" -le 1440 ] || {
            echo "OMEGA_HOSTED_EVIDENCE_MAX_AGE_INVALID:$max_age_minutes" >&2
            exit 65
          }
          if payload="$(gh api "/repos/sublimedeaf-design/Omega-engines/commits/$sha/status" 2>/dev/null)"; then
            if STATUS_PAYLOAD="$payload" MAX_AGE_MINUTES="$max_age_minutes" python3 <<'PY'
          import datetime,json,os
          d=json.loads(os.environ["STATUS_PAYLOAD"])
          max_age=int(os.environ["MAX_AGE_MINUTES"])
          now=datetime.datetime.now(datetime.timezone.utc)
          want={
              "omega/hosted-ci/python311","omega/hosted-ci/python313",
              "omega/hosted-ci/python314","omega/hosted-ci/storage",
              "omega/hosted-governance","omega/hosted-android",
          }
          latest={}
          for row in d.get("statuses",[]):
              context=str(row.get("context") or "")
              stamp=str(row.get("updated_at") or row.get("created_at") or "")
              if context and (context not in latest or stamp > str(latest[context].get("_stamp") or "")):
                  latest[context]={**row,"_stamp":stamp}
          def fresh_success(context):
              row=latest.get(context)
              if not row or row.get("state")!="success":
                  return False
              raw=str(row.get("updated_at") or row.get("created_at") or "")
              try:
                  at=datetime.datetime.fromisoformat(raw.replace("Z","+00:00"))
              except ValueError:
                  return False
              age=(now-at).total_seconds()
              return -300 <= age <= max_age*60
          raise SystemExit(0 if all(fresh_success(k) for k in want) else 1)
          PY
            then
              need_run=false
            fi
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "need_run=$need_run" >> "$GITHUB_OUTPUT"
          echo "OMEGA_PRIVATE_HEAD=$sha need_run=$need_run"

  ci:
    needs: discover
    if: needs.discover.outputs.need_run == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: python311
            python: "3.11"
            extra: "dev"
            command: "python -m pytest -q && python -m compileall -q src scripts && python -m pip check"
          - lane: python313
            python: "3.13"
            extra: "dev"
            command: "python -m pytest -q && python -m compileall -q src scripts && python -m pip check && python scripts/materialize_gradle_verification.py && python scripts/validate_supply_chain_locks.py --out reports/supply-chain-locks.json && python scripts/generate_omega_sbom.py --out reports/omega-sbom.spdx.json && python scripts/repo_audit.py --out reports/repo-audit-ci.json && python -c \"from omega.research.preflight import run_preflight; r=run_preflight('reports/preflight-ci.json'); assert r['passed'], r\" && python scripts/final_audit_gate.py --audit reports/repo-audit-ci.json --out reports/final-audit-gate.json"
          - lane: python314
            python: "3.14"
            extra: "dev"
            command: "python -m pytest -q && python -m compileall -q src scripts && python -m pip check"
          - lane: storage
            python: "3.13"
            extra: "dev,data"
            command: "python -m pytest -q tests/test_storage.py tests/test_support_runtime_integrity.py && python -c \"from omega.research.preflight import run_preflight; [(_ for _ in ()).throw(AssertionError(r)) if not (r:=run_preflight(backend=b))['passed'] or r['storage_backend']!=b else None for b in ('sqlite','duckdb')]\" && python -m pip check"
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
      - name: Checkout exact private source with git provenance
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: sublimedeaf-design/Omega-engines
          ref: ${{ needs.discover.outputs.sha }}
          token: ${{ secrets.OMEGA_BOOTSTRAP_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: srcdir
      - name: Run lane
        working-directory: srcdir
        shell: bash
        run: |
          python scripts/install_locked_ci_deps.py
          ${{ matrix.command }}
      - name: Publish exact-SHA lane status
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ secrets.OMEGA_BOOTSTRAP_TOKEN }}
          OMEGA_SHA: ${{ needs.discover.outputs.sha }}
          LANE: ${{ matrix.lane }}
          RESULT: ${{ job.status }}
        shell: bash
        run: |
          set +x
          state=failure; [ "$RESULT" = success ] && state=success
          gh api --method POST "/repos/sublimedeaf-design/Omega-engines/statuses/$OMEGA_SHA"             -f state="$state" -f context="omega/hosted-ci/$LANE"             -f description="public hosted bridge: $RESULT" >/dev/null

  android:
    needs: discover
    if: needs.discover.outputs.need_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OMEGA_SOURCE_SHA: ${{ needs.discover.outputs.sha }}
    steps:
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: "17"
      - name: Checkout exact private Android source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: sublimedeaf-design/Omega-engines
          ref: ${{ needs.discover.outputs.sha }}
          token: ${{ secrets.OMEGA_BOOTSTRAP_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: srcdir
      - name: Verify exact source
        working-directory: srcdir
        run: test "$(git rev-parse HEAD)" = "$OMEGA_SOURCE_SHA"
      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: "8.13"
      - name: Materialize exact Gradle verification metadata
        working-directory: srcdir
        run: python3 scripts/materialize_gradle_verification.py
      - name: Compile lint and verify debug signature
        working-directory: srcdir/android
        shell: bash
        run: |
          gradle --no-daemon --dependency-verification strict --stacktrace lintDebug assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify app/build/outputs/apk/debug/app-debug.apk
      - name: Publish exact-SHA Android verifier status
        if: ${{ always() }}
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.OMEGA_BOOTSTRAP_TOKEN }}
          RESULT: ${{ job.status }}
        run: |
          set +x
          state=failure; [ "$RESULT" = success ] && state=success
          gh api --method POST "/repos/sublimedeaf-design/Omega-engines/statuses/$OMEGA_SOURCE_SHA" \
            -f state="$state" -f context="omega/hosted-android" \
            -f description="public hosted Android compile/lint verifier: $RESULT" >/dev/null

  governance:
    needs: discover
    if: needs.discover.outputs.need_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: "3.13"}
      - name: Checkout exact private source with git provenance
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: sublimedeaf-design/Omega-engines
          ref: ${{ needs.discover.outputs.sha }}
          token: ${{ secrets.OMEGA_BOOTSTRAP_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: srcdir
      - name: Validate governance
        working-directory: srcdir
        run: |
          python scripts/validate_agent_handoff.py --self-check
          python scripts/agent_orchestrator.py --agents .omega/agents.json --plan .omega/work-plan.json validate
      - name: Publish governance status
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ secrets.OMEGA_BOOTSTRAP_TOKEN }}
          OMEGA_SHA: ${{ needs.discover.outputs.sha }}
          RESULT: ${{ job.status }}
        shell: bash
        run: |
          set +x
          state=failure; [ "$RESULT" = success ] && state=success
          gh api --method POST "/repos/sublimedeaf-design/Omega-engines/statuses/$OMEGA_SHA"             -f state="$state" -f context="omega/hosted-governance"             -f description="public hosted governance: $RESULT" >/dev/null
