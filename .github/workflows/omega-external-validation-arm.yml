name: OMEGA Legacy External Validation Arm

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: omega-external-validation-arm
  cancel-in-progress: false

jobs:
  arm:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Reconcile exact-main external validation refs
        env:
          OMEGA_GITHUB_TOKEN: ${{ secrets.OMEGA_BOOTSTRAP_TOKEN }}
          OMEGA_LEDGER_TOKEN: ${{ github.token }}
          OMEGA_CONTROL_TARGET_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node control-plane/github.mjs
