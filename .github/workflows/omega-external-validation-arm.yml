name: OMEGA External Validation Arm

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
  push:
    paths:
      - ".github/workflows/omega-external-validation-arm.yml"
      - ".github/workflows/omega-external-validator-dispatch.yml"

permissions:
  contents: read
  actions: write

# This workflow does not trust or require Actions cache state.
cache-mode: none

concurrency:
  group: omega-external-validation-arm
  cancel-in-progress: false

env:
  PRIVATE_REPOSITORY: sublimedeaf-design/Omega-engines

jobs:
  arm:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Arm direct exact-SHA external validation without private ref writes
        env:
          OMEGA_PRIVATE_TOKEN: ${{ secrets.OMEGA_BOOTSTRAP_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          PUBLIC_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x

          private_api() {
            curl -fsS --retry 4 --retry-all-errors --connect-timeout 20 --max-time 60 \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $OMEGA_PRIVATE_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com$1"
          }

          sha="$(private_api "/repos/$PRIVATE_REPOSITORY/commits/main" | jq -r '.sha // empty')"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "OMEGA_EXTERNAL_ARM_MAIN_SHA_INVALID" >&2; exit 64; }

          policy="$(private_api "/repos/$PRIVATE_REPOSITORY/contents/.omega/external-validation.json?ref=$sha" | jq -r '.content // empty' | tr -d '\n' | base64 -d)"
          max_age_minutes="$(printf '%s' "$policy" | jq -r '.max_status_age_minutes // 180')"
          [[ "$max_age_minutes" =~ ^[0-9]+$ ]] && [ "$max_age_minutes" -ge 1 ] && [ "$max_age_minutes" -le 1440 ] || {
            echo "OMEGA_EXTERNAL_ARM_MAX_AGE_INVALID:$max_age_minutes" >&2
            exit 65
          }

          statuses="$(private_api "/repos/$PRIVATE_REPOSITORY/commits/$sha/status?per_page=100")"
          read -r core_green external_complete < <(STATUS_PAYLOAD="$statuses" MAX_AGE_MINUTES="$max_age_minutes" python3 <<'PY'
          import datetime,json,os
          p=json.loads(os.environ["STATUS_PAYLOAD"])
          max_age=int(os.environ["MAX_AGE_MINUTES"])
          now=datetime.datetime.now(datetime.timezone.utc)
          latest={}
          for row in p.get("statuses",[]):
              context=str(row.get("context") or "")
              stamp=str(row.get("updated_at") or row.get("created_at") or "")
              if context and (context not in latest or stamp > str(latest[context].get("_stamp") or "")):
                  latest[context]={**row,"_stamp":stamp}
          hosted=[
              "omega/hosted-ci/python311","omega/hosted-ci/python313",
              "omega/hosted-ci/python314","omega/hosted-ci/storage",
              "omega/hosted-governance",
          ]
          external=[
              "omega/control-plane/source-pin","omega/control-plane/direct-dispatch",
              "omega/external/github/python311","omega/external/github/python313",
              "omega/external/github/python314","omega/external/github/storage",
              "omega/external/github/governance",
              "omega/external/render/python311","omega/external/render/python313",
              "omega/external/render/python314","omega/external/render/storage",
              "omega/external/render/governance",
          ]
          def fresh_success(context):
              row=latest.get(context)
              if not row or row.get("state")!="success":
                  return False
              raw=str(row.get("updated_at") or row.get("created_at") or "")
              try:
                  at=datetime.datetime.fromisoformat(raw.replace("Z","+00:00"))
              except ValueError:
                  return False
              age=(now-at).total_seconds()
              return -300 <= age <= max_age*60
          core=all(fresh_success(x) for x in hosted)
          complete=core and all(fresh_success(x) for x in external)
          print("true" if core else "false","true" if complete else "false")
          PY
          )

          if [ "$core_green" != true ]; then
            echo "OMEGA_EXTERNAL_ARM_WAIT_HOSTED_CORE sha=$sha"
            exit 0
          fi
          if [ "$external_complete" = true ]; then
            echo "OMEGA_EXTERNAL_ARM_CURRENT sha=$sha"
            exit 0
          fi

          dispatch_ref="${GITHUB_REF_NAME:-main}"

          # Avoid duplicate dispatch only for this helper ref. A main validation
          # must not suppress independent support-branch proof, and vice versa.
          active="$(gh api "/repos/$PUBLIC_REPOSITORY/actions/workflows/omega-external-validator-dispatch.yml/runs?per_page=50" \
            --jq '[.workflow_runs[] | select(.head_branch=="'"$dispatch_ref"'" and (.status=="queued" or .status=="in_progress" or .status=="pending"))] | length')"
          if [ "$active" != 0 ]; then
            echo "OMEGA_EXTERNAL_ARM_ACTIVE sha=$sha ref=$dispatch_ref active=$active"
            exit 0
          fi

          # Bound retries per helper ref to one dispatch per 15 minutes after
          # a failed/incomplete run.
          latest_created="$(gh api "/repos/$PUBLIC_REPOSITORY/actions/workflows/omega-external-validator-dispatch.yml/runs?per_page=50" \
            --jq '[.workflow_runs[] | select(.head_branch=="'"$dispatch_ref"'")][0].created_at // empty')"
          if [ -n "$latest_created" ]; then
            set +e
            python3 - "$latest_created" <<'PY'
          import datetime,sys
          raw=sys.argv[1]
          t=datetime.datetime.fromisoformat(raw.replace("Z","+00:00"))
          age=(datetime.datetime.now(datetime.timezone.utc)-t).total_seconds()
          if age < 900:
              print(f"OMEGA_EXTERNAL_ARM_COOLDOWN age_seconds={int(age)}")
              raise SystemExit(75)
          PY
            rc=$?
            set -e
            if [ "$rc" -eq 75 ]; then exit 0; fi
            [ "$rc" -eq 0 ] || exit "$rc"
          fi

          gh api --method POST "/repos/$PUBLIC_REPOSITORY/actions/workflows/omega-external-validator-dispatch.yml/dispatches" \
            -f ref="$dispatch_ref" >/dev/null
          echo "OMEGA_EXTERNAL_ARM_DISPATCHED sha=$sha mode=public-workflow-dispatch ref=$dispatch_ref"
