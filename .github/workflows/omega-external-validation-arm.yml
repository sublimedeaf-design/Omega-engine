name: OMEGA External Validation Arm

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
  push:
    paths:
      - ".github/workflows/omega-external-validation-arm.yml"

permissions:
  contents: read
  issues: write

concurrency:
  group: omega-external-validation-arm
  cancel-in-progress: false

env:
  PRIVATE_REPOSITORY: sublimedeaf-design/Omega-engines
  HELPER_REPOSITORY: sublimedeaf-design/Omega-engine
  LEDGER_ISSUE: "2"
  LIGHT_REF: omega-external-validation
  ANDROID_REF: omega-external-validation-android
  STABILITY_GRACE_SECONDS: "900"
  DISPATCH_COOLDOWN_SECONDS: "3600"
  MAX_DISPATCHES_24H: "2"
  MAX_DISPATCHES_30D: "6"

jobs:
  arm:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reconcile exact-main external validation refs
        env:
          GH_TOKEN: ${{ secrets.OMEGA_BOOTSTRAP_TOKEN }}
          PUBLIC_GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x

          api() {
            gh api -H "Accept: application/vnd.github+json" "$@"
          }

          post_status() {
            local state="$1" description="$2" sha="$3"
            api --method POST "/repos/$PRIVATE_REPOSITORY/statuses/$sha" \
              -f state="$state" \
              -f context="omega/control-plane/ref-sync" \
              -f description="$description" \
              -f target_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" >/dev/null
          }

          main_json="$(api "/repos/$PRIVATE_REPOSITORY/commits/main")"
          main_sha="$(printf '%s' "$main_json" | jq -r '.sha')"
          main_time="$(printf '%s' "$main_json" | jq -r '.commit.committer.date')"
          [[ "$main_sha" =~ ^[0-9a-f]{40}$ ]]

          now="$(date -u +%s)"
          main_epoch="$(date -u -d "$main_time" +%s)"
          commit_age=$((now-main_epoch))
          if [ "$commit_age" -lt "$STABILITY_GRACE_SECONDS" ]; then
            echo "OMEGA_CONTROL wait=unstable_head age_seconds=$commit_age sha=$main_sha"
            exit 0
          fi

          statuses="$(api "/repos/$PRIVATE_REPOSITORY/commits/$main_sha/status")"
          gate="$(printf '%s' "$statuses" | python3 -c '
          import json,sys
          p=json.load(sys.stdin)
          latest={}
          for row in p.get("statuses",[]):
              c=str(row.get("context") or "")
              if c and c not in latest:
                  latest[c]=str(row.get("state") or "")
          core=[
              "omega/hosted-ci/python311",
              "omega/hosted-ci/python313",
              "omega/hosted-ci/python314",
              "omega/hosted-ci/storage",
              "omega/hosted-governance",
          ]
          core_green=all(latest.get(x)=="success" for x in core)
          android_green=latest.get("omega/hosted-android")=="success"
          print(("true" if core_green else "false")+":"+("true" if android_green else "false"))
          ')"
          core_green="$(printf '%s' "$gate" | cut -d: -f1)"
          android_green="$(printf '%s' "$gate" | cut -d: -f2)"

          if [ "$core_green" != true ]; then
            echo "OMEGA_CONTROL wait=hosted_core_not_green sha=$main_sha"
            exit 0
          fi

          light_old="$(api "/repos/$PRIVATE_REPOSITORY/git/ref/heads/$LIGHT_REF" --jq '.object.sha' 2>/dev/null || true)"
          android_old="$(api "/repos/$PRIVATE_REPOSITORY/git/ref/heads/$ANDROID_REF" --jq '.object.sha' 2>/dev/null || true)"
          need_light=false
          need_android=false
          [ "$light_old" = "$main_sha" ] || need_light=true

          if [ "$android_green" = true ]; then
            if [ -z "$android_old" ]; then
              need_android=true
            elif [ "$android_old" != "$main_sha" ]; then
              compare="$(api "/repos/$PRIVATE_REPOSITORY/compare/$android_old...$main_sha" 2>/dev/null || printf '{}')"
              if printf '%s' "$compare" | jq -e '
                [.files[]?.filename] |
                any(
                  startswith("android/") or
                  startswith(".github/workflows/android") or
                  startswith("tests/test_android") or
                  . == "android/signing-cert.sha256" or
                  . == "evidence/release-stage.json"
                )
              ' >/dev/null; then
                need_android=true
              fi
            fi
          fi

          if [ "$need_light" != true ] && [ "$need_android" != true ]; then
            echo "OMEGA_CONTROL refs_current=true sha=$main_sha"
            post_status success "external validation refs already current" "$main_sha"
            exit 0
          fi

          comments="$(GH_TOKEN="$PUBLIC_GITHUB_TOKEN" gh api "/repos/$HELPER_REPOSITORY/issues/$LEDGER_ISSUE/comments?per_page=100")"
          export OMEGA_NOW="$now"
          budget="$(printf '%s' "$comments" | python3 -c 'import datetime,json,re,sys,os; rows=json.load(sys.stdin); now=int(os.environ["OMEGA_NOW"]); cooldown=int(os.environ["DISPATCH_COOLDOWN_SECONDS"]); max24=int(os.environ["MAX_DISPATCHES_24H"]); max30=int(os.environ["MAX_DISPATCHES_30D"]); pat=re.compile(r"^OMEGA_EXTERNAL_DISPATCH at=([^ ]+) android=(true|false)$"); times=[]; exec("for row in rows:\\n m=pat.match(str(row.get(\\\"body\\\") or \\\"\\\").strip())\\n if not m: continue\\n try:\\n  at=datetime.datetime.fromisoformat(m.group(1).replace(\\\"Z\\\",\\\"+00:00\\\")); times.append(int(at.timestamp()))\\n except Exception: pass"); last=max(times) if times else 0; c24=sum(1 for t in times if t>=now-86400); c30=sum(1 for t in times if t>=now-30*86400); ok=(now-last>=cooldown and c24<max24 and c30<max30); print(("true" if ok else "false")+":"+str(last)+":"+str(c24)+":"+str(c30))')"
          budget_ok="$(printf '%s' "$budget" | cut -d: -f1)"
          last_dispatch="$(printf '%s' "$budget" | cut -d: -f2)"
          count24="$(printf '%s' "$budget" | cut -d: -f3)"
          count30="$(printf '%s' "$budget" | cut -d: -f4)"
          if [ "$budget_ok" != true ]; then
            echo "OMEGA_CONTROL wait=budget cooldown_last=$last_dispatch count24=$count24 count30=$count30"
            post_status pending "external validation budget/cooldown active" "$main_sha"
            exit 0
          fi

          reconcile_ref() {
            local ref="$1" current="$2"
            if [ "$current" = "$main_sha" ]; then return 0; fi
            if [ -z "$current" ]; then
              api --method POST "/repos/$PRIVATE_REPOSITORY/git/refs" -f ref="refs/heads/$ref" -f sha="$main_sha" >/dev/null
              echo "OMEGA_CONTROL ref_created=$ref sha=$main_sha"
            else
              api --method PATCH "/repos/$PRIVATE_REPOSITORY/git/refs/heads/$ref" -f sha="$main_sha" -F force=true >/dev/null
              echo "OMEGA_CONTROL ref_updated=$ref old=$current new=$main_sha"
            fi
          }

          if [ "$need_light" = true ]; then reconcile_ref "$LIGHT_REF" "$light_old"; fi
          if [ "$need_android" = true ]; then reconcile_ref "$ANDROID_REF" "$android_old"; fi

          at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          GH_TOKEN="$PUBLIC_GITHUB_TOKEN" gh api --method POST \
            "/repos/$HELPER_REPOSITORY/issues/$LEDGER_ISSUE/comments" \
            -f body="OMEGA_EXTERNAL_DISPATCH at=$at android=$need_android" >/dev/null
          post_status success "external validation refs reconciled within global budget" "$main_sha"
          echo "OMEGA_CONTROL dispatched=true android=$need_android sha=$main_sha"
