name: OMEGA Private Secret Capability Probe

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/omega-private-secret-capability-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Probe encrypted Actions-secret write authority on public control plane
        env:
          GH_TOKEN: ${{ secrets.OMEGA_BOOTSTRAP_TOKEN }}
          CONTROL_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test -n "${GH_TOKEN:-}" || { echo OMEGA_SECRET_AUTH_TOKEN_MISSING >&2; exit 78; }
          value="$(python3 -c 'import secrets; print(secrets.token_urlsafe(48))')"
          if ! printf '%s' "$value" | gh secret set OMEGA_SECRET_CAPABILITY_PROBE -R "$CONTROL_REPOSITORY" --body - >/dev/null 2>&1; then
            echo OMEGA_CONTROL_ACTIONS_SECRET_WRITE_BLOCKED >&2
            exit 78
          fi
          unset value
          if ! gh secret delete OMEGA_SECRET_CAPABILITY_PROBE -R "$CONTROL_REPOSITORY" >/dev/null 2>&1; then
            echo OMEGA_CONTROL_ACTIONS_SECRET_DELETE_BLOCKED >&2
            exit 79
          fi
          echo OMEGA_CONTROL_ACTIONS_SECRET_WRITE_PASS
