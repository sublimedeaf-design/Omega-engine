name: OMEGA Signer Continuity Arm

on:
  workflow_dispatch:
  schedule:
    - cron: "37 * * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/omega-signer-continuity-arm.yml"

permissions:
  contents: read

concurrency:
  group: omega-signer-continuity-arm
  cancel-in-progress: false

env:
  PRIVATE_REPOSITORY: sublimedeaf-design/Omega-engines
  SIGNER_WORKFLOW: android-signing-keepalive.yml
  MAX_AGE_MINUTES: "10080"

jobs:
  arm:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Detect scoped private release authority configuration
        id: release_app_config
        env:
          RELEASE_APP_CLIENT_ID: ${{ vars.OMEGA_RELEASE_APP_CLIENT_ID }}
          RELEASE_APP_PRIVATE_KEY: ${{ secrets.OMEGA_RELEASE_APP_PRIVATE_KEY }}
        shell: bash
        run: |
          set -Eeuo pipefail
          configured=false
          if [ -n "${RELEASE_APP_CLIENT_ID:-}" ] && [ -n "${RELEASE_APP_PRIVATE_KEY:-}" ]; then
            configured=true
          fi
          echo "configured=$configured" >> "$GITHUB_OUTPUT"
          echo "OMEGA_RELEASE_APP_CONFIG configured=$configured"

      - name: Mint scoped signer Actions authority
        id: release_app
        if: steps.release_app_config.outputs.configured == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.OMEGA_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.OMEGA_RELEASE_APP_PRIVATE_KEY }}
          owner: sublimedeaf-design
          repositories: Omega-engines
          permission-actions: write
          permission-contents: read
          permission-statuses: write

      - name: Select signer Actions authority
        env:
          APP_TOKEN: ${{ steps.release_app.outputs.token }}
          LEGACY_TOKEN: ${{ secrets.OMEGA_BOOTSTRAP_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ -n "${APP_TOKEN:-}" ]; then
            token="$APP_TOKEN"
            source=github-app
          else
            token="${LEGACY_TOKEN:-}"
            source=legacy-bootstrap
          fi
          [ -n "$token" ] || { echo "OMEGA_SIGNER_AUTHORITY_MISSING" >&2; exit 77; }
          echo "::add-mask::$token"
          echo "OMEGA_PRIVATE_SIGNER_TOKEN=$token" >> "$GITHUB_ENV"
          echo "OMEGA_SIGNER_AUTH_SOURCE=$source" >> "$GITHUB_ENV"
          echo "OMEGA_SIGNER_AUTHORITY_SELECTED source=$source"

      - name: Dispatch canonical private signer proof only when needed
        env:
          GH_TOKEN: ${{ env.OMEGA_PRIVATE_SIGNER_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x

          sha="$(gh api "/repos/$PRIVATE_REPOSITORY/commits/main" --jq '.sha')"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || {
            echo "OMEGA_SIGNER_ARM_MAIN_SHA_INVALID" >&2
            exit 64
          }

          statuses="$(gh api "/repos/$PRIVATE_REPOSITORY/commits/$sha/status?per_page=100")"
          if STATUS_PAYLOAD="$statuses" MAX_AGE_MINUTES="$MAX_AGE_MINUTES" python3 <<'PY'
          import datetime,json,os
          payload=json.loads(os.environ["STATUS_PAYLOAD"])
          now=datetime.datetime.now(datetime.timezone.utc)
          max_age=int(os.environ["MAX_AGE_MINUTES"])
          rows=[r for r in payload.get("statuses",[]) if r.get("context")=="omega/signer/continuity"]
          rows.sort(key=lambda r:str(r.get("updated_at") or r.get("created_at") or ""),reverse=True)
          if not rows or rows[0].get("state")!="success":
              raise SystemExit(1)
          raw=str(rows[0].get("updated_at") or rows[0].get("created_at") or "")
          try:
              at=datetime.datetime.fromisoformat(raw.replace("Z","+00:00"))
          except ValueError:
              raise SystemExit(1)
          age=(now-at).total_seconds()
          raise SystemExit(0 if -300 <= age <= max_age*60 else 1)
          PY
          then
            echo "OMEGA_SIGNER_ARM_CURRENT sha=$sha"
            exit 0
          fi

          actions_payload=""
          actions_err="$(mktemp)"
          if ! actions_payload="$(gh api "/repos/$PRIVATE_REPOSITORY/actions/workflows/$SIGNER_WORKFLOW/runs?branch=main&per_page=20" 2>"$actions_err")"; then
            echo "OMEGA_SIGNER_ARM_PERMISSION_BLOCKED sha=$sha required=private-actions-read-write" >&2
            sed -n '1,3p' "$actions_err" >&2 || true
            rm -f "$actions_err"
            gh api --method POST "/repos/$PRIVATE_REPOSITORY/statuses/$sha" \
              -f state=error \
              -f context="omega/signer/continuity" \
              -f description="BLOCKED: private Actions read/write permission unavailable" >/dev/null 2>&1 || true
            gh api --method POST "/repos/$PRIVATE_REPOSITORY/statuses/$sha" \
              -f state=error \
              -f context="omega/authority/private-actions" \
              -f description="BLOCKED: scoped private Actions authority unavailable" >/dev/null 2>&1 || true
            echo "OMEGA_SIGNER_AUTHORITY_BLOCKED_STATE sha=$sha phase=actions-read"
            exit 0
          fi
          rm -f "$actions_err"

          active="$(printf '%s' "$actions_payload" | jq '[.workflow_runs[] | select(.status=="queued" or .status=="in_progress" or .status=="pending")] | length')"
          if [ "$active" != 0 ]; then
            echo "OMEGA_SIGNER_ARM_ACTIVE sha=$sha active=$active"
            exit 0
          fi

          dispatch_err="$(mktemp)"
          if ! gh api --method POST             "/repos/$PRIVATE_REPOSITORY/actions/workflows/$SIGNER_WORKFLOW/dispatches"             -f ref=main >/dev/null 2>"$dispatch_err"; then
            echo "OMEGA_SIGNER_ARM_PERMISSION_BLOCKED sha=$sha required=private-actions-read-write" >&2
            sed -n '1,3p' "$dispatch_err" >&2 || true
            rm -f "$dispatch_err"
            gh api --method POST "/repos/$PRIVATE_REPOSITORY/statuses/$sha" \
              -f state=error \
              -f context="omega/signer/continuity" \
              -f description="BLOCKED: private Actions dispatch permission unavailable" >/dev/null 2>&1 || true
            gh api --method POST "/repos/$PRIVATE_REPOSITORY/statuses/$sha" \
              -f state=error \
              -f context="omega/authority/private-actions" \
              -f description="BLOCKED: scoped private Actions authority unavailable" >/dev/null 2>&1 || true
            echo "OMEGA_SIGNER_AUTHORITY_BLOCKED_STATE sha=$sha phase=actions-dispatch"
            exit 0
          fi
          rm -f "$dispatch_err"
          echo "OMEGA_SIGNER_ARM_DISPATCHED sha=$sha workflow=$SIGNER_WORKFLOW"
