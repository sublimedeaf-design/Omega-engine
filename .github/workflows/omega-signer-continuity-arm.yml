name: OMEGA Signer Continuity Arm

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - "OMEGA Recovery Evidence Release Stager"
      - "OMEGA Private PR Hosted Bridge"
      - "OMEGA Release Federation Certifier"
    types: [completed]
  # Periodic repair is owned by omega-generation-reconciler.yml.
  push:
    branches: [main]
    paths:
      - ".github/workflows/omega-signer-continuity-arm.yml"
      - ".github/workflows/omega-canonical-android-signer.yml"
      - "bootstrap/omega/signer-trigger.txt"

permissions:
  contents: read
  actions: write

concurrency:
  group: omega-signer-continuity-arm
  cancel-in-progress: true

env:
  PRIVATE_REPOSITORY: sublimedeaf-design/Omega-engines
  SIGNER_WORKFLOW: omega-canonical-android-signer.yml
  MAX_AGE_MINUTES: "10080"

jobs:
  arm:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Verify canonical hosted signer and exact upstream handoff
        id: gate
        env:
          GH_TOKEN: ${{ secrets.OMEGA_BOOTSTRAP_TOKEN }}
          OMEGA_ANDROID_KEYSTORE_B64: ${{ secrets.OMEGA_ANDROID_KEYSTORE_B64 }}
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          sha="$(gh api "/repos/$PRIVATE_REPOSITORY/commits/main" --jq '.sha')"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo OMEGA_SIGNER_ARM_MAIN_SHA_INVALID >&2; exit 64; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

          publish() {
            local state="$1" context="$2" description="$3"
            gh api --method POST "/repos/$PRIVATE_REPOSITORY/statuses/$sha"               -f state="$state" -f context="$context" -f description="$description"               -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null
          }

          statuses="$(gh api "/repos/$PRIVATE_REPOSITORY/commits/$sha/status?per_page=100")"
          if STATUS_PAYLOAD="$statuses" MAX_AGE_MINUTES="$MAX_AGE_MINUTES" python3 <<'PY'
          import datetime,json,os
          p=json.loads(os.environ["STATUS_PAYLOAD"])
          latest={}
          for row in p.get("statuses",[]):
              ctx=str(row.get("context") or "")
              stamp=str(row.get("updated_at") or row.get("created_at") or "")
              if ctx and (ctx not in latest or stamp > str(latest[ctx].get("_stamp") or "")):
                  latest[ctx]={**row,"_stamp":stamp}
          continuity=latest.get("omega/signer/continuity") or {}
          signed=latest.get("omega/android-release-signed") or {}
          if continuity.get("state")!="success" or signed.get("state")!="success":
              raise SystemExit(1)
          if str(continuity.get("target_url") or "") != str(signed.get("target_url") or ""):
              raise SystemExit(1)
          raw=str(signed.get("updated_at") or signed.get("created_at") or "")
          try: at=datetime.datetime.fromisoformat(raw.replace("Z","+00:00"))
          except ValueError: raise SystemExit(1)
          age=(datetime.datetime.now(datetime.timezone.utc)-at).total_seconds()
          raise SystemExit(0 if -300 <= age <= int(os.environ["MAX_AGE_MINUTES"])*60 else 1)
          PY
          then
            echo "dispatch=false" >> "$GITHUB_OUTPUT"
            echo "OMEGA_SIGNER_ARM_CURRENT sha=$sha"
            exit 0
          fi

          expected="$(gh api "/repos/$PRIVATE_REPOSITORY/contents/android/signing-cert.sha256?ref=$sha" --jq '.content'             | tr -d '\n' | base64 -d | tr -d '[:space:]' | tr -d ':' | tr 'A-F' 'a-f')"
          [[ "$expected" =~ ^[0-9a-f]{64}$ ]] || { echo OMEGA_SIGNER_EXPECTED_FINGERPRINT_INVALID >&2; exit 31; }

          # Hosted escrow is the preferred backend, but it is not the only signer
          # backend. The canonical signer can also consume an exact cache-rescue
          # handoff or a fingerprint-locked private signer runtime. Missing hosted
          # escrow therefore reduces redundancy; it must not suppress an otherwise
          # valid exact-SHA signing attempt.
          if [ -n "${OMEGA_ANDROID_KEYSTORE_B64:-}" ]; then
            key="$(mktemp)"
            trap 'rm -f "$key"' EXIT
            umask 077
            if ! printf '%s' "$OMEGA_ANDROID_KEYSTORE_B64" | base64 -d > "$key" 2>/dev/null; then
              publish pending "omega/signer/key-availability" "hosted escrow unreadable; canonical cache/runtime fallback required"
              publish pending "omega/signer/escrow" "hosted escrow decode failed; fingerprint-bound fallback remains eligible"
              echo "OMEGA_SIGNER_ARM_HOSTED_ESCROW_DECODE_INVALID_FALLBACK sha=$sha"
            else
              actual="$(keytool -list -v -keystore "$key" -storepass android -alias androiddebugkey 2>/dev/null | sed -n 's/.*SHA256: //p' | head -1 | tr -d ':' | tr 'A-F' 'a-f' || true)"
              if [ "$actual" = "$expected" ]; then
                publish success "omega/signer/key-availability" "hosted canonical signer escrow available and fingerprint verified"
                publish success "omega/signer/escrow" "hosted canonical signer escrow fingerprint verified"
                echo "OMEGA_SIGNER_ARM_HOSTED_ESCROW_READY sha=$sha"
              else
                publish pending "omega/signer/key-availability" "hosted escrow fingerprint invalid; canonical cache/runtime fallback required"
                publish pending "omega/signer/escrow" "hosted escrow rejected; fingerprint-bound fallback remains eligible"
                echo "OMEGA_SIGNER_ARM_HOSTED_ESCROW_FINGERPRINT_INVALID_FALLBACK sha=$sha"
              fi
            fi
          else
            publish pending "omega/signer/key-availability" "hosted escrow unavailable; canonical alternate signer backends remain eligible"
            publish pending "omega/signer/escrow" "hosted escrow unavailable; exact signer workflow will select a fingerprint-bound fallback"
            echo "OMEGA_SIGNER_ARM_HOSTED_ESCROW_OPTIONAL sha=$sha"
          fi

          ready="$(STATUS_PAYLOAD="$statuses" python3 - <<'PY'
          import json,os
          p=json.loads(os.environ["STATUS_PAYLOAD"]); latest={}
          for row in p.get("statuses",[]):
              ctx=str(row.get("context") or "")
              stamp=str(row.get("updated_at") or row.get("created_at") or "")
              if ctx and (ctx not in latest or stamp > str(latest[ctx].get("_stamp") or "")):
                  latest[ctx]={**row,"_stamp":stamp}
          required=(
              "omega/exact-final-validation",
              "omega/federation-v3-release",
              "omega/hosted-recovery",
              "omega/recovery-attestation",
              "omega/candidate-evidence-root",
              "omega/release-evidence-staged",
              "omega/android-release-unsigned",
          )
          print("true" if all((latest.get(x) or {}).get("state")=="success" for x in required) else "false")
          PY
          )"
          echo "dispatch=$ready" >> "$GITHUB_OUTPUT"
          if [ "$ready" = true ]; then
            echo "OMEGA_SIGNER_ARM_UPSTREAM_READY sha=$sha"
          else
            echo "OMEGA_SIGNER_ARM_WAIT_UPSTREAM sha=$sha"
          fi

      - name: Dispatch public canonical signer exactly once
        if: steps.gate.outputs.dispatch == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          active="$(
            {
              gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/$SIGNER_WORKFLOW/runs?status=queued&per_page=20" --jq '.total_count'
              gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/$SIGNER_WORKFLOW/runs?status=in_progress&per_page=20" --jq '.total_count'
            } | awk '{s+=$1} END{print s+0}'
          )"
          if [ "$active" -gt 0 ]; then
            echo "OMEGA_SIGNER_ARM_PUBLIC_SIGNER_ALREADY_ACTIVE count=$active"
            exit 0
          fi
          gh workflow run "$SIGNER_WORKFLOW" -R "$GITHUB_REPOSITORY" --ref main
          echo "OMEGA_SIGNER_ARM_PUBLIC_SIGNER_DISPATCHED sha=${{ steps.gate.outputs.sha }}"
