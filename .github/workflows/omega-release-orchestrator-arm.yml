# immutable control generation: 3
name: OMEGA Release Orchestrator Arm

on:
  workflow_dispatch:
  schedule:
    - cron: "3,18,33,48 * * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/omega-release-orchestrator-arm.yml"
      - ".github/workflows/omega-release-federation-rollover.yml"
      - ".github/workflows/omega-federation-v3-peer-bridge.yml"
      - ".github/workflows/omega-release-federation-certifier.yml"
      - ".github/workflows/omega-recovery-evidence-release-stager.yml"
      - ".github/workflows/omega-canonical-android-signer.yml"
      - ".github/workflows/omega-final-release-promoter.yml"
      - ".github/workflows/omega-post-live-verification.yml"
      - "scripts/rollover_release_federation.py"
      - "scripts/verify_federation_epoch.py"

permissions:
  contents: read
  actions: write

concurrency:
  group: omega-release-orchestrator-arm
  cancel-in-progress: false

env:
  PRIVATE_REPOSITORY: sublimedeaf-design/Omega-engines
  ROLLOVER_WORKFLOW: omega-release-federation-rollover.yml

jobs:
  arm:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Reconcile current private main into one immutable release generation
        id: decide
        env:
          GH_TOKEN: ${{ secrets.OMEGA_BOOTSTRAP_TOKEN }}
          CONTROL_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          candidate="$(gh api "/repos/$PRIVATE_REPOSITORY/commits/main" --jq .sha)"
          [[ "$candidate" =~ ^[0-9a-f]{40}$ ]] || { echo OMEGA_RELEASE_CONTROLLER_MAIN_INVALID >&2; exit 64; }
          source_ref="release/auto-${candidate:0:12}"
          statuses="$(gh api "/repos/$PRIVATE_REPOSITORY/commits/$candidate/status?per_page=100")"
          exact_final="$(STATUS_PAYLOAD="$statuses" python3 - <<'PY'
          import json,os
          rows=json.loads(os.environ["STATUS_PAYLOAD"]).get("statuses",[])
          latest={}
          for row in rows:
              ctx=str(row.get("context") or "")
              stamp=str(row.get("updated_at") or row.get("created_at") or "")
              if ctx and (ctx not in latest or stamp>latest[ctx][0]):
                  latest[ctx]=(stamp,str(row.get("state") or ""))
          print(latest.get("omega/exact-final-validation",("", ""))[1])
          PY
          )"
          if [ "$exact_final" != success ]; then
            echo "dispatch=false" >> "$GITHUB_OUTPUT"
            echo "source_sha=$candidate" >> "$GITHUB_OUTPUT"
            echo "source_ref=$source_ref" >> "$GITHUB_OUTPUT"
            gh api --method POST "/repos/$PRIVATE_REPOSITORY/statuses/$candidate" \
              -f state=pending -f context="omega/control-plane/release-controller" \
              -f description="controller waiting for exact-final gen=${candidate:0:12}" \
              -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null
            echo "OMEGA_RELEASE_CONTROLLER_WAIT_EXACT_FINAL source=$candidate"
            exit 0
          fi

          existing=""
          if ref_json="$(gh api "/repos/$PRIVATE_REPOSITORY/git/ref/heads/$source_ref" 2>/dev/null)"; then
            existing="$(printf '%s' "$ref_json" | jq -r '.object.sha // empty')"
            [[ "$existing" =~ ^[0-9a-f]{40}$ ]] || { echo "OMEGA_RELEASE_CONTROLLER_REF_RESPONSE_INVALID:$source_ref" >&2; exit 68; }
          fi
          if [ -z "$existing" ]; then
            gh api --method POST "/repos/$PRIVATE_REPOSITORY/git/refs" \
              -f ref="refs/heads/$source_ref" -f sha="$candidate" >/dev/null
            existing="$candidate"
            echo "OMEGA_RELEASE_CONTROLLER_REF_CREATED ref=$source_ref source=$candidate"
          fi
          [ "$existing" = "$candidate" ] || { echo "OMEGA_RELEASE_CONTROLLER_REF_COLLISION:$source_ref:$existing!=$candidate" >&2; exit 68; }

          control_main="$(GH_TOKEN="$CONTROL_TOKEN" gh api "/repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          epoch="$(GH_TOKEN="$CONTROL_TOKEN" gh api "/repos/$GITHUB_REPOSITORY/contents/federation/epochs/current.json?ref=main" --jq '.content' | python3 -c 'import base64,sys; print(base64.b64decode("".join(sys.stdin.read().split()),validate=True).decode(),end="")')"
          contract="$(EPOCH="$epoch" python3 -c 'import json,os; print(str((json.loads(os.environ["EPOCH"]).get("release_epoch") or {}).get("control_contract_sha") or ""))')"
          compare='{"status":"identical","files":[]}'
          if [[ "$contract" =~ ^[0-9a-f]{40}$ ]] && [ "$contract" != "$control_main" ]; then
            compare="$(GH_TOKEN="$CONTROL_TOKEN" gh api "/repos/$GITHUB_REPOSITORY/compare/$contract...$control_main?per_page=100")"
          fi

          decision="$(EPOCH="$epoch" COMPARE_PAYLOAD="$compare" STATUS_PAYLOAD="$statuses" CANDIDATE="$candidate" SOURCE_REF="$source_ref" CONTROL_MAIN="$control_main" python3 <<'PY'
          import json,os,re
          d=json.loads(os.environ["EPOCH"])
          compare=json.loads(os.environ["COMPARE_PAYLOAD"])
          status=json.loads(os.environ["STATUS_PAYLOAD"])
          latest={}
          for row in status.get("statuses",[]):
              ctx=str(row.get("context") or "")
              stamp=str(row.get("updated_at") or row.get("created_at") or "")
              if ctx and (ctx not in latest or stamp > str(latest[ctx].get("_omega_stamp") or "")):
                  latest[ctx]={**row,"_omega_stamp":stamp}
          p=d.get("primary") or {}
          rel=d.get("release_epoch") or {}
          candidate=os.environ["CANDIDATE"]
          source_ref=os.environ["SOURCE_REF"]
          control=os.environ["CONTROL_MAIN"]
          epoch_source=str(p.get("source_sha") or "")
          epoch_ref=str(p.get("source_ref") or "")
          contract=str(rel.get("control_contract_sha") or "")
          state=str(d.get("state") or "")
          certification=str(p.get("certification_state") or "")
          if not re.fullmatch(r"[0-9a-f]{40}",control):
              raise SystemExit("OMEGA_RELEASE_CONTROLLER_CONTROL_SHA_INVALID")
          live=(latest.get("omega/live-certified") or {}).get("state")=="success"
          compare_status=str(compare.get("status") or "")
          changed=[str(x.get("filename") or "") for x in compare.get("files",[]) if x.get("filename")]
          state_only=lambda path: path.startswith("federation/epochs/") or path=="bootstrap/omega/pr-validation-trigger.txt"
          code_drift=any(not state_only(path) for path in changed)
          if len(changed)>=300:
              print("BLOCKED:control-diff-too-large")
          elif contract and contract!=control and compare_status not in ("ahead","identical"):
              print("BLOCKED:control-history-"+compare_status.lower())
          elif epoch_source!=candidate or epoch_ref!=source_ref:
              print("DISPATCH:new-private-generation")
          elif contract==control:
              print("NOOP:control-contract-current")
          elif not code_drift:
              print("NOOP:state-only-control-head-advance")
          elif live:
              print("NOOP:live-certified-generation-immutable")
          elif (state=="PASS" and certification=="PASS") or (state=="NOT_EXECUTED" and certification=="NOT_EXECUTED"):
              print("DISPATCH:pre-live-control-deviation")
          else:
              print("BLOCKED:epoch-state-"+state.lower())
          PY
          )"
          echo "source_sha=$candidate" >> "$GITHUB_OUTPUT"
          echo "source_ref=$source_ref" >> "$GITHUB_OUTPUT"
          case "$decision" in
            DISPATCH:*)
              echo "dispatch=true" >> "$GITHUB_OUTPUT"
              echo "reason=${decision#DISPATCH:}" >> "$GITHUB_OUTPUT"
              gh api --method POST "/repos/$PRIVATE_REPOSITORY/statuses/$candidate" \
                -f state=pending -f context="omega/control-plane/release-controller" \
                -f description="reconciling gen=${candidate:0:12} ref=${source_ref#release/}" \
                -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null
              ;;
            NOOP:*)
              echo "dispatch=false" >> "$GITHUB_OUTPUT"
              gh api --method POST "/repos/$PRIVATE_REPOSITORY/statuses/$candidate" \
                -f state=success -f context="omega/control-plane/release-controller" \
                -f description="generation reconciled gen=${candidate:0:12}" \
                -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null
              echo "OMEGA_RELEASE_CONTROLLER_NOOP reason=${decision#NOOP:}"
              ;;
            BLOCKED:*)
              echo "dispatch=false" >> "$GITHUB_OUTPUT"
              gh api --method POST "/repos/$PRIVATE_REPOSITORY/statuses/$candidate" \
                -f state=error -f context="omega/control-plane/release-controller" \
                -f description="halted ${decision#BLOCKED:} gen=${candidate:0:12}" \
                -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null
              echo "OMEGA_RELEASE_CONTROLLER_BLOCKED reason=${decision#BLOCKED:}"
              ;;
            *)
              echo "OMEGA_RELEASE_CONTROLLER_DECISION_INVALID:$decision" >&2
              exit 65
              ;;
          esac

      - name: Dispatch one rollover when no equivalent run is active
        if: steps.decide.outputs.dispatch == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REASON: ${{ steps.decide.outputs.reason }}
          SOURCE_SHA: ${{ steps.decide.outputs.source_sha }}
          SOURCE_REF: ${{ steps.decide.outputs.source_ref }}
        shell: bash
        run: |
          set -Eeuo pipefail
          active="$(
            {
              gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/$ROLLOVER_WORKFLOW/runs?status=queued&per_page=20" --jq '.total_count'
              gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/$ROLLOVER_WORKFLOW/runs?status=in_progress&per_page=20" --jq '.total_count'
            } | awk '{s+=$1} END{print s+0}'
          )"
          if [ "$active" -gt 0 ]; then
            echo "OMEGA_RELEASE_ORCHESTRATOR_ROLLOVER_ALREADY_ACTIVE count=$active reason=$REASON"
            exit 0
          fi
          gh workflow run "$ROLLOVER_WORKFLOW" -R "$GITHUB_REPOSITORY" --ref main -f source_sha="$SOURCE_SHA" -f source_ref="$SOURCE_REF"
          echo "OMEGA_RELEASE_ORCHESTRATOR_ROLLOVER_DISPATCHED reason=$REASON source=$SOURCE_SHA ref=$SOURCE_REF"
