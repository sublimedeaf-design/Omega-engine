# immutable control generation: 3
name: OMEGA Release Orchestrator Arm

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - "OMEGA Private PR Hosted Bridge"
    types: [completed]
  schedule:
    - cron: "3,18,33,48 * * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/omega-release-orchestrator-arm.yml"
      - ".github/workflows/omega-release-federation-rollover.yml"
      - ".github/workflows/omega-federation-v3-peer-bridge.yml"
      - ".github/workflows/omega-release-federation-certifier.yml"
      - ".github/workflows/omega-recovery-evidence-release-stager.yml"
      - ".github/workflows/omega-canonical-android-signer.yml"
      - ".github/workflows/omega-final-release-promoter.yml"
      - ".github/workflows/omega-post-live-verification.yml"
      - "scripts/rollover_release_federation.py"
      - "scripts/verify_federation_epoch.py"

permissions:
  contents: read
  actions: write

concurrency:
  group: omega-release-orchestrator-arm
  cancel-in-progress: false

env:
  PRIVATE_REPOSITORY: sublimedeaf-design/Omega-engines
  ROLLOVER_WORKFLOW: omega-release-federation-rollover.yml

jobs:
  arm:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Detect scoped private release authority configuration
        id: release_app_config
        env:
          RELEASE_APP_CLIENT_ID: ${{ vars.OMEGA_RELEASE_APP_CLIENT_ID }}
          RELEASE_APP_PRIVATE_KEY: ${{ secrets.OMEGA_RELEASE_APP_PRIVATE_KEY }}
        shell: bash
        run: |
          set -Eeuo pipefail
          configured=false
          if [ -n "${RELEASE_APP_CLIENT_ID:-}" ] && [ -n "${RELEASE_APP_PRIVATE_KEY:-}" ]; then
            configured=true
          fi
          echo "configured=$configured" >> "$GITHUB_OUTPUT"
          echo "OMEGA_RELEASE_APP_CONFIG configured=$configured"

      - name: Mint scoped private release authority
        id: release_app
        if: steps.release_app_config.outputs.configured == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.OMEGA_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.OMEGA_RELEASE_APP_PRIVATE_KEY }}
          owner: sublimedeaf-design
          repositories: Omega-engines
          permission-contents: write
          permission-statuses: write

      - name: Select private release authority
        env:
          APP_TOKEN: ${{ steps.release_app.outputs.token }}
          LEGACY_TOKEN: ${{ secrets.OMEGA_BOOTSTRAP_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ -n "${APP_TOKEN:-}" ]; then
            token="$APP_TOKEN"
            source=github-app
          else
            token="${LEGACY_TOKEN:-}"
            source=legacy-bootstrap
          fi
          [ -n "$token" ] || { echo "OMEGA_RELEASE_AUTHORITY_MISSING" >&2; exit 77; }
          echo "::add-mask::$token"
          echo "OMEGA_PRIVATE_RELEASE_TOKEN=$token" >> "$GITHUB_ENV"
          echo "OMEGA_RELEASE_AUTH_SOURCE=$source" >> "$GITHUB_ENV"
          echo "OMEGA_RELEASE_AUTHORITY_SELECTED source=$source"

      - name: Reconcile current private main into one immutable release generation
        id: decide
        env:
          GH_TOKEN: ${{ env.OMEGA_PRIVATE_RELEASE_TOKEN }}
          CONTROL_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          candidate="$(gh api "/repos/$PRIVATE_REPOSITORY/commits/main" --jq .sha)"
          [[ "$candidate" =~ ^[0-9a-f]{40}$ ]] || { echo OMEGA_RELEASE_CONTROLLER_MAIN_INVALID >&2; exit 64; }
          source_ref="release/auto-${candidate:0:12}"
          status_file="$RUNNER_TEMP/omega-release-statuses.json"
          gh api "/repos/$PRIVATE_REPOSITORY/commits/$candidate/status?per_page=100" > "$status_file"
          exact_final="$(python3 - "$status_file" <<'PY'
          import json,sys
          rows=json.load(open(sys.argv[1],encoding="utf-8")).get("statuses",[])
          latest={}
          for row in rows:
              ctx=str(row.get("context") or "")
              stamp=str(row.get("updated_at") or row.get("created_at") or "")
              if ctx and (ctx not in latest or stamp>latest[ctx][0]):
                  latest[ctx]=(stamp,str(row.get("state") or ""))
          print(latest.get("omega/exact-final-validation",("", ""))[1])
          PY
          )"
          if [ "$exact_final" != success ]; then
            echo "dispatch=false" >> "$GITHUB_OUTPUT"
            echo "source_sha=$candidate" >> "$GITHUB_OUTPUT"
            echo "source_ref=$source_ref" >> "$GITHUB_OUTPUT"

            # Controller-style reconciliation: exact-final is desired state for the
            # current private main. Do not depend on a mutable trigger file or a
            # human wake-up; dispatch the immutable SHA/ref contract directly.
            active="$(
              {
                GH_TOKEN="$CONTROL_TOKEN" gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/omega-private-pr-hosted-bridge.yml/runs?status=queued&per_page=20" --jq '.total_count'
                GH_TOKEN="$CONTROL_TOKEN" gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/omega-private-pr-hosted-bridge.yml/runs?status=in_progress&per_page=20" --jq '.total_count'
              } | awk '{s+=$1} END{print s+0}'
            )"
            if [ "$active" -eq 0 ]; then
              GH_TOKEN="$CONTROL_TOKEN" gh workflow run omega-private-pr-hosted-bridge.yml \
                -R "$GITHUB_REPOSITORY" --ref main \
                -f source_sha="$candidate" -f source_ref=main
              desc="exact-final reconciliation dispatched gen=${candidate:0:12}"
              echo "OMEGA_RELEASE_CONTROLLER_EXACT_FINAL_DISPATCHED source=$candidate ref=main"
            else
              desc="controller waiting for active exact-final reconciliation gen=${candidate:0:12}"
              echo "OMEGA_RELEASE_CONTROLLER_EXACT_FINAL_ALREADY_ACTIVE count=$active source=$candidate"
            fi
            gh api --method POST "/repos/$PRIVATE_REPOSITORY/statuses/$candidate" \
              -f state=pending -f context="omega/control-plane/release-controller" \
              -f description="$desc" \
              -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null
            exit 0
          fi

          existing=""
          if ref_json="$(gh api "/repos/$PRIVATE_REPOSITORY/git/ref/heads/$source_ref" 2>/dev/null)"; then
            existing="$(printf '%s' "$ref_json" | jq -r '.object.sha // empty')"
            [[ "$existing" =~ ^[0-9a-f]{40}$ ]] || { echo "OMEGA_RELEASE_CONTROLLER_REF_RESPONSE_INVALID:$source_ref" >&2; exit 68; }
          fi
          if [ -z "$existing" ]; then
            # Least privilege: only a scoped GitHub App may mutate the private
            # repository cross-repo. Legacy bootstrap credentials are read/dispatch
            # authority only and always delegate the write to the repo-local actuator.
            direct_created=false
            if [ "${OMEGA_RELEASE_AUTH_SOURCE:-}" = github-app ]; then
              if gh api --method POST "/repos/$PRIVATE_REPOSITORY/git/refs" \
                -f ref="refs/heads/$source_ref" -f sha="$candidate" >/dev/null 2>&1; then
                direct_created=true
                existing="$candidate"
                echo "OMEGA_RELEASE_CONTROLLER_REF_CREATED ref=$source_ref source=$candidate authority=github-app"
              fi
            fi
            if [ "$direct_created" != true ]; then
              # The private repo-local actuator is status-driven by the trusted
              # exact-final proof. The helper only observes the immutable result;
              # it needs neither private Actions-write nor private contents-write.
              echo "OMEGA_RELEASE_CONTROLLER_PRIVATE_ACTUATOR_WAIT source=$candidate ref=$source_ref"
              for _ in $(seq 1 18); do
                sleep 5
                ref_json="$(gh api "/repos/$PRIVATE_REPOSITORY/git/ref/heads/$source_ref" 2>/dev/null || true)"
                existing="$(printf '%s' "$ref_json" | jq -r '.object.sha // empty' 2>/dev/null || true)"
                if [ "$existing" = "$candidate" ]; then
                  echo "OMEGA_RELEASE_CONTROLLER_PRIVATE_ACTUATOR_SATISFIED source=$candidate ref=$source_ref"
                  break
                fi
                if [[ "$existing" =~ ^[0-9a-f]{40}$ ]] && [ "$existing" != "$candidate" ]; then
                  echo "OMEGA_RELEASE_CONTROLLER_REF_COLLISION:$source_ref:$existing!=$candidate" >&2
                  exit 68
                fi
              done
              if [ "$existing" != "$candidate" ]; then
                echo "dispatch=false" >> "$GITHUB_OUTPUT"
                echo "source_sha=$candidate" >> "$GITHUB_OUTPUT"
                echo "source_ref=$source_ref" >> "$GITHUB_OUTPUT"
                gh api --method POST "/repos/$PRIVATE_REPOSITORY/statuses/$candidate" \
                  -f state=pending -f context="omega/authority/private-actions" \
                  -f description="repo-local immutable release-ref actuator pending" \
                  -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null
                gh api --method POST "/repos/$PRIVATE_REPOSITORY/statuses/$candidate" \
                  -f state=pending -f context="omega/control-plane/release-controller" \
                  -f description="waiting for repo-local release authority gen=${candidate:0:12}" \
                  -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null
                echo "OMEGA_RELEASE_CONTROLLER_AUTHORITY_WAIT source=$candidate ref=$source_ref authority=repo-local-actuator"
                exit 0
              fi
            fi
          fi
          [ "$existing" = "$candidate" ] || { echo "OMEGA_RELEASE_CONTROLLER_REF_COLLISION:$source_ref:$existing!=$candidate" >&2; exit 68; }
          gh api --method POST "/repos/$PRIVATE_REPOSITORY/statuses/$candidate" \
            -f state=success -f context="omega/authority/private-actions" \
            -f description="not required: immutable release ref already exists for current generation" \
            -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null
          echo "OMEGA_RELEASE_CONTROLLER_REF_AUTHORITY_SATISFIED ref=$source_ref source=$candidate"

          control_main="$(GH_TOKEN="$CONTROL_TOKEN" gh api "/repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          epoch_file="$RUNNER_TEMP/omega-release-epoch.json"
          compare_file="$RUNNER_TEMP/omega-release-compare.json"
          GH_TOKEN="$CONTROL_TOKEN" gh api "/repos/$GITHUB_REPOSITORY/contents/federation/epochs/current.json?ref=main" --jq '.content' \
            | python3 -c 'import base64,sys; sys.stdout.write(base64.b64decode("".join(sys.stdin.read().split()),validate=True).decode())' \
            > "$epoch_file"
          contract="$(python3 - "$epoch_file" <<'PY'
          import json,sys
          print(str((json.load(open(sys.argv[1],encoding="utf-8")).get("release_epoch") or {}).get("control_contract_sha") or ""))
          PY
          )"
          printf '%s\n' '{"status":"identical","files":[]}' > "$compare_file"
          if [[ "$contract" =~ ^[0-9a-f]{40}$ ]] && [ "$contract" != "$control_main" ]; then
            GH_TOKEN="$CONTROL_TOKEN" gh api "/repos/$GITHUB_REPOSITORY/compare/$contract...$control_main?per_page=100" > "$compare_file"
          fi

          decision="$(CANDIDATE="$candidate" SOURCE_REF="$source_ref" CONTROL_MAIN="$control_main" python3 - "$epoch_file" "$compare_file" "$status_file" <<'PY'
          import json,os,re,sys
          d=json.load(open(sys.argv[1],encoding="utf-8"))
          compare=json.load(open(sys.argv[2],encoding="utf-8"))
          status=json.load(open(sys.argv[3],encoding="utf-8"))
          latest={}
          for row in status.get("statuses",[]):
              ctx=str(row.get("context") or "")
              stamp=str(row.get("updated_at") or row.get("created_at") or "")
              if ctx and (ctx not in latest or stamp > str(latest[ctx].get("_omega_stamp") or "")):
                  latest[ctx]={**row,"_omega_stamp":stamp}
          p=d.get("primary") or {}
          rel=d.get("release_epoch") or {}
          candidate=os.environ["CANDIDATE"]
          source_ref=os.environ["SOURCE_REF"]
          control=os.environ["CONTROL_MAIN"]
          epoch_source=str(p.get("source_sha") or "")
          epoch_ref=str(p.get("source_ref") or "")
          contract=str(rel.get("control_contract_sha") or "")
          state=str(d.get("state") or "")
          certification=str(p.get("certification_state") or "")
          if not re.fullmatch(r"[0-9a-f]{40}",control):
              raise SystemExit("OMEGA_RELEASE_CONTROLLER_CONTROL_SHA_INVALID")
          live=(
              (latest.get("omega/live-certified") or {}).get("state")=="success"
              or (latest.get("omega/limited-distribution/live-certified") or {}).get("state")=="success"
          )
          compare_status=str(compare.get("status") or "")
          changed=[str(x.get("filename") or "") for x in compare.get("files",[]) if x.get("filename")]
          state_only=lambda path: path.startswith("federation/epochs/") or path=="bootstrap/omega/pr-validation-trigger.txt"
          code_drift=any(not state_only(path) for path in changed)
          if len(changed)>=300:
              print("BLOCKED:control-diff-too-large")
          elif contract and contract!=control and compare_status not in ("ahead","identical"):
              print("BLOCKED:control-history-"+compare_status.lower())
          elif epoch_source!=candidate or epoch_ref!=source_ref:
              print("DISPATCH:new-private-generation")
          elif contract==control:
              print("NOOP:control-contract-current")
          elif not code_drift:
              print("NOOP:state-only-control-head-advance")
          elif live:
              print("NOOP:live-certified-generation-immutable")
          elif (state=="PASS" and certification=="PASS") or (state=="NOT_EXECUTED" and certification=="NOT_EXECUTED"):
              print("DISPATCH:pre-live-control-deviation")
          else:
              print("BLOCKED:epoch-state-"+state.lower())
          PY
          )"
          echo "source_sha=$candidate" >> "$GITHUB_OUTPUT"
          echo "source_ref=$source_ref" >> "$GITHUB_OUTPUT"
          case "$decision" in
            DISPATCH:*)
              echo "dispatch=true" >> "$GITHUB_OUTPUT"
              echo "reason=${decision#DISPATCH:}" >> "$GITHUB_OUTPUT"
              gh api --method POST "/repos/$PRIVATE_REPOSITORY/statuses/$candidate" \
                -f state=pending -f context="omega/control-plane/release-controller" \
                -f description="reconciling gen=${candidate:0:12} ref=${source_ref#release/}" \
                -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null
              ;;
            NOOP:*)
              echo "dispatch=false" >> "$GITHUB_OUTPUT"
              gh api --method POST "/repos/$PRIVATE_REPOSITORY/statuses/$candidate" \
                -f state=success -f context="omega/control-plane/release-controller" \
                -f description="generation reconciled gen=${candidate:0:12}" \
                -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null
              echo "OMEGA_RELEASE_CONTROLLER_NOOP reason=${decision#NOOP:}"
              ;;
            BLOCKED:*)
              echo "dispatch=false" >> "$GITHUB_OUTPUT"
              gh api --method POST "/repos/$PRIVATE_REPOSITORY/statuses/$candidate" \
                -f state=error -f context="omega/control-plane/release-controller" \
                -f description="halted ${decision#BLOCKED:} gen=${candidate:0:12}" \
                -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null
              echo "OMEGA_RELEASE_CONTROLLER_BLOCKED reason=${decision#BLOCKED:}"
              ;;
            *)
              echo "OMEGA_RELEASE_CONTROLLER_DECISION_INVALID:$decision" >&2
              exit 65
              ;;
          esac

      - name: Dispatch one rollover when no equivalent run is active
        if: steps.decide.outputs.dispatch == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REASON: ${{ steps.decide.outputs.reason }}
          SOURCE_SHA: ${{ steps.decide.outputs.source_sha }}
          SOURCE_REF: ${{ steps.decide.outputs.source_ref }}
        shell: bash
        run: |
          set -Eeuo pipefail
          active="$(
            {
              gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/$ROLLOVER_WORKFLOW/runs?status=queued&per_page=20" --jq '.total_count'
              gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/$ROLLOVER_WORKFLOW/runs?status=in_progress&per_page=20" --jq '.total_count'
            } | awk '{s+=$1} END{print s+0}'
          )"
          if [ "$active" -gt 0 ]; then
            echo "OMEGA_RELEASE_ORCHESTRATOR_ROLLOVER_ALREADY_ACTIVE count=$active reason=$REASON"
            exit 0
          fi
          gh workflow run "$ROLLOVER_WORKFLOW" -R "$GITHUB_REPOSITORY" --ref main -f source_sha="$SOURCE_SHA" -f source_ref="$SOURCE_REF"
          echo "OMEGA_RELEASE_ORCHESTRATOR_ROLLOVER_DISPATCHED reason=$REASON source=$SOURCE_SHA ref=$SOURCE_REF"
