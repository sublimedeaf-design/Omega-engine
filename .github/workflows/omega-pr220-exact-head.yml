name: OMEGA PR220 Exact-Head External Gate

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/omega-pr220-exact-head.yml"

permissions:
  contents: read

concurrency:
  group: omega-pr220-exact-head-743f4cab9f356cf02b1c072914ba179b349257f7
  cancel-in-progress: false

env:
  TARGET_SHA: 743f4cab9f356cf02b1c072914ba179b349257f7
  BASE_SHA: be537e7dffde572c038c253c548282cd2e18e799
  PRIVATE_REPOSITORY: sublimedeaf-design/Omega-engines

jobs:
  python311:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: sublimedeaf-design/Omega-engines
          ref: ${{ env.TARGET_SHA }}
          token: ${{ secrets.OMEGA_BOOTSTRAP_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - name: Mark pending
        shell: bash
        env:
          TOKEN: ${{ secrets.OMEGA_BOOTSTRAP_TOKEN }}
        run: |
          set +x
          curl -fsS -o /dev/null -X POST             -H 'Accept: application/vnd.github+json'             -H 'X-GitHub-Api-Version: 2022-11-28'             -H "Authorization: Bearer $TOKEN"             -d '{"state":"pending","context":"omega-external/python311","description":"exact-head Python 3.11 fallback running"}'             "https://api.github.com/repos/$PRIVATE_REPOSITORY/statuses/$TARGET_SHA"
      - name: Exact private Python 3.11 gate
        shell: bash
        run: |
          set -Eeuo pipefail
          run_stage() {
            stage="$1"; shift
            log="$RUNNER_TEMP/python311-$stage.log"
            set +e
            "$@" >"$log" 2>&1
            rc=$?
            set -e
            if [ "$rc" -ne 0 ]; then
              echo "OMEGA_EXTERNAL_PYTHON311_FAIL stage=$stage rc=$rc"
              exit "$rc"
            fi
            echo "OMEGA_EXTERNAL_PYTHON311_STAGE_GREEN stage=$stage"
          }
          run_stage install python -m pip install -c requirements-ci.lock -e '.[dev]'
          run_stage pytest env GITHUB_REPOSITORY="$PRIVATE_REPOSITORY" python -m pytest -q
          run_stage compile python -m compileall -q src scripts
          run_stage pipcheck python -m pip check
          echo "OMEGA_EXTERNAL_PYTHON311_GREEN"
      - name: Publish final status
        if: always()
        shell: bash
        env:
          TOKEN: ${{ secrets.OMEGA_BOOTSTRAP_TOKEN }}
          RESULT: ${{ job.status }}
          RUN_URL: https://github.com/sublimedeaf-design/Omega-engine/actions/runs/${{ github.run_id }}
        run: |
          set +x
          state=failure; [ "$RESULT" = success ] && state=success
          payload="$(python - "$state" "$RUN_URL" <<'PY'
          import json,sys
          print(json.dumps({"state":sys.argv[1],"context":"omega-external/python311","description":"exact-head Python 3.11 fallback "+sys.argv[1],"target_url":sys.argv[2]}))
          PY
          )"
          curl -fsS -o /dev/null -X POST -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d "$payload" "https://api.github.com/repos/$PRIVATE_REPOSITORY/statuses/$TARGET_SHA"

  python314:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: sublimedeaf-design/Omega-engines
          ref: ${{ env.TARGET_SHA }}
          token: ${{ secrets.OMEGA_BOOTSTRAP_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"
      - name: Mark pending
        shell: bash
        env:
          TOKEN: ${{ secrets.OMEGA_BOOTSTRAP_TOKEN }}
        run: |
          set +x
          curl -fsS -o /dev/null -X POST -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json'             -d '{"state":"pending","context":"omega-external/python314","description":"exact-head Python 3.14 fallback running"}'             "https://api.github.com/repos/$PRIVATE_REPOSITORY/statuses/$TARGET_SHA"
      - name: Exact private Python 3.14 gate
        shell: bash
        run: |
          set -Eeuo pipefail
          log="$RUNNER_TEMP/python314.log"
          set +e
          {
            python -m pip install -c requirements-ci.lock -e '.[dev]' &&
            env GITHUB_REPOSITORY="$PRIVATE_REPOSITORY" python -m pytest -q &&
            python -m compileall -q src scripts &&
            python -m pip check
          } >"$log" 2>&1
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then echo "OMEGA_EXTERNAL_PYTHON314_FAIL rc=$rc"; exit "$rc"; fi
          echo "OMEGA_EXTERNAL_PYTHON314_GREEN"
      - name: Publish final status
        if: always()
        shell: bash
        env:
          TOKEN: ${{ secrets.OMEGA_BOOTSTRAP_TOKEN }}
          RESULT: ${{ job.status }}
          RUN_URL: https://github.com/sublimedeaf-design/Omega-engine/actions/runs/${{ github.run_id }}
        run: |
          set +x
          state=failure; [ "$RESULT" = success ] && state=success
          payload="$(python - "$state" "$RUN_URL" <<'PY'
          import json,sys
          print(json.dumps({"state":sys.argv[1],"context":"omega-external/python314","description":"exact-head Python 3.14 fallback "+sys.argv[1],"target_url":sys.argv[2]}))
          PY
          )"
          curl -fsS -o /dev/null -X POST -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d "$payload" "https://api.github.com/repos/$PRIVATE_REPOSITORY/statuses/$TARGET_SHA"

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: sublimedeaf-design/Omega-engines
          ref: ${{ env.TARGET_SHA }}
          token: ${{ secrets.OMEGA_BOOTSTRAP_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: Mark pending
        shell: bash
        env:
          TOKEN: ${{ secrets.OMEGA_BOOTSTRAP_TOKEN }}
        run: |
          set +x
          curl -fsS -o /dev/null -X POST -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json'             -d '{"state":"pending","context":"omega-external/test","description":"exact-head full fallback running"}'             "https://api.github.com/repos/$PRIVATE_REPOSITORY/statuses/$TARGET_SHA"
      - name: Exact private full gate
        shell: bash
        run: |
          set -Eeuo pipefail
          log="$RUNNER_TEMP/test.log"
          set +e
          {
            python -m pip install -c requirements-ci.lock -e '.[dev]' &&
            env GITHUB_REPOSITORY="$PRIVATE_REPOSITORY" python -m pytest -q &&
            python -m compileall -q src scripts &&
            python -m pip check &&
            python scripts/repo_audit.py --out reports/repo-audit-ci.json &&
            python -c "from omega.research.preflight import run_preflight; r=run_preflight('reports/preflight-ci.json'); assert r['passed'], r" &&
            python scripts/final_audit_gate.py --audit reports/repo-audit-ci.json --out reports/final-audit-gate.json
          } >"$log" 2>&1
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then echo "OMEGA_EXTERNAL_TEST_FAIL rc=$rc"; exit "$rc"; fi
          echo "OMEGA_EXTERNAL_TEST_GREEN"
      - name: Publish final status
        if: always()
        shell: bash
        env:
          TOKEN: ${{ secrets.OMEGA_BOOTSTRAP_TOKEN }}
          RESULT: ${{ job.status }}
          RUN_URL: https://github.com/sublimedeaf-design/Omega-engine/actions/runs/${{ github.run_id }}
        run: |
          set +x
          state=failure; [ "$RESULT" = success ] && state=success
          payload="$(python - "$state" "$RUN_URL" <<'PY'
          import json,sys
          print(json.dumps({"state":sys.argv[1],"context":"omega-external/test","description":"exact-head full fallback "+sys.argv[1],"target_url":sys.argv[2]}))
          PY
          )"
          curl -fsS -o /dev/null -X POST -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d "$payload" "https://api.github.com/repos/$PRIVATE_REPOSITORY/statuses/$TARGET_SHA"

  storage-backends:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: sublimedeaf-design/Omega-engines
          ref: ${{ env.TARGET_SHA }}
          token: ${{ secrets.OMEGA_BOOTSTRAP_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: Mark pending
        shell: bash
        env:
          TOKEN: ${{ secrets.OMEGA_BOOTSTRAP_TOKEN }}
        run: |
          set +x
          curl -fsS -o /dev/null -X POST -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json'             -d '{"state":"pending","context":"omega-external/storage-backends","description":"exact-head storage fallback running"}'             "https://api.github.com/repos/$PRIVATE_REPOSITORY/statuses/$TARGET_SHA"
      - name: Exact private storage gate
        shell: bash
        run: |
          set -Eeuo pipefail
          log="$RUNNER_TEMP/storage.log"
          set +e
          {
            python -m pip install -c requirements-ci.lock -e '.[dev,data]' &&
            env GITHUB_REPOSITORY="$PRIVATE_REPOSITORY" python -m pytest -q tests/test_storage.py tests/test_support_runtime_integrity.py &&
            python - <<'PY'
          from omega.research.preflight import run_preflight
          for backend in ("sqlite","duckdb"):
              result=run_preflight(backend=backend)
              assert result["passed"], result
              assert result["storage_backend"]==backend, result
          PY
            python -m pip check
          } >"$log" 2>&1
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then echo "OMEGA_EXTERNAL_STORAGE_FAIL rc=$rc"; exit "$rc"; fi
          echo "OMEGA_EXTERNAL_STORAGE_GREEN"
      - name: Publish final status
        if: always()
        shell: bash
        env:
          TOKEN: ${{ secrets.OMEGA_BOOTSTRAP_TOKEN }}
          RESULT: ${{ job.status }}
          RUN_URL: https://github.com/sublimedeaf-design/Omega-engine/actions/runs/${{ github.run_id }}
        run: |
          set +x
          state=failure; [ "$RESULT" = success ] && state=success
          payload="$(python - "$state" "$RUN_URL" <<'PY'
          import json,sys
          print(json.dumps({"state":sys.argv[1],"context":"omega-external/storage-backends","description":"exact-head storage fallback "+sys.argv[1],"target_url":sys.argv[2]}))
          PY
          )"
          curl -fsS -o /dev/null -X POST -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d "$payload" "https://api.github.com/repos/$PRIVATE_REPOSITORY/statuses/$TARGET_SHA"

  governance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: sublimedeaf-design/Omega-engines
          ref: ${{ env.TARGET_SHA }}
          token: ${{ secrets.OMEGA_BOOTSTRAP_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: Mark pending
        shell: bash
        env:
          TOKEN: ${{ secrets.OMEGA_BOOTSTRAP_TOKEN }}
        run: |
          set +x
          curl -fsS -o /dev/null -X POST -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json'             -d '{"state":"pending","context":"omega-external/governance","description":"exact-head governance fallback running"}'             "https://api.github.com/repos/$PRIVATE_REPOSITORY/statuses/$TARGET_SHA"
      - name: Build private-equivalent governance event
        shell: bash
        run: |
          python - "$RUNNER_TEMP/pr-event.json" "$BASE_SHA" "$TARGET_SHA" <<'PY'
          import json,sys
          path,base,head=sys.argv[1:]
          titles=["Agent / owner","Scope","Base / head","Risk","Verification","Evidence","Temporal integrity","Security","Rollback","Handoff"]
          parts=[]
          for title in titles:
              if title=="Agent / owner":
                  content="Role: release_ci, qa_audit, orchestrator"
              elif title=="Base / head":
                  content=f"Base SHA: {base}\nHead SHA: {head}"
              else:
                  content="external exact-head validation"
              parts.append(f"## {title}\n{content}")
          event={"pull_request":{"body":"\n\n".join(parts),"base":{"sha":base},"head":{"sha":head}}}
          open(path,"w",encoding="utf-8").write(json.dumps(event))
          PY
      - name: Exact private governance gate
        shell: bash
        run: |
          set -Eeuo pipefail
          log="$RUNNER_TEMP/governance.log"
          set +e
          {
            python scripts/validate_agent_handoff.py --self-check --event "$RUNNER_TEMP/pr-event.json" &&
            python scripts/agent_orchestrator.py --agents .omega/agents.json --plan .omega/work-plan.json validate
          } >"$log" 2>&1
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then echo "OMEGA_EXTERNAL_GOVERNANCE_FAIL rc=$rc"; exit "$rc"; fi
          echo "OMEGA_EXTERNAL_GOVERNANCE_GREEN"
      - name: Publish final status
        if: always()
        shell: bash
        env:
          TOKEN: ${{ secrets.OMEGA_BOOTSTRAP_TOKEN }}
          RESULT: ${{ job.status }}
          RUN_URL: https://github.com/sublimedeaf-design/Omega-engine/actions/runs/${{ github.run_id }}
        run: |
          set +x
          state=failure; [ "$RESULT" = success ] && state=success
          payload="$(python - "$state" "$RUN_URL" <<'PY'
          import json,sys
          print(json.dumps({"state":sys.argv[1],"context":"omega-external/governance","description":"exact-head governance fallback "+sys.argv[1],"target_url":sys.argv[2]}))
          PY
          )"
          curl -fsS -o /dev/null -X POST -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d "$payload" "https://api.github.com/repos/$PRIVATE_REPOSITORY/statuses/$TARGET_SHA"
