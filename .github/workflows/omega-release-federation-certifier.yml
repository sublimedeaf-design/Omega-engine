name: OMEGA Release Federation Certifier

on:
  workflow_run:
    workflows: ["OMEGA Federation v3 Peer Bridge"]
    types: [completed]
  workflow_dispatch:
    inputs:
      bridge_run_id:
        description: "Exact successful Federation v3 Peer Bridge run id"
        required: true
        type: string
      bridge_head_sha:
        description: "Exact control-plane SHA used by that bridge run"
        required: true
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: omega-release-federation-certifier
  cancel-in-progress: false
  queue: max

env:
  PRIVATE_REPOSITORY: sublimedeaf-design/Omega-engines
  CONTROL_REPOSITORY: sublimedeaf-design/Omega-engine

jobs:
  certify:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      BRIDGE_RUN_ID: ${{ inputs.bridge_run_id || github.event.workflow_run.id }}
      BRIDGE_HEAD_SHA: ${{ inputs.bridge_head_sha || github.event.workflow_run.head_sha }}
    steps:
      - name: Inspect the exact authority epoch proven by this bridge
        id: epoch
        env:
          GH_TOKEN: ${{ secrets.OMEGA_BOOTSTRAP_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          raw="$(gh api "/repos/$CONTROL_REPOSITORY/contents/federation/epochs/current.json?ref=$BRIDGE_HEAD_SHA" --jq '.content' | python3 -c 'import base64,sys; print(base64.b64decode("".join(sys.stdin.read().split()),validate=True).decode(),end="")')"
          parsed="$(python3 - "$raw" <<'PY'
          import json,re,sys
          d=json.loads(sys.argv[1])
          p=d.get("primary") or {}
          source=str(p.get("source_sha") or "")
          ref=str(p.get("source_ref") or "")
          state=str(d.get("state") or "")
          rollover=d.get("release_rollover") or {}
          if not re.fullmatch(r"[0-9a-f]{40}",source):
              raise SystemExit("OMEGA_RELEASE_CERTIFIER_SOURCE_INVALID")
          safe=bool(re.fullmatch(r"release/[A-Za-z0-9._/-]+",ref)) and ".." not in ref and not ref.startswith("/") and not ref.startswith("-")
          if not safe:
              print("false||||")
          else:
              print("|".join(("true",state,source,ref,str(rollover.get("stage") or ""))))
          PY
          )"
          IFS='|' read -r release_epoch state source source_ref stage <<<"$parsed"
          echo "release_epoch=$release_epoch" >> "$GITHUB_OUTPUT"
          [ "$release_epoch" = true ] || { echo "OMEGA_RELEASE_CERTIFIER_NON_RELEASE_EPOCH"; exit 0; }
          echo "state=$state" >> "$GITHUB_OUTPUT"
          echo "source_sha=$source" >> "$GITHUB_OUTPUT"
          echo "source_ref=$source_ref" >> "$GITHUB_OUTPUT"
          echo "stage=$stage" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        if: steps.epoch.outputs.release_epoch == 'true'
        with:
          pattern: OMEGA-Federation-Peer-Proof-*
          path: ${{ runner.temp }}/release-peer-proofs
          merge-multiple: true
          github-token: ${{ github.token }}
          run-id: ${{ env.BRIDGE_RUN_ID }}

      - name: Require fresh 4-of-4 read-only proofs from this exact bridge run
        if: steps.epoch.outputs.release_epoch == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          run="$(gh api "/repos/$CONTROL_REPOSITORY/actions/runs/$BRIDGE_RUN_ID")"
          RUN_PAYLOAD="$run" BRIDGE_HEAD_SHA="$BRIDGE_HEAD_SHA" python3 <<'PY'
          import json,os
          d=json.loads(os.environ["RUN_PAYLOAD"])
          if d.get("name")!="OMEGA Federation v3 Peer Bridge":
              raise SystemExit("OMEGA_RELEASE_CERTIFIER_BRIDGE_NAME_MISMATCH")
          if d.get("conclusion")!="success" or d.get("head_sha")!=os.environ["BRIDGE_HEAD_SHA"]:
              raise SystemExit("OMEGA_RELEASE_CERTIFIER_BRIDGE_IDENTITY_MISMATCH")
          PY
          epoch="$(gh api "/repos/$CONTROL_REPOSITORY/contents/federation/epochs/current.json?ref=$BRIDGE_HEAD_SHA" --jq '.content' | python3 -c 'import base64,sys; print(base64.b64decode("".join(sys.stdin.read().split()),validate=True).decode(),end="")')"
          EPOCH_PAYLOAD="$epoch" python3 <<'PY'
          import json,os,pathlib
          d=json.loads(os.environ["EPOCH_PAYLOAD"])
          expected={x["repository"]:(x["sha"],x["role"]) for x in d.get("peers") or []}
          source=str((d.get("primary") or {}).get("source_sha") or "")
          rel=d.get("release_epoch") or {}
          epoch_id=str(rel.get("id") or "")
          control_contract=str(rel.get("control_contract_sha") or "")
          sequence=rel.get("sequence")
          if not control_contract or not isinstance(sequence,int) or isinstance(sequence,bool) or sequence < 1:
              raise SystemExit("OMEGA_RELEASE_CERTIFIER_CONTROL_BINDING_INVALID")
          root=pathlib.Path(os.environ["RUNNER_TEMP"])/"release-peer-proofs"
          rows=[json.loads(p.read_text(encoding="utf-8")) for p in root.glob("*.json")]
          if len(rows)!=4:
              raise SystemExit(f"OMEGA_RELEASE_CERTIFIER_PROOF_COUNT:{len(rows)}")
          seen=set()
          for row in rows:
              repo=str(row.get("peer_repository") or "")
              if repo not in expected or repo in seen:
                  raise SystemExit("OMEGA_RELEASE_CERTIFIER_PROOF_SET_INVALID")
              seen.add(repo)
              sha,role=expected[repo]
              if row.get("state")!="PASS" or row.get("peer_sha")!=sha or row.get("peer_role")!=role:
                  raise SystemExit("OMEGA_RELEASE_CERTIFIER_PROOF_IDENTITY_INVALID:"+repo)
              if row.get("source_sha")!=source or str(row.get("release_epoch_id") or "")!=epoch_id:
                  raise SystemExit("OMEGA_RELEASE_CERTIFIER_PROOF_EPOCH_MISMATCH:"+repo)
              if row.get("control_contract_sha")!=control_contract or row.get("release_epoch_sequence")!=sequence:
                  raise SystemExit("OMEGA_RELEASE_CERTIFIER_PROOF_CONTROL_BINDING_MISMATCH:"+repo)
              if row.get("peer_repository_mutated") is not False:
                  raise SystemExit("OMEGA_RELEASE_CERTIFIER_PEER_MUTATION_FLAG_INVALID:"+repo)
          if set(expected)!=seen:
              raise SystemExit("OMEGA_RELEASE_CERTIFIER_PROOF_SET_INCOMPLETE")
          print("OMEGA_RELEASE_CERTIFIER_FRESH_4_OF_4_PASS",source,epoch_id,control_contract,sequence)
          PY

      - name: Promote staged authority to PASS only after external 4-of-4 proof
        id: promote
        if: steps.epoch.outputs.release_epoch == 'true' && steps.epoch.outputs.state == 'NOT_EXECUTED'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.epoch.outputs.source_sha }}
          SOURCE_REF: ${{ steps.epoch.outputs.source_ref }}
        shell: bash
        run: |
          set -Eeuo pipefail
          meta="$(gh api "/repos/$CONTROL_REPOSITORY/contents/federation/epochs/current.json?ref=main")"
          current="$(printf '%s' "$meta" | jq -r '.content' | python3 -c 'import base64,sys; print(base64.b64decode("".join(sys.stdin.read().split()),validate=True).decode(),end="")')"
          blob_sha="$(printf '%s' "$meta" | jq -r '.sha')"
          CURRENT="$current" SOURCE_SHA="$SOURCE_SHA" SOURCE_REF="$SOURCE_REF" BRIDGE_RUN_ID="$BRIDGE_RUN_ID" python3 <<'PY' > "$RUNNER_TEMP/epoch-pass.json"
          import json,os
          d=json.loads(os.environ["CURRENT"])
          p=d.get("primary") or {}
          if d.get("state")!="NOT_EXECUTED" or p.get("source_sha")!=os.environ["SOURCE_SHA"] or p.get("source_ref")!=os.environ["SOURCE_REF"]:
              raise SystemExit("OMEGA_RELEASE_CERTIFIER_AUTHORITY_MOVED")
          d["state"]="PASS"; d["blockers"]=[]
          p["certification_state"]="PASS"
          reason=f"external GitHub-hosted exact-SHA federation v3 peer contract validation PASS in Omega-engine run {os.environ['BRIDGE_RUN_ID']}"
          for row in d["peers"]:
              row["state"]="PASS"; row["contract_state"]="PASS"; row["reason"]=reason
          rr=d.setdefault("release_rollover",{})
          rr["stage"]="CERTIFIED_PASS_PENDING_SECOND_PROOF"
          rr["first_peer_bridge_run_id"]=os.environ["BRIDGE_RUN_ID"]
          print(json.dumps(d,indent=2,ensure_ascii=False))
          PY
          encoded="$(base64 -w0 "$RUNNER_TEMP/epoch-pass.json")"
          response="$(gh api --method PUT "/repos/$CONTROL_REPOSITORY/contents/federation/epochs/current.json" \
            -f message="Federation v3: certify exact release epoch ${SOURCE_SHA:0:12} PASS" \
            -f content="$encoded" -f sha="$blob_sha" -f branch=main)"
          promoted_head_sha="$(printf '%s' "$response" | jq -r '.commit.sha // empty')"
          [[ "$promoted_head_sha" =~ ^[0-9a-f]{40}$ ]] || { echo OMEGA_RELEASE_FEDERATION_PROMOTED_SHA_INVALID >&2; exit 66; }
          echo "promoted_head_sha=$promoted_head_sha" >> "$GITHUB_OUTPUT"
          echo "OMEGA_RELEASE_FEDERATION_AUTHORITY_PROMOTED_PASS source=$SOURCE_SHA control_sha=$promoted_head_sha"

      - name: Explicitly dispatch second independent peer proof
        if: steps.epoch.outputs.release_epoch == 'true' && steps.epoch.outputs.state == 'NOT_EXECUTED'
        env:
          GH_TOKEN: ${{ github.token }}
          PROMOTED_HEAD_SHA: ${{ steps.promote.outputs.promoted_head_sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$PROMOTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo OMEGA_RELEASE_FEDERATION_SECOND_PROOF_REF_INVALID >&2; exit 66; }
          # workflow_dispatch accepts a branch/tag ref, not a raw commit SHA.
          # Dispatch current main; the peer bridge independently rejects any
          # control-plane drift outside the immutable epoch files and proves
          # that the epoch's control_contract_sha is an ancestor of its checkout.
          current_main="$(gh api "/repos/$CONTROL_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          [ "$current_main" = "$PROMOTED_HEAD_SHA" ] || {
            echo "OMEGA_RELEASE_FEDERATION_SECOND_PROOF_MAIN_MOVED:$current_main!=$PROMOTED_HEAD_SHA" >&2
            exit 66
          }
          gh workflow run omega-federation-v3-peer-bridge.yml -R "$CONTROL_REPOSITORY" --ref main
          echo "OMEGA_RELEASE_FEDERATION_SECOND_PROOF_DISPATCHED control_sha=$PROMOTED_HEAD_SHA"

      - name: Trigger exact final-SHA recovery after second PASS bridge
        if: steps.epoch.outputs.release_epoch == 'true' && steps.epoch.outputs.state == 'PASS' && steps.epoch.outputs.stage == 'CERTIFIED_PASS_PENDING_SECOND_PROOF'
        env:
          GH_TOKEN: ${{ github.token }}
          OMEGA_BOOTSTRAP_TOKEN: ${{ secrets.OMEGA_BOOTSTRAP_TOKEN }}
          SOURCE_SHA: ${{ steps.epoch.outputs.source_sha }}
          SOURCE_REF: ${{ steps.epoch.outputs.source_ref }}
        shell: bash
        run: |
          set -Eeuo pipefail
          # Private exact-SHA status uses the restricted cross-repo credential.
          GH_TOKEN="$OMEGA_BOOTSTRAP_TOKEN" gh api --method POST "/repos/$PRIVATE_REPOSITORY/statuses/$SOURCE_SHA" \
            -f state=success -f context="omega/federation-v3-release" \
            -f description="release federation exact-SHA PASS after second external peer proof" \
            -f target_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" >/dev/null

          path="bootstrap/omega/recovery-trigger.txt"
          desired="recover-exact $SOURCE_SHA $SOURCE_REF release-federation-second-proof"
          meta="$(gh api "/repos/$CONTROL_REPOSITORY/contents/$path?ref=main")"
          current="$(printf '%s' "$meta" | jq -r '.content' | python3 -c 'import base64,sys; print(base64.b64decode("".join(sys.stdin.read().split()),validate=True).decode(),end="")' | tr -d '\r\n')"
          if [ "$current" = "$desired" ]; then
            # Idempotent trigger state must not short-circuit the rollover state
            # machine: the second proof still has to be consumed and recovery
            # must be dispatched for this exact certified epoch.
            echo "OMEGA_RELEASE_FINAL_RECOVERY_ALREADY_ARMED source=$SOURCE_SHA"
          else
            blob_sha="$(printf '%s' "$meta" | jq -r '.sha')"
            encoded="$(printf '%s\n' "$desired" | base64 -w0)"
            gh api --method PUT "/repos/$CONTROL_REPOSITORY/contents/$path" \
              -f message="Recovery: prove exact certified release SHA ${SOURCE_SHA:0:12}" \
              -f content="$encoded" -f sha="$blob_sha" -f branch=main >/dev/null
          fi
          # Consume the second-proof transition exactly once. This closes the
          # rollover state machine before dispatching recovery so later peer
          # bridge watchdogs cannot re-arm the same certified release.
          meta="$(gh api "/repos/$CONTROL_REPOSITORY/contents/federation/epochs/current.json?ref=main")"
          current="$(printf '%s' "$meta" | jq -r '.content' | python3 -c 'import base64,sys; print(base64.b64decode("".join(sys.stdin.read().split()),validate=True).decode(),end="")')"
          blob_sha="$(printf '%s' "$meta" | jq -r '.sha')"
          CURRENT="$current" SOURCE_SHA="$SOURCE_SHA" SOURCE_REF="$SOURCE_REF" BRIDGE_RUN_ID="$BRIDGE_RUN_ID" python3 <<'PY' > "$RUNNER_TEMP/epoch-final.json"
          import json,os
          d=json.loads(os.environ["CURRENT"])
          p=d.get("primary") or {}
          rr=d.setdefault("release_rollover",{})
          if d.get("state")!="PASS" or p.get("source_sha")!=os.environ["SOURCE_SHA"] or p.get("source_ref")!=os.environ["SOURCE_REF"]:
              raise SystemExit("OMEGA_RELEASE_CERTIFIER_FINALIZE_AUTHORITY_MOVED")
          if rr.get("stage")!="CERTIFIED_PASS_PENDING_SECOND_PROOF":
              raise SystemExit("OMEGA_RELEASE_CERTIFIER_FINALIZE_STAGE_MOVED")
          rr["stage"]="CERTIFIED_PASS"
          rr["second_peer_bridge_run_id"]=os.environ["BRIDGE_RUN_ID"]
          print(json.dumps(d,indent=2,ensure_ascii=False))
          PY
          encoded="$(base64 -w0 "$RUNNER_TEMP/epoch-final.json")"
          gh api --method PUT "/repos/$CONTROL_REPOSITORY/contents/federation/epochs/current.json" \
            -f message="Federation v3: finalize second proof for ${SOURCE_SHA:0:12}" \
            -f content="$encoded" -f sha="$blob_sha" -f branch=main >/dev/null
          echo "OMEGA_RELEASE_FEDERATION_SECOND_PROOF_FINALIZED source=$SOURCE_SHA bridge_run=$BRIDGE_RUN_ID"

          echo "OMEGA_RELEASE_FINAL_RECOVERY_ARMED source=$SOURCE_SHA ref=$SOURCE_REF"
          gh workflow run omega-hosted-recovery-failover.yml -R "$CONTROL_REPOSITORY" --ref main
          echo "OMEGA_RELEASE_FINAL_RECOVERY_DISPATCHED source=$SOURCE_SHA"
