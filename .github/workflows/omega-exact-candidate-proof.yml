name: OMEGA Exact-SHA Candidate Proof

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/omega-exact-candidate-proof.yml"

permissions:
  contents: read

env:
  PROOF_SCHEMA_REV: "3"
  TARGET_REPOSITORY: sublimedeaf-design/Omega-engines
  OMEGA_REPOSITORY: sublimedeaf-design/Omega-engines

jobs:
  pin:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      target_sha: ${{ steps.pin.outputs.target_sha }}
      base_sha: ${{ steps.pin.outputs.base_sha }}
    env:
      GH_TOKEN: ${{ secrets.OMEGA_BOOTSTRAP_TOKEN }}
    steps:
      - id: pin
        shell: bash
        run: |
          set -Eeuo pipefail
          target_sha="$(gh api /repos/sublimedeaf-design/Omega-engines/commits/main --jq '.sha')"
          base_sha="$(gh api "/repos/sublimedeaf-design/Omega-engines/commits/$target_sha" --jq '.parents[0].sha')"
          [ -n "$target_sha" ] && [ -n "$base_sha" ]
          echo "target_sha=$target_sha" >> "$GITHUB_OUTPUT"
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          echo "OMEGA_EXACT_PIN target=$target_sha base=$base_sha"

  test:
    needs: pin
    env:
      TARGET_SHA: ${{ needs.pin.outputs.target_sha }}
      BASE_SHA: ${{ needs.pin.outputs.base_sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.TARGET_REPOSITORY }}
          ref: ${{ env.TARGET_SHA }}
          token: ${{ secrets.OMEGA_BOOTSTRAP_TOKEN }}
          persist-credentials: false
          path: omega
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - working-directory: omega
        run: python -m pip install -c requirements-ci.lock -e '.[dev]'
      - working-directory: omega
        run: python -m pytest -q
      - working-directory: omega
        run: python -m compileall -q src scripts
      - working-directory: omega
        run: python -m pip check
      - name: Repository integrity audit
        working-directory: omega
        run: python scripts/repo_audit.py --out reports/repo-audit-ci.json
      - name: Runtime preflight
        working-directory: omega
        run: python -c "from omega.research.preflight import run_preflight; r=run_preflight('reports/preflight-ci.json'); assert r['passed'], r"
      - name: Final release audit gate
        working-directory: omega
        run: python scripts/final_audit_gate.py --audit reports/repo-audit-ci.json --out reports/final-audit-gate.json

  python311:
    needs: pin
    env:
      TARGET_SHA: ${{ needs.pin.outputs.target_sha }}
      BASE_SHA: ${{ needs.pin.outputs.base_sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.TARGET_REPOSITORY }}
          ref: ${{ env.TARGET_SHA }}
          token: ${{ secrets.OMEGA_BOOTSTRAP_TOKEN }}
          persist-credentials: false
          path: omega
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - working-directory: omega
        run: python -m pip install -c requirements-ci.lock -e '.[dev]'
      - working-directory: omega
        run: python -m pytest -q
      - working-directory: omega
        run: python -m compileall -q src scripts
      - working-directory: omega
        run: python -m pip check

  python314:
    needs: pin
    env:
      TARGET_SHA: ${{ needs.pin.outputs.target_sha }}
      BASE_SHA: ${{ needs.pin.outputs.base_sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.TARGET_REPOSITORY }}
          ref: ${{ env.TARGET_SHA }}
          token: ${{ secrets.OMEGA_BOOTSTRAP_TOKEN }}
          persist-credentials: false
          path: omega
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"
      - working-directory: omega
        run: python -m pip install -c requirements-ci.lock -e '.[dev]'
      - working-directory: omega
        run: python -m pytest -q
      - working-directory: omega
        run: python -m compileall -q src scripts
      - working-directory: omega
        run: python -m pip check

  storage-backends:
    needs: pin
    env:
      TARGET_SHA: ${{ needs.pin.outputs.target_sha }}
      BASE_SHA: ${{ needs.pin.outputs.base_sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.TARGET_REPOSITORY }}
          ref: ${{ env.TARGET_SHA }}
          token: ${{ secrets.OMEGA_BOOTSTRAP_TOKEN }}
          persist-credentials: false
          path: omega
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - working-directory: omega
        run: python -m pip install -c requirements-ci.lock -e '.[dev,data]'
      - working-directory: omega
        run: python -m pytest -q tests/test_storage.py tests/test_support_runtime_integrity.py
      - name: Exercise SQLite and DuckDB preflight
        working-directory: omega
        run: |
          python - <<'PY'
          from omega.research.preflight import run_preflight
          for backend in ("sqlite","duckdb"):
              result=run_preflight(backend=backend)
              assert result["passed"], result
              assert result["storage_backend"]==backend, result
          PY
      - working-directory: omega
        run: python -m pip check

  governance:
    needs: pin
    env:
      TARGET_SHA: ${{ needs.pin.outputs.target_sha }}
      BASE_SHA: ${{ needs.pin.outputs.base_sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.TARGET_REPOSITORY }}
          ref: ${{ env.TARGET_SHA }}
          token: ${{ secrets.OMEGA_BOOTSTRAP_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: omega
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: Build exact PR event
        working-directory: omega
        run: |
          python - <<'PY'
          import json,os
          body = f"""## Agent / owner
          Role: qa_audit, orchestrator, release_ci

          ## Scope
          Exact-SHA federation auth candidate validation proof.

          ## Base / head
          Base SHA: {os.environ['BASE_SHA']}
          Head SHA: {os.environ['TARGET_SHA']}

          ## Risk
          Fail closed on any governance violation.

          ## Verification
          Reproduce the exact governance validator.

          ## Evidence
          Public hosted runner executes the private exact SHA without publishing private artifacts.

          ## Temporal integrity
          Base and head are pinned immutable commit SHAs.

          ## Security
          Checkout token is secret-scoped and persist-credentials is false.

          ## Rollback
          Delete this public proof workflow.

          ## Handoff
          Continue only after all five candidate proof jobs are green.
          """
          event={"pull_request":{"body":body,"base":{"sha":os.environ["BASE_SHA"]},"head":{"sha":os.environ["TARGET_SHA"]}}}
          with open("/tmp/omega-pr-event.json","w",encoding="utf-8") as fh:
              json.dump(event,fh)
          PY
      - name: Validate control plane and handoff
        working-directory: omega
        run: python scripts/validate_agent_handoff.py --self-check --event /tmp/omega-pr-event.json
      - name: Validate executable multi-agent plan
        working-directory: omega
        run: python scripts/agent_orchestrator.py --agents .omega/agents.json --plan .omega/work-plan.json validate
