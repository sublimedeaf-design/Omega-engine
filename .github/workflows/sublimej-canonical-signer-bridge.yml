name: SublimeJ Canonical Signer Bridge
# UNIFIED_AUTHORITY: signer bridge only; never rebuilds SublimeJ product bytes and never exports the canonical private key.

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact frozen SublimeJ source SHA
        required: true
        type: string
      release_ref:
        description: Exact immutable release/final-* branch
        required: true
        type: string
      phase13_14_run_id:
        description: Exact successful Phase 13-14 Build Once run ID
        required: true
        type: string
      phase13_artifact_digest:
        description: "Exact Phase 13 artifact/release-asset digest including sha256: prefix"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: sublimej-canonical-signer-${{ inputs.source_sha }}
  cancel-in-progress: false

env:
  TARGET_REPOSITORY: sublimedeaf-design/Sublimej
  EXPECTED_FINGERPRINT: 0738b245ec8a557edc0600a6961d7bb2586cc22f886ed5273560ce6ab2db447f

jobs:
  sign-and-handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Validate byte-identical private Phase 13 handoff
        id: handoff
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          RELEASE_REF: ${{ inputs.release_ref }}
          PHASE13_14_RUN_ID: ${{ inputs.phase13_14_run_id }}
          PHASE13_ARTIFACT_DIGEST: ${{ inputs.phase13_artifact_digest }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo SUBLIMEJ_SIGNER_SOURCE_INVALID >&2; exit 64; }
          [[ "$RELEASE_REF" == release/final-* ]] || { echo SUBLIMEJ_SIGNER_RELEASE_REF_INVALID >&2; exit 65; }
          [[ "$PHASE13_14_RUN_ID" =~ ^[0-9]+$ ]] || { echo SUBLIMEJ_SIGNER_PHASE13_RUN_INVALID >&2; exit 66; }
          [[ "$PHASE13_ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo SUBLIMEJ_SIGNER_ARTIFACT_DIGEST_INVALID >&2; exit 67; }

          receipt="handoff/sublimej/$SOURCE_SHA-phase13.json"
          test -s "$receipt" || { echo SUBLIMEJ_SIGNER_HANDOFF_RECEIPT_MISSING >&2; exit 68; }
          RECEIPT="$receipt" SOURCE_SHA="$SOURCE_SHA" RELEASE_REF="$RELEASE_REF" PHASE13_14_RUN_ID="$PHASE13_14_RUN_ID" PHASE13_ARTIFACT_DIGEST="$PHASE13_ARTIFACT_DIGEST" python3 - <<'PY'
          import json,os,pathlib
          r=json.loads(pathlib.Path(os.environ["RECEIPT"]).read_text())
          expected={
            "source_repository":"sublimedeaf-design/Sublimej",
            "source_sha":os.environ["SOURCE_SHA"],
            "release_ref":os.environ["RELEASE_REF"],
            "phase13_14_run_id":int(os.environ["PHASE13_14_RUN_ID"]),
            "source_artifact_digest":os.environ["PHASE13_ARTIFACT_DIGEST"],
            "control_artifact_digest":os.environ["PHASE13_ARTIFACT_DIGEST"],
            "control_repository":"sublimedeaf-design/Omega-engine",
            "control_release_draft":True,
            "signer_certificate_sha256":"0738b245ec8a557edc0600a6961d7bb2586cc22f886ed5273560ce6ab2db447f",
            "verdict":"BYTE_IDENTICAL_PRIVATE_DRAFT_HANDOFF_PASS",
          }
          bad=[k for k,v in expected.items() if r.get(k)!=v]
          if bad: raise SystemExit("SUBLIMEJ_SIGNER_HANDOFF_RECEIPT_MISMATCH:"+",".join(bad))
          if not isinstance(r.get("control_release_id"),int) or not isinstance(r.get("control_asset_id"),int):
              raise SystemExit("SUBLIMEJ_SIGNER_HANDOFF_RECEIPT_IDS_INVALID")
          PY

          release_id="$(jq -r .control_release_id "$receipt")"
          asset_id="$(jq -r .control_asset_id "$receipt")"
          asset_name="$(jq -r .control_asset_name "$receipt")"
          release="$(gh api "/repos/$GITHUB_REPOSITORY/releases/$release_id")"
          RELEASE_JSON="$release" python3 - <<'PY'
          import json,os
          r=json.loads(os.environ["RELEASE_JSON"])
          assert r.get("draft") is True, "SUBLIMEJ_HANDOFF_RELEASE_NOT_DRAFT"
          assert r.get("published_at") is None, "SUBLIMEJ_HANDOFF_RELEASE_WAS_PUBLISHED"
          PY
          asset="$(gh api "/repos/$GITHUB_REPOSITORY/releases/assets/$asset_id")"
          ASSET_JSON="$asset" ASSET_NAME="$asset_name" DIGEST="$PHASE13_ARTIFACT_DIGEST" python3 - <<'PY'
          import json,os
          a=json.loads(os.environ["ASSET_JSON"])
          assert a.get("name")==os.environ["ASSET_NAME"], (a.get("name"),os.environ["ASSET_NAME"])
          assert a.get("state")=="uploaded", a.get("state")
          assert a.get("digest")==os.environ["DIGEST"], (a.get("digest"),os.environ["DIGEST"])
          PY
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"
          echo "asset_id=$asset_id" >> "$GITHUB_OUTPUT"
          echo "asset_name=$asset_name" >> "$GITHUB_OUTPUT"
          echo SUBLIMEJ_SIGNER_PRIVATE_HANDOFF_IDENTITY=PASS

      - name: Download exact Phase 13-14 draft asset
        env:
          GH_TOKEN: ${{ github.token }}
          PHASE13_ARTIFACT_DIGEST: ${{ inputs.phase13_artifact_digest }}
          ASSET_ID: ${{ steps.handoff.outputs.asset_id }}
          ASSET_NAME: ${{ steps.handoff.outputs.asset_name }}
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/phase13" "$RUNNER_TEMP/handoff" dist
          gh api -H "Accept: application/octet-stream" "/repos/$GITHUB_REPOSITORY/releases/assets/$ASSET_ID" > "$RUNNER_TEMP/handoff/$ASSET_NAME"
          test -s "$RUNNER_TEMP/handoff/$ASSET_NAME"
          actual="sha256:$(sha256sum "$RUNNER_TEMP/handoff/$ASSET_NAME" | awk '{print $1}')"
          [ "$actual" = "$PHASE13_ARTIFACT_DIGEST" ] || { echo SUBLIMEJ_SIGNER_HANDOFF_ZIP_DIGEST_MISMATCH >&2; exit 69; }
          unzip -q "$RUNNER_TEMP/handoff/$ASSET_NAME" -d "$RUNNER_TEMP/phase13"
          test -s "$RUNNER_TEMP/phase13/sublimej-phase13-unsigned.apk"
          test -s "$RUNNER_TEMP/phase13/phase13-14-manifest.json"
          test -s "$RUNNER_TEMP/phase13/SHA256SUMS"
          (cd "$RUNNER_TEMP/phase13" && sha256sum --check SHA256SUMS)
          echo SUBLIMEJ_PHASE13_PRIVATE_DRAFT_DOWNLOAD=PASS

      - name: Verify Phase 13-14 manifest and unchanged unsigned bytes
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          RELEASE_REF: ${{ inputs.release_ref }}
          PHASE13_14_RUN_ID: ${{ inputs.phase13_14_run_id }}
        shell: bash
        run: |
          set -Eeuo pipefail
          SOURCE_SHA="$SOURCE_SHA" RELEASE_REF="$RELEASE_REF" PHASE13_14_RUN_ID="$PHASE13_14_RUN_ID" python3 - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path(os.environ["RUNNER_TEMP"])/"phase13"
          m=json.loads((root/"phase13-14-manifest.json").read_text())
          apk=root/"sublimej-phase13-unsigned.apk"
          digest=hashlib.sha256(apk.read_bytes()).hexdigest()
          checks={
            "source":m.get("source_sha")==os.environ["SOURCE_SHA"],
            "release_ref":m.get("release_ref")==os.environ["RELEASE_REF"],
            "run":str(m.get("phase13_14_run_id"))==os.environ["PHASE13_14_RUN_ID"],
            "phase13":m.get("phase13_verdict")=="BUILD_ONCE_UNSIGNED_CANDIDATE_PASS",
            "phase14":m.get("phase14_verdict")=="PROVENANCE_SBOM_PASS",
            "unsigned":m.get("unsigned_apk_sha256")==digest,
            "signing_state":m.get("signing_state")=="UNSIGNED_AWAITING_PHASE15_PERSISTENT_SIGNER",
            "no_rebuild":m.get("rebuild_performed") is False,
          }
          bad=[k for k,v in checks.items() if not v]
          if bad: raise SystemExit("SUBLIMEJ_SIGNER_PHASE13_BINDING_FAILED:"+",".join(bad))
          (pathlib.Path(os.environ["RUNNER_TEMP"])/"unsigned.sha256").write_text(digest+"\n")
          print("SUBLIMEJ_PHASE13_IMMUTABLE_HANDOFF=PASS sha256="+digest)
          PY

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Install exact Android signing tools
        shell: bash
        run: |
          set -Eeuo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "build-tools;36.0.0"

      - name: Use fingerprint-bound hosted escrow when available
        id: hosted
        env:
          OMEGA_ANDROID_KEYSTORE_B64: ${{ secrets.OMEGA_ANDROID_KEYSTORE_B64 }}
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          echo "available=false" >> "$GITHUB_OUTPUT"
          [ -n "${OMEGA_ANDROID_KEYSTORE_B64:-}" ] || { echo SUBLIMEJ_HOSTED_SIGNER_ESCROW_NOT_CONFIGURED; exit 0; }
          key="$(mktemp)"
          trap 'rm -f "$key"' EXIT
          umask 077
          printf '%s' "$OMEGA_ANDROID_KEYSTORE_B64" | base64 -d > "$key"
          actual="$(keytool -list -v -keystore "$key" -storepass android -alias androiddebugkey 2>/dev/null | sed -n 's/.*SHA256: //p' | head -1 | tr -d ':' | tr 'A-F' 'a-f' || true)"
          if [ "$actual" != "$EXPECTED_FINGERPRINT" ]; then
            echo SUBLIMEJ_HOSTED_SIGNER_FINGERPRINT_MISMATCH_FALLBACK
            exit 0
          fi
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign             --ks "$key" --ks-key-alias androiddebugkey             --ks-pass pass:android --key-pass pass:android             --out dist/SublimeJ.apk "$RUNNER_TEMP/phase13/sublimej-phase13-unsigned.apk"
          echo "available=true" >> "$GITHUB_OUTPUT"
          echo "backend=hosted-fingerprint-bound-escrow" >> "$GITHUB_OUTPUT"
          echo SUBLIMEJ_HOSTED_CANONICAL_SIGN=PASS

      - name: Discover isolated canonical signer runtime when hosted escrow is unavailable
        id: wake
        if: steps.hosted.outputs.available != 'true'
        env:
          OMEGA_CODESPACE_LIFECYCLE_TOKEN: ${{ secrets.OMEGA_BOOTSTRAP_TOKEN }}
          OMEGA_FORCE_RESTART: "0"
        shell: bash
        run: python3 bootstrap/omega/codespace_wake.py

      - name: Sign exact unsigned bytes inside isolated canonical signer runtime
        id: remote
        if: steps.hosted.outputs.available != 'true' && steps.wake.outputs.runtime_available == 'true'
        env:
          GH_TOKEN: ${{ secrets.OMEGA_BOOTSTRAP_TOKEN }}
          OMEGA_CODESPACE_NAME: ${{ steps.wake.outputs.codespace_name }}
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          unsigned="$RUNNER_TEMP/phase13/sublimej-phase13-unsigned.apk"
          base64 -w0 "$unsigned" | timeout 120s gh codespace ssh -c "$OMEGA_CODESPACE_NAME" -- bash -c 'base64 -d > /tmp/sublimej-release-unsigned.apk'
          {
            printf 'export SUBLIMEJ_EXPECTED_SIGNER=%q\n' "$EXPECTED_FINGERPRINT"
            cat <<'REMOTE'
          set -Eeuo pipefail
          set +x
          key="$HOME/.android/debug.keystore"
          [ -s "$key" ] || { echo SUBLIMEJ_REMOTE_SIGNER_KEY_MISSING >&2; exit 37; }
          actual="$(keytool -list -v -keystore "$key" -storepass android -alias androiddebugkey 2>/dev/null | sed -n 's/.*SHA256: //p' | head -1 | tr -d ':' | tr 'A-F' 'a-f')"
          [ "$actual" = "$SUBLIMEJ_EXPECTED_SIGNER" ] || { echo SUBLIMEJ_REMOTE_SIGNER_FINGERPRINT_MISMATCH >&2; exit 38; }
          apksigner="${ANDROID_HOME:-$HOME/android-sdk}/build-tools/36.0.0/apksigner"
          if [ ! -x "$apksigner" ]; then
            apksigner="$(find "${ANDROID_HOME:-$HOME/android-sdk}/build-tools" -type f -name apksigner 2>/dev/null | sort -V | tail -1)"
          fi
          [ -x "$apksigner" ] || { echo SUBLIMEJ_REMOTE_APKSIGNER_MISSING >&2; exit 39; }
          rm -f /tmp/sublimej-release-signed.apk
          "$apksigner" sign             --ks "$key" --ks-key-alias androiddebugkey             --ks-pass pass:android --key-pass pass:android             --out /tmp/sublimej-release-signed.apk /tmp/sublimej-release-unsigned.apk
          "$apksigner" verify --verbose --print-certs /tmp/sublimej-release-signed.apk > /tmp/sublimej-signer-verify.txt
          signed="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' /tmp/sublimej-signer-verify.txt | head -1 | tr -d ':' | tr 'A-F' 'a-f')"
          [ "$signed" = "$SUBLIMEJ_EXPECTED_SIGNER" ] || { echo SUBLIMEJ_REMOTE_SIGNED_CERT_MISMATCH >&2; exit 40; }
          echo SUBLIMEJ_REMOTE_CANONICAL_SIGN=PASS
          REMOTE
          } | timeout 120s gh codespace ssh -c "$OMEGA_CODESPACE_NAME" -- bash -s
          timeout 120s gh codespace ssh -c "$OMEGA_CODESPACE_NAME" -- bash -c 'base64 -w0 /tmp/sublimej-release-signed.apk' > "$RUNNER_TEMP/sublimej-signed.b64"
          base64 -d "$RUNNER_TEMP/sublimej-signed.b64" > dist/SublimeJ.apk
          rm -f "$RUNNER_TEMP/sublimej-signed.b64"
          timeout 30s gh codespace ssh -c "$OMEGA_CODESPACE_NAME" -- bash -c 'rm -f /tmp/sublimej-release-unsigned.apk /tmp/sublimej-release-signed.apk /tmp/sublimej-signer-verify.txt' || true
          echo "available=true" >> "$GITHUB_OUTPUT"
          echo "backend=isolated-private-signer-runtime" >> "$GITHUB_OUTPUT"

      - name: Fail closed when no canonical signer backend is available
        if: steps.hosted.outputs.available != 'true' && steps.wake.outputs.runtime_available != 'true'
        shell: bash
        run: |
          echo SUBLIMEJ_CANONICAL_SIGNER_UNAVAILABLE >&2
          exit 41

      - name: Independently verify signed APK and build Phase 15-16 manifest
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          RELEASE_REF: ${{ inputs.release_ref }}
          PHASE13_14_RUN_ID: ${{ inputs.phase13_14_run_id }}
          HOSTED_AVAILABLE: ${{ steps.hosted.outputs.available }}
          HOSTED_BACKEND: ${{ steps.hosted.outputs.backend }}
          REMOTE_BACKEND: ${{ steps.remote.outputs.backend }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -s dist/SublimeJ.apk
          out="$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs dist/SublimeJ.apk)"
          actual="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' <<<"$out" | head -1 | tr -d ':' | tr 'A-F' 'a-f')"
          [ "$actual" = "$EXPECTED_FINGERPRINT" ] || { echo SUBLIMEJ_SIGNED_APK_CERT_MISMATCH >&2; exit 42; }
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 dist/SublimeJ.apk >/dev/null

          unsigned_now="$(sha256sum "$RUNNER_TEMP/phase13/sublimej-phase13-unsigned.apk" | awk '{print $1}')"
          unsigned_expected="$(cat "$RUNNER_TEMP/unsigned.sha256")"
          [ "$unsigned_now" = "$unsigned_expected" ] || { echo SUBLIMEJ_UNSIGNED_INPUT_MUTATED >&2; exit 43; }
          signed_sha="$(sha256sum dist/SublimeJ.apk | awk '{print $1}')"
          printf '%s  %s\n' "$signed_sha" "SublimeJ.apk" > dist/SublimeJ.apk.sha256
          backend="$REMOTE_BACKEND"
          [ "$HOSTED_AVAILABLE" = true ] && backend="$HOSTED_BACKEND"
          SOURCE_SHA="$SOURCE_SHA" RELEASE_REF="$RELEASE_REF" PHASE13_14_RUN_ID="$PHASE13_14_RUN_ID" UNSIGNED_SHA="$unsigned_expected" SIGNED_SHA="$signed_sha" BACKEND="$backend" python3 - <<'PY'
          import json,os,pathlib
          payload={
            "schema_version":1,
            "project":"omega-sublimej-unified",
            "source_sha":os.environ["SOURCE_SHA"],
            "release_ref":os.environ["RELEASE_REF"],
            "phase13_14_run_id":int(os.environ["PHASE13_14_RUN_ID"]),
            "phase15_16_run_id":int(os.environ["GITHUB_RUN_ID"]),
            "unsigned_apk_sha256":os.environ["UNSIGNED_SHA"],
            "signed_apk_sha256":os.environ["SIGNED_SHA"],
            "signer_certificate_sha256":os.environ["EXPECTED_FINGERPRINT"],
            "signer_backend":os.environ["BACKEND"],
            "signing_operation_count":1,
            "phase15_verdict":"PERSISTENT_SIGNER_PASS",
            "phase16_verdict":"SAME_UNSIGNED_INPUT_SIGNED_ONCE_PASS",
            "rebuild_performed":False,
            "private_key_exported":False,
          }
          pathlib.Path("dist/phase15-16-manifest.json").write_text(json.dumps(payload,indent=2,sort_keys=True)+"\n")
          PY
          (
            cd dist
            sha256sum SublimeJ.apk SublimeJ.apk.sha256 phase15-16-manifest.json > SHA256SUMS
            sha256sum --check SHA256SUMS
          )
          echo "SIGNED_SHA256=$signed_sha" >> "$GITHUB_ENV"
          echo "SUBLIMEJ_PHASE15_PERSISTENT_SIGNER=PASS"
          echo "SUBLIMEJ_PHASE16_SAME_UNSIGNED_INPUT_SIGNED_ONCE=PASS"

      - name: Publish private donor-local signed draft handoff
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          tag="sublimej-signed-handoff-${SOURCE_SHA:0:8}-$GITHUB_RUN_ID"
          gh release create "$tag" -R "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "SublimeJ signed private handoff ${SOURCE_SHA:0:12}" \
            --notes "DRAFT ONLY. Signed Phase 15/16 handoff. Never publish. SublimeJ source: $SOURCE_SHA. No rebuild; private key not exported." \
            --draft --prerelease \
            dist/SublimeJ.apk dist/SublimeJ.apk.sha256 dist/phase15-16-manifest.json dist/SHA256SUMS
          release_id="$(gh api --paginate "/repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | select(.draft==true and .tag_name=="'"$tag"'") | .id')"
          [ "$(printf '%s\n' "$release_id" | sed '/^$/d' | wc -l)" -eq 1 ] || { echo SUBLIMEJ_SIGNED_DRAFT_RELEASE_NOT_UNIQUE >&2; exit 44; }
          release="$(gh api "/repos/$GITHUB_REPOSITORY/releases/$release_id")"
          RELEASE_JSON="$release" SOURCE_SHA="$SOURCE_SHA" SIGNED_SHA256="$SIGNED_SHA256" python3 - <<'PY'
          import json,os
          r=json.loads(os.environ["RELEASE_JSON"])
          assert r.get("draft") is True and r.get("published_at") is None
          names={a.get("name"):a for a in (r.get("assets") or [])}
          for name in ("SublimeJ.apk","SublimeJ.apk.sha256","phase15-16-manifest.json","SHA256SUMS"):
              assert name in names and names[name].get("state")=="uploaded", name
          digest=names["SublimeJ.apk"].get("digest")
          assert digest=="sha256:"+os.environ["SIGNED_SHA256"], (digest,os.environ["SIGNED_SHA256"])
          PY
          echo "SIGNED_DRAFT_RELEASE_ID=$release_id" >> "$GITHUB_ENV"
          echo "DONOR_RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          echo SUBLIMEJ_DONOR_SIGNED_PRIVATE_HANDOFF=PASS

      - name: Mark signed handoff ready for canonical SublimeJ controller
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          RELEASE_REF: ${{ inputs.release_ref }}
          PHASE13_14_RUN_ID: ${{ inputs.phase13_14_run_id }}
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "SUBLIMEJ_SIGNED_HANDOFF_READY=PASS"
          echo "SOURCE_SHA=$SOURCE_SHA"
          echo "RELEASE_REF=$RELEASE_REF"
          echo "PHASE13_14_RUN_ID=$PHASE13_14_RUN_ID"
          echo "PHASE15_16_RUN_ID=$GITHUB_RUN_ID"
          echo "DONOR_RELEASE_TAG=$DONOR_RELEASE_TAG"
          echo "SIGNED_SHA256=$SIGNED_SHA256"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: SublimeJ-Phase15-16-${{ inputs.source_sha }}
          retention-days: 1
          if-no-files-found: error
          path: |
            dist/SublimeJ.apk
            dist/SublimeJ.apk.sha256
            dist/phase15-16-manifest.json
            dist/SHA256SUMS
