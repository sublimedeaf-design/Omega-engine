name: OMEGA Recovery Evidence Release Stager

on:
  workflow_dispatch:
    inputs:
      evidence_run_id:
        description: "Exact successful OMEGA Candidate Evidence Root run id"
        required: true
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: omega-recovery-evidence-release-stager
  cancel-in-progress: false
  queue: max

env:
  PRIVATE_REPOSITORY: sublimedeaf-design/Omega-engines

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Resolve scoped private release authority
        id: authority
        env:
          RELEASE_APP_CLIENT_ID: ${{ vars.OMEGA_RELEASE_APP_CLIENT_ID }}
          RELEASE_APP_PRIVATE_KEY: ${{ secrets.OMEGA_RELEASE_APP_PRIVATE_KEY }}
        shell: bash
        run: |
          set -Eeuo pipefail
          configured=false
          if [ -n "${RELEASE_APP_CLIENT_ID:-}" ] && [ -n "${RELEASE_APP_PRIVATE_KEY:-}" ]; then configured=true; fi
          echo "configured=$configured" >> "$GITHUB_OUTPUT"

      - name: Mint scoped private release token
        id: release_app
        if: steps.authority.outputs.configured == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.OMEGA_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.OMEGA_RELEASE_APP_PRIVATE_KEY }}
          owner: sublimedeaf-design
          repositories: Omega-engines
          permission-contents: write
          permission-statuses: write

      - name: Select private release token
        env:
          APP_TOKEN: ${{ steps.release_app.outputs.token }}
          LEGACY_TOKEN: ${{ secrets.OMEGA_BOOTSTRAP_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          token="${APP_TOKEN:-}"
          [ -n "$token" ] || token="${LEGACY_TOKEN:-}"
          [ -n "$token" ] || { echo OMEGA_RELEASE_AUTHORITY_MISSING >&2; exit 77; }
          echo "::add-mask::$token"
          echo "OMEGA_PRIVATE_RELEASE_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Resolve and verify immutable evidence root
        id: proof
        env:
          GH_TOKEN: ${{ github.token }}
          PRIVATE_GH_TOKEN: ${{ env.OMEGA_PRIVATE_RELEASE_TOKEN }}
          EVIDENCE_RUN_ID: ${{ inputs.evidence_run_id }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$EVIDENCE_RUN_ID" =~ ^[0-9]+$ ]] || { echo OMEGA_RELEASE_STAGER_RUN_ID_INVALID >&2; exit 64; }
          echo "OMEGA_RELEASE_STAGER_EXPLICIT_HANDOFF run=$EVIDENCE_RUN_ID"
          run="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$EVIDENCE_RUN_ID")"
          RUN="$run" python3 - <<'PY'
          import json,os
          r=json.loads(os.environ["RUN"])
          if r.get("name")!="OMEGA Candidate Evidence Root" or r.get("status")!="completed" or r.get("conclusion")!="success":
              raise SystemExit("OMEGA_RELEASE_STAGER_EVIDENCE_RUN_NOT_SUCCESS")
          PY
          artifacts="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$EVIDENCE_RUN_ID/artifacts?per_page=100")"
          row="$(ARTIFACTS="$artifacts" python3 - <<'PY'
          import json,os,re
          p=json.loads(os.environ["ARTIFACTS"])
          rows=[]
          for a in p.get("artifacts",[]):
              m=re.fullmatch(r"omega-candidate-evidence-root-([0-9a-f]{40})",str(a.get("name") or ""))
              if m and not a.get("expired"): rows.append((m.group(1),str(a.get("name"))))
          if not rows: raise SystemExit("OMEGA_RELEASE_STAGE_NOT_EXECUTED_NO_EVIDENCE_ARTIFACT")
          if len(rows)!=1: raise SystemExit("OMEGA_RELEASE_STAGER_EVIDENCE_ARTIFACT_AMBIGUOUS")
          print("|".join(rows[0]))
          PY
          )"
          IFS='|' read -r source artifact <<<"$row"
          mkdir -p "$RUNNER_TEMP/root"
          gh run download "$EVIDENCE_RUN_ID" -R "$GITHUB_REPOSITORY" -n "$artifact" -D "$RUNNER_TEMP/root"
          root="$(find "$RUNNER_TEMP/root" -type f -name candidate-evidence-root.json -print -quit)"
          att="$(find "$RUNNER_TEMP/root" -type f -name recovery-attestation.json -print -quit)"
          test -s "$root"; test -s "$att"
          proof="$(python3 - "$root" "$att" "$source" <<'PY'
          import json,re,sys
          root=json.load(open(sys.argv[1],encoding="utf-8"))
          att=json.load(open(sys.argv[2],encoding="utf-8"))
          source=sys.argv[3]
          if root.get("state")!="PASS" or root.get("source_sha")!=source:
              raise SystemExit("OMEGA_RELEASE_STAGER_ROOT_NOT_PASS")
          pred=att.get("predicate") or {}
          if att.get("_type")!="https://in-toto.io/Statement/v1" or pred.get("result")!="PASS" or pred.get("source_sha")!=source:
              raise SystemExit("OMEGA_RELEASE_STAGER_RECOVERY_ATTESTATION_NOT_PASS")
          recovery=str((root.get("materials") or {}).get("recovery_run_id") or "")
          xid=str(root.get("omega_execution_id") or "")
          if not re.fullmatch(r"[0-9]+",recovery): raise SystemExit("OMEGA_RELEASE_STAGER_RECOVERY_RUN_INVALID")
          if not re.fullmatch(r"[0-9a-f]{64}",xid) or pred.get("omega_execution_id")!=xid:
              raise SystemExit("OMEGA_RELEASE_STAGER_EXECUTION_ID_MISMATCH")
          print(recovery+"|"+xid)
          PY
          )"
          IFS='|' read -r recovery xid <<<"$proof"
          statuses="$(GH_TOKEN="$PRIVATE_GH_TOKEN" gh api "/repos/$PRIVATE_REPOSITORY/commits/$source/status?per_page=100")"
          STATUS="$statuses" RECOVERY="$recovery" EVIDENCE="$EVIDENCE_RUN_ID" python3 - <<'PY'
          import json,os
          p=json.loads(os.environ["STATUS"]); latest={}
          for row in p.get("statuses",[]):
              ctx=str(row.get("context") or "")
              stamp=str(row.get("updated_at") or row.get("created_at") or "")
              if ctx and (ctx not in latest or stamp>str(latest[ctx].get("_omega_stamp") or "")): latest[ctx]={**row,"_omega_stamp":stamp}
          required=("omega/hosted-ci/python311","omega/hosted-ci/python313","omega/hosted-ci/python314",
                    "omega/hosted-ci/storage","omega/hosted-governance","omega/hosted-android",
                    "omega/hosted-recovery","omega/recovery-attestation","omega/candidate-evidence-root")
          bad=[x for x in required if (latest.get(x) or {}).get("state")!="success"]
          if bad: raise SystemExit("OMEGA_RELEASE_STAGER_REQUIRED_STATUS_NOT_PASS:"+",".join(bad))
          for ctx in ("omega/hosted-recovery","omega/recovery-attestation"):
              if not str((latest.get(ctx) or {}).get("target_url") or "").endswith("/actions/runs/"+os.environ["RECOVERY"]):
                  raise SystemExit("OMEGA_RELEASE_STAGER_RECOVERY_RUN_BINDING_MISMATCH:"+ctx)
          if not str((latest.get("omega/candidate-evidence-root") or {}).get("target_url") or "").endswith("/actions/runs/"+os.environ["EVIDENCE"]):
              raise SystemExit("OMEGA_RELEASE_STAGER_EVIDENCE_RUN_BINDING_MISMATCH")
          PY
          echo "source_sha=$source" >> "$GITHUB_OUTPUT"
          echo "recovery_run_id=$recovery" >> "$GITHUB_OUTPUT"
          echo "omega_execution_id=$xid" >> "$GITHUB_OUTPUT"

      - name: Create immutable release ref at exact proven source
        id: ref
        env:
          GH_TOKEN: ${{ env.OMEGA_PRIVATE_RELEASE_TOKEN }}
          SOURCE_SHA: ${{ steps.proof.outputs.source_sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          release_ref="release/code19-${SOURCE_SHA:0:8}"
          current="$(gh api "/repos/$PRIVATE_REPOSITORY/commits/$release_ref" --jq .sha 2>/dev/null || true)"
          if [ -z "$current" ]; then
            gh api --method POST "/repos/$PRIVATE_REPOSITORY/git/refs" -f ref="refs/heads/$release_ref" -f sha="$SOURCE_SHA" >/dev/null
          elif [ "$current" != "$SOURCE_SHA" ]; then
            echo "OMEGA_RELEASE_STAGER_REF_COLLISION:$release_ref:$current!=$SOURCE_SHA" >&2
            exit 66
          fi
          test "$(gh api "/repos/$PRIVATE_REPOSITORY/commits/$release_ref" --jq .sha)" = "$SOURCE_SHA"
          echo "source_ref=$release_ref" >> "$GITHUB_OUTPUT"
          echo "OMEGA_RELEASE_STAGED_READ_ONLY source=$SOURCE_SHA ref=$release_ref"

      - name: Publish promotion-only evidence status
        env:
          GH_TOKEN: ${{ env.OMEGA_PRIVATE_RELEASE_TOKEN }}
          SOURCE_SHA: ${{ steps.proof.outputs.source_sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          gh api --method POST "/repos/$PRIVATE_REPOSITORY/statuses/$SOURCE_SHA" \
            -f state=success -f context="omega/release-evidence-staged" \
            -f description="STAGED_READ_ONLY: exact evidence promoted without source or artifact rebuild" \
            -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null

      - name: Pin validation and recovery to the same immutable SHA
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.proof.outputs.source_sha }}
          SOURCE_REF: ${{ steps.ref.outputs.source_ref }}
        shell: bash
        run: |
          set -Eeuo pipefail
          update() {
            local path="$1" payload="$2" message="$3"
            local meta sha encoded
            meta="$(gh api "/repos/$GITHUB_REPOSITORY/contents/$path?ref=main")"
            sha="$(printf '%s' "$meta" | jq -r .sha)"
            encoded="$(printf '%s\n' "$payload" | base64 -w0)"
            gh api --method PUT "/repos/$GITHUB_REPOSITORY/contents/$path" \
              -f message="$message" -f content="$encoded" -f sha="$sha" -f branch=main >/dev/null
          }
          update bootstrap/omega/pr-validation-trigger.txt \
            "validate-exact-pr $SOURCE_SHA $SOURCE_REF immutable-release-stager" \
            "Validation: pin immutable code19 release"
          update bootstrap/omega/recovery-trigger.txt \
            "recover-exact $SOURCE_SHA $SOURCE_REF immutable-release-stager" \
            "Recovery: pin immutable code19 release"
          gh workflow run omega-private-pr-hosted-bridge.yml -R "$GITHUB_REPOSITORY" --ref main
          gh workflow run omega-hosted-recovery-failover.yml -R "$GITHUB_REPOSITORY" --ref main
          echo "OMEGA_RELEASE_IMMUTABLE_GATES_DISPATCHED source=$SOURCE_SHA ref=$SOURCE_REF"
